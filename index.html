<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Räknelandet – ett färgglatt mattespel för barn. Egen profil, en karta med 15 banor som låses upp en i taget, uppläsning på svenska, guldmynt, stjärnor och märken.">
<meta name="theme-color" content="#62CDF2">

<!-- Läggs spelet till på hemskärmen ska det se ut och bete sig som en app -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./ikon-192.png" sizes="192x192">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Räknelandet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="Räknelandet">
<title>Räknelandet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600..800&family=Lilita+One&family=Nunito:wght@700;800&display=swap">
<style>
/* ─────────────────────────────────────────────
   RÄKNELANDET — leksaksvärld i klistermärkesstil
   Medvetet enfärgstema (inget mörkt läge): en
   solig lekvärld ska se likadan ut överallt.
   ───────────────────────────────────────────── */
:root{
  color-scheme: light;

  /* Bläck & neutraler (lila-stick, aldrig rent grått) */
  --ink:        #2E1A66;
  --ink-2:      #5B47A0;
  --paper:      #FFFDF7;
  --paper-2:    #F0EAFF;
  --locked:     #C6BBDF;

  /* Lekvärldens färger */
  --sky:        #62CDF2;
  --sky-hi:     #A6E7FF;
  --sky-deep:   #2FA9D8;
  --grass:      #57C96B;
  --grass-deep: #3E9E51;
  --sun:        #FFC42E;
  --sun-deep:   #E29A00;
  --melon:      #FF6B6B;
  --melon-deep: #DD4747;
  --bubble:     #FF8AD0;
  --grape:      #9061F9;

  /* Djup */
  --lift:    0 6px 0 var(--ink), 0 12px 20px rgba(46,26,102,.22);
  --lift-sm: 0 4px 0 var(--ink), 0 8px 14px rgba(46,26,102,.18);
  --stroke:  3px solid var(--ink);

  /* Typskala */
  --t-xs: .78rem;
  --t-sm: .95rem;
  --t-md: 1.15rem;
  --t-lg: 1.6rem;
  --t-xl: 2.3rem;
  --t-2xl: clamp(2.4rem, 8.5vw, 4rem);
}

*{ box-sizing: border-box; }
html, body{ height: 100%; }

body{
  margin: 0;
  font-family: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  font-weight: 700;
  color: var(--ink);
  background: var(--sky);
  background-image:
    radial-gradient(circle at 18% 12%, rgba(255,255,255,.55) 0 42px, transparent 43px),
    radial-gradient(circle at 24% 15%, rgba(255,255,255,.55) 0 30px, transparent 31px),
    radial-gradient(circle at 82% 22%, rgba(255,255,255,.42) 0 34px, transparent 35px),
    radial-gradient(circle at 76% 25%, rgba(255,255,255,.42) 0 24px, transparent 25px),
    linear-gradient(180deg, var(--sky-hi) 0%, var(--sky) 46%, #7FD9F6 100%);
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

.world{ position: fixed; inset: auto 0 0 0; height: 26vh; min-height: 130px; pointer-events: none; z-index: 0; }
.world .hill{ position: absolute; bottom: -40%; border-radius: 50% 50% 0 0; }
.world .hill.a{ left: -12%; width: 62%; height: 150%; background: var(--grass); opacity: .85; }
.world .hill.b{ right: -14%; width: 68%; height: 130%; background: var(--grass-deep); opacity: .8; }
.world .hill.c{ left: 26%; width: 55%; height: 105%; background: #6BD97E; opacity: .9; }
body.on-map .world{ display: none; }

#app{
  position: relative; z-index: 1;
  max-width: 780px; margin: 0 auto;
  /* Plats för iPhonens hack och hemknappsstreck när spelet körs som app */
  padding: max(clamp(12px, 3vw, 24px), env(safe-area-inset-top))
           max(clamp(12px, 3vw, 20px), env(safe-area-inset-right))
           max(40px, calc(env(safe-area-inset-bottom) + 20px))
           max(clamp(12px, 3vw, 20px), env(safe-area-inset-left));
  min-height: 100%;
}
.screen{ display: none; animation: screen-in .35s cubic-bezier(.2,1.3,.5,1) both; }
.screen.is-active{ display: block; }
#screen-game.is-active,
#screen-result.is-active{
  display: flex; flex-direction: column;
  min-height: calc(100vh - 110px);
  min-height: calc(100dvh - 110px);
}
#screen-result.is-active{ justify-content: center; }
@keyframes screen-in{ from{ opacity: 0; transform: translateY(14px) scale(.98); } to{ opacity: 1; transform: none; } }

h1, h2, h3{ font-family: "Baloo 2", "Baloo 2 Fallback", system-ui, sans-serif; font-weight: 800; margin: 0; line-height: 1.05; text-wrap: balance; }

.brand{ text-align: center; margin-bottom: clamp(14px, 3.5vw, 22px); }
.brand h1{
  font-size: var(--t-2xl); color: var(--paper); letter-spacing: -.01em;
  -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill;
  text-shadow: 0 7px 0 var(--ink);
}
.brand .tagline{
  margin: 10px auto 0; display: inline-block; padding: 5px 16px;
  background: var(--sun); border: var(--stroke); border-radius: 999px;
  box-shadow: var(--lift-sm); font-size: var(--t-sm);
}

.panel{
  background: var(--paper); border: var(--stroke); border-radius: 26px;
  box-shadow: var(--lift); padding: clamp(14px, 3vw, 20px);
  margin-bottom: clamp(14px, 3vw, 22px);
}
.panel-title{ display: flex; align-items: center; gap: 10px; font-size: var(--t-lg); margin-bottom: 14px; }
.step{
  flex: none; width: 34px; height: 34px; display: grid; place-items: center;
  background: var(--grape); color: #fff; border: var(--stroke); border-radius: 50%;
  font-family: "Lilita One", system-ui, sans-serif; font-size: 1.15rem; line-height: 1; padding-top: 2px;
}

/* ── Leksaksknapp ───────────────────────── */
.btn{
  font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800;
  color: var(--ink); background: var(--paper);
  border: var(--stroke); border-radius: 20px; box-shadow: var(--lift);
  cursor: pointer; padding: 12px 20px; font-size: var(--t-md);
  touch-action: manipulation;
  transition: transform .09s ease, box-shadow .09s ease, background-color .15s ease;
  -webkit-user-select: none; user-select: none;
}
.btn:active{ transform: translateY(6px); box-shadow: 0 0 0 var(--ink), 0 3px 8px rgba(46,26,102,.2); }
.btn:focus-visible{ outline: 4px dashed var(--grape); outline-offset: 4px; }
.btn-big{
  display: block; width: 100%; padding: 18px;
  font-size: clamp(1.5rem, 5.5vw, 2.1rem); background: var(--sun); border-radius: 26px;
}
.btn-big:hover{ background: #FFD35E; }
.btn-big.pulse{ animation: play-pulse 2.4s ease-in-out infinite; }
@keyframes play-pulse{ 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.025); } }
.btn[disabled]{ opacity: .5; cursor: default; }

.icon-btn{
  width: 46px; height: 46px; padding: 0; display: grid; place-items: center;
  border-radius: 16px; background: var(--paper); border: var(--stroke);
  box-shadow: var(--lift-sm); cursor: pointer; touch-action: manipulation;
  transition: transform .09s ease, box-shadow .09s ease;
}
.icon-btn:active{ transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
.icon-btn:focus-visible{ outline: 4px dashed var(--grape); outline-offset: 3px; }
.icon-btn svg{ width: 26px; height: 26px; }

/* ── Spelarval ──────────────────────────── */
.profile-list{ display: grid; gap: 10px; margin-bottom: 14px; }
.profile-card{
  display: grid; grid-template-columns: 62px 1fr auto; align-items: center; gap: 12px;
  background: var(--paper-2); border: var(--stroke); border-radius: 22px;
  box-shadow: var(--lift-sm); padding: 10px 14px; cursor: pointer;
  font-family: inherit; color: inherit; text-align: left; touch-action: manipulation;
  transition: transform .12s ease, box-shadow .12s ease, background-color .15s ease;
}
.profile-card:hover{ background: #FFF3C9; }
.profile-card:active{ transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
.profile-card:focus-visible{ outline: 4px dashed var(--grape); outline-offset: 3px; }
.profile-card svg{ width: 62px; height: auto; }
.profile-card .p-name{ font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; font-size: var(--t-lg); line-height: 1.1; }
.profile-card .p-meta{ font-size: var(--t-xs); color: var(--ink-2); }
.p-go{
  width: 40px; height: 40px; border-radius: 50%; background: var(--grass);
  border: var(--stroke); display: grid; place-items: center; flex: none;
}
.p-go svg{ width: 22px; height: 22px; }

/* ── Namnfält ───────────────────────────── */
.name-field{
  width: 100%; padding: 14px 18px;
  font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800;
  font-size: clamp(1.4rem, 6vw, 2rem); text-align: center;
  color: var(--ink); background: var(--paper-2);
  border: var(--stroke); border-radius: 20px; box-shadow: inset 0 3px 0 rgba(46,26,102,.1);
}
.name-field::placeholder{ color: rgba(46,26,102,.3); }
.name-field:focus{ outline: 4px dashed var(--grape); outline-offset: 3px; background: #FFF9E6; }

/* ── Figurval ───────────────────────────── */
.pick-grid{ display: grid; gap: 10px; }
.char-grid{ grid-template-columns: repeat(3, 1fr); }
@media (min-width: 560px){ .char-grid{ grid-template-columns: repeat(6, 1fr); } }
.char-card{
  background: var(--paper-2); border: var(--stroke); border-radius: 20px;
  box-shadow: var(--lift-sm); padding: 8px 4px 6px;
  display: grid; justify-items: center; gap: 2px; cursor: pointer;
  touch-action: manipulation;
  transition: transform .12s ease, box-shadow .12s ease, background-color .15s ease;
}
.char-card svg{ width: 100%; max-width: 76px; height: auto; display: block; }
.char-card .char-name{ font-size: var(--t-xs); font-weight: 800; }
.char-card[aria-pressed="true"]{ background: var(--sun); transform: translateY(-3px); box-shadow: 0 8px 0 var(--ink), 0 14px 18px rgba(46,26,102,.24); }
.char-card:focus-visible{ outline: 4px dashed var(--grape); outline-offset: 3px; }

/* ── Kartans topprad ────────────────────── */
.top-bar{
  position: sticky; top: 0; z-index: 20;
  display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 8px;
  background: var(--paper); border: var(--stroke); border-radius: 22px;
  box-shadow: var(--lift-sm); padding: 8px 10px;
  margin-bottom: 14px;
}
.who{ display: flex; align-items: center; gap: 9px; min-width: 0; }
.who svg{ width: 42px; height: auto; flex: none; }
.who .who-art{ background: none; border: none; padding: 0; cursor: pointer; display: flex; flex: none; }
.who .who-txt{ display: grid; justify-items: start; min-width: 0; gap: 2px; }
.who .who-name{
  font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; font-size: var(--t-md);
  line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: none; border: none; padding: 0; cursor: pointer; color: inherit; max-width: 100%;
}
/* Myntraden är vägen in i skattkistan, så den ser ut som något att trycka på */
.who .who-sub{
  font-size: var(--t-xs); color: var(--ink); display: flex; align-items: center; gap: 4px;
  background: var(--sun); border: 2px solid var(--ink); border-radius: 999px;
  padding: 1px 9px 1px 4px; cursor: pointer; font-family: inherit; font-weight: 800;
  max-width: 100%; white-space: nowrap; overflow: hidden;
}
.who .who-sub svg{ width: 15px; height: 15px; }
.who .who-art:focus-visible, .who .who-name:focus-visible, .who .who-sub:focus-visible{
  outline: 3px dashed var(--grape); outline-offset: 2px;
}

/* Skattkistan */
.butik{ display: grid; gap: 8px; max-height: 54vh; overflow-y: auto; padding-right: 2px; }
.butik-rad{
  display: flex; align-items: center; gap: 11px;
  background: var(--paper-2); border: 2.5px solid var(--ink); border-radius: 18px; padding: 8px 11px;
}
.butik-rad.min{ background: #DFF6E2; }
.butik-rad .sak{ width: 42px; height: 42px; flex: none; display: grid; place-items: center; }
.butik-rad .sak svg{ width: 100%; height: 100%; }
.butik-rad .txt{ min-width: 0; flex: 1; }
.butik-rad .txt b{ display: block; font-size: var(--t-sm); }
.butik-rad .txt span{ font-size: var(--t-xs); color: var(--ink-2); display: flex; align-items: center; gap: 4px; }
.butik-rad .txt span svg{ width: 14px; height: 14px; }
.butik-rad .kop{
  flex: none; border: 2.5px solid var(--ink); border-radius: 999px; padding: 5px 13px;
  background: var(--sun); font-family: inherit; font-weight: 800; font-size: var(--t-sm);
  color: var(--ink); cursor: pointer; box-shadow: 0 3px 0 var(--ink);
}
.butik-rad .kop[disabled]{ background: var(--locked); box-shadow: none; cursor: default; opacity: .75; }
.butik-rad .kop.pa{ background: var(--grass); color: #fff; }
.butik-rad .sak svg{ overflow: visible; }
.butik-rad .agd{ flex: none; font-size: var(--t-xs); color: var(--grass-deep); font-weight: 800; }
.star-track{
  display: flex; align-items: center; gap: 5px;
  background: var(--paper-2); border: 2.5px solid var(--ink); border-radius: 999px;
  padding: 4px 11px; font-variant-numeric: tabular-nums; font-size: var(--t-sm);
}
.star-track svg{ width: 17px; height: 17px; }

/* ── Kartan ─────────────────────────────── */
.map{ position: relative; margin: 0 auto; }
.region-band{
  position: absolute; left: -8px; right: -8px;
  border-radius: 34px; border: var(--stroke);
  box-shadow: 0 5px 0 rgba(46,26,102,.5);
}
.banval{ display: grid; gap: 6px; max-height: 38vh; overflow-y: auto; padding-right: 2px; }
.banval details{ border: 2px solid var(--ink); border-radius: 14px; background: var(--paper-2); }
.banval summary{
  cursor: pointer; list-style: none; padding: 7px 12px; font-weight: 800; font-size: var(--t-sm);
  display: flex; align-items: center; gap: 8px;
}
.banval summary::-webkit-details-marker{ display: none; }
.banval summary::after{ content: "▸"; margin-left: auto; color: var(--ink-2); }
.banval details[open] summary::after{ content: "▾"; }
.banval summary .prick{ width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); flex: none; }
.banval details .seg{ padding: 0 8px 8px; }
.ny-version{
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom));
  z-index: 60; background: var(--sun); color: var(--ink); border: var(--stroke); border-radius: 999px;
  padding: 10px 18px; font-family: inherit; font-weight: 800; font-size: var(--t-sm);
  box-shadow: var(--lift-sm); cursor: pointer; animation: ny-version-in .4s cubic-bezier(.3,1.4,.5,1);
}
@keyframes ny-version-in{ from{ transform: translate(-50%, 30px); opacity: 0; } }
.region-band.sidospar{ border-style: dashed; }
.sidospar-text{
  position: absolute; right: 12px; white-space: nowrap;
  font-size: .72rem; font-weight: 800; color: var(--paper);
  background: rgba(46,26,102,.55); border-radius: 999px; padding: 3px 12px; z-index: 2;
}
.region-name{
  position: absolute; left: 50%; transform: translateX(-50%);
  font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; font-size: var(--t-sm);
  background: var(--paper); border: 2.5px solid var(--ink); border-radius: 999px;
  padding: 3px 15px; white-space: nowrap; box-shadow: 0 3px 0 var(--ink);
}
.deco{ position: absolute; transform: translate(-50%, -50%); pointer-events: none; z-index: 1; }
.deco svg{ width: 100%; height: auto; display: block; filter: drop-shadow(0 3px 0 rgba(46,26,102,.18)); }
.trail-dot{
  position: absolute; z-index: 2; width: 12px; height: 12px; border-radius: 50%;
  background: var(--paper); border: 2.5px solid var(--ink);
  transform: translate(-50%, -50%);
}
.trail-dot.locked{ background: rgba(255,253,247,.5); border-color: rgba(46,26,102,.45); }
.node{
  position: absolute; transform: translate(-50%, -50%); z-index: 3;
  width: 68px; padding: 0; background: none; border: none; cursor: pointer;
  display: grid; justify-items: center; gap: 3px; touch-action: manipulation;
  font-family: inherit; color: inherit;
}
.node .node-face{
  width: 62px; height: 62px; border-radius: 50%;
  border: var(--stroke); box-shadow: var(--lift-sm);
  display: grid; place-items: center;
  font-family: "Lilita One", system-ui, sans-serif; font-size: 1.7rem; color: #fff;
  padding-top: 3px; line-height: 1;
  transition: transform .12s ease, box-shadow .12s ease;
}
.node:active .node-face{ transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
.node:focus-visible .node-face{ outline: 4px dashed var(--grape); outline-offset: 3px; }
.node.locked{ cursor: default; }
.node.locked .node-face{ box-shadow: var(--lift-sm), inset 0 0 0 100px rgba(255,253,247,.62); }
.node.locked .node-face svg{ width: 26px; height: 26px; }
.node.current .node-face{ animation: node-pulse 1.7s ease-in-out infinite; }
@keyframes node-pulse{
  0%,100%{ box-shadow: var(--lift-sm), 0 0 0 0 rgba(255,196,46,.9); }
  50%{ box-shadow: var(--lift-sm), 0 0 0 12px rgba(255,196,46,0); }
}
.node-stars{ display: flex; gap: 1px; height: 16px; }
.node-stars svg{ width: 15px; height: 15px; }
.node-label{
  font-size: 10.5px; font-weight: 800; color: var(--ink); line-height: 1.15;
  background: var(--paper); border: 2px solid var(--ink); border-radius: 12px;
  padding: 2px 8px; width: max-content; max-width: 116px; text-align: center;
  box-shadow: 0 2px 0 var(--ink);
}
.walker{
  position: absolute; width: 66px; transform: translate(-50%, -50%);
  pointer-events: none; z-index: 5;
  filter: drop-shadow(0 6px 5px rgba(46,26,102,.28));
  transition: left .5s cubic-bezier(.3,1.2,.5,1), top .5s cubic-bezier(.3,1.2,.5,1);
}
.walker svg{ width: 100%; height: auto; animation: bob 2.6s ease-in-out infinite; }

/* ── Overlay-kort (bana, inställningar, märken) ── */
.overlay{
  position: fixed; inset: 0; z-index: 60;
  background: rgba(46,26,102,.55);
  display: none; align-items: center; justify-content: center;
  padding: 16px; overflow-y: auto;
}
.overlay.open{ display: flex; animation: fade-in .2s ease both; }
@keyframes fade-in{ from{ opacity: 0; } to{ opacity: 1; } }
.sheet{
  width: 100%; max-width: 420px;
  background: var(--paper); border: var(--stroke); border-radius: 28px;
  box-shadow: 0 10px 0 var(--ink), 0 22px 40px rgba(46,26,102,.4);
  padding: 18px; margin: auto;
  animation: sheet-in .32s cubic-bezier(.2,1.4,.5,1) both;
}
@keyframes sheet-in{ from{ opacity: 0; transform: translateY(28px) scale(.94); } to{ opacity: 1; transform: none; } }
.sheet-head{ display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.sheet h2{ font-size: var(--t-xl); }
.sheet .sheet-sub{ font-size: var(--t-sm); color: var(--ink-2); margin: 4px 0 0; }
.sheet-close{ flex: none; }
.sheet-stars{ display: flex; justify-content: center; gap: 6px; margin: 4px 0 14px; }
.sheet-stars svg{ width: 42px; height: 42px; }
.mode-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode-card{
  background: var(--paper-2); border: var(--stroke); border-radius: 20px; box-shadow: var(--lift-sm);
  padding: 12px 10px; cursor: pointer; touch-action: manipulation;
  display: grid; justify-items: center; gap: 6px; font-family: inherit; color: inherit;
  transition: transform .12s ease, box-shadow .12s ease, background-color .15s ease;
}
.mode-card:hover{ background: #FFF3C9; }
.mode-card:active{ transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
.mode-card .mode-name{ font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; font-size: var(--t-md); }
.mode-card .mode-desc{ font-size: var(--t-xs); color: var(--ink-2); text-align: center; }
.mode-card svg{ width: 100%; max-width: 120px; height: auto; }
.mode-card:focus-visible{ outline: 4px dashed var(--grape); outline-offset: 3px; }

/* ── Inställningar ──────────────────────── */
.set-row{
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 0; border-bottom: 2px dashed rgba(46,26,102,.16);
}
.set-row:last-of-type{ border-bottom: none; }
.set-label{ font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; font-size: var(--t-md); }
.set-hint{ font-size: var(--t-xs); color: var(--ink-2); font-weight: 700; }
.toggle{
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--paper-2); border: var(--stroke); border-radius: 999px;
  padding: 6px 13px 6px 8px; font-size: var(--t-xs); font-weight: 800;
  cursor: pointer; touch-action: manipulation; box-shadow: var(--lift-sm);
  transition: transform .1s ease, box-shadow .1s ease;
  font-family: inherit; color: inherit;
}
.toggle:active{ transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
.toggle .dot{
  width: 30px; height: 18px; border-radius: 999px; background: #D6CCF0;
  border: 2px solid var(--ink); position: relative; flex: none; transition: background-color .18s ease;
}
.toggle .dot::after{
  content: ""; position: absolute; top: 1px; left: 1px; width: 12px; height: 12px;
  border-radius: 50%; background: var(--paper); border: 2px solid var(--ink);
  transition: transform .18s cubic-bezier(.3,1.4,.5,1);
}
.toggle[aria-pressed="true"] .dot{ background: var(--grass); }
.toggle[aria-pressed="true"] .dot::after{ transform: translateX(12px); }
.toggle:focus-visible{ outline: 4px dashed var(--grape); outline-offset: 3px; }
.seg{ display: flex; gap: 5px; }
.seg button{
  font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; font-size: var(--t-xs);
  padding: 7px 12px; border-radius: 14px; background: var(--paper-2);
  border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
  cursor: pointer; color: inherit; touch-action: manipulation;
  transition: transform .1s ease, box-shadow .1s ease, background-color .15s ease;
}
.seg button:active{ transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.seg button[aria-pressed="true"]{ background: var(--sun); }
.seg button:focus-visible{ outline: 3px dashed var(--grape); outline-offset: 3px; }
.danger{ background: var(--melon); color: #fff; }

/* ── Märken ─────────────────────────────── */
.badge-grid{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.badge{
  background: var(--paper-2); border: var(--stroke); border-radius: 18px;
  padding: 9px 5px; display: grid; justify-items: center; gap: 3px; text-align: center;
  box-shadow: var(--lift-sm);
}
.badge svg{ width: 46px; height: 46px; }
.badge .b-name{ font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; font-size: var(--t-xs); line-height: 1.15; }
.badge .b-desc{ font-size: 10px; color: var(--ink-2); line-height: 1.2; }
.badge.locked{ background: #EDE9F7; }
.badge.locked svg{ filter: grayscale(1); opacity: .38; }
.badge.locked .b-name{ color: var(--ink-2); }

/* Nytt märke — firande mitt på skärmen */
.cheer-card{ text-align: center; }
.cheer-card svg.b-art{ width: 110px; height: 110px; animation: star-in .6s cubic-bezier(.25,1.6,.4,1) both; }
.cheer-card h2{ font-size: var(--t-xl); margin-top: 6px; }

/* ── Spelskärmens topprad ───────────────── */
.hud{ display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; margin-bottom: clamp(8px, 2vw, 14px); }
.progress{ display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
.progress .pip{
  width: 15px; height: 15px; border-radius: 50%;
  background: rgba(255,253,247,.6); border: 2.5px solid var(--ink);
  transition: background-color .25s ease, transform .25s cubic-bezier(.3,1.5,.5,1);
}
.progress .pip.done{ background: var(--grass); }
.progress .pip.miss{ background: var(--sun); }
.progress .pip.now{ background: var(--sun); transform: scale(1.35); }
.coins{
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--paper); border: var(--stroke); border-radius: 999px;
  padding: 6px 14px 6px 8px; box-shadow: var(--lift-sm);
  font-family: "Lilita One", system-ui, sans-serif; font-size: 1.25rem;
  font-variant-numeric: tabular-nums; line-height: 1;
}
.coins svg{ width: 24px; height: 24px; flex: none; }
.coins.pop{ animation: coin-pop .42s cubic-bezier(.3,1.6,.5,1); }
@keyframes coin-pop{ 0%{ transform: scale(1); } 40%{ transform: scale(1.22) rotate(-3deg); } 100%{ transform: scale(1); } }

/* ── Scenen ─────────────────────────────── */
.play-area{ flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: clamp(6px, 2vw, 14px); }
.stage{ display: block; }
.buddy-rad{ margin-top: auto; padding: 6px 0 0 2px; display: flex; align-items: flex-end; }
.buddy{ position: relative; width: clamp(60px, 17vw, 88px); }
.buddy svg{ width: 100%; height: auto; display: block; filter: drop-shadow(0 8px 6px rgba(46,26,102,.22)); }
.buddy.bob svg{ animation: bob 2.6s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform: translateY(0) rotate(-1deg); } 50%{ transform: translateY(-8px) rotate(1deg); } }
.buddy.cheer svg{ animation: cheer .62s cubic-bezier(.25,1.4,.4,1) 2; }
@keyframes cheer{ 0%{ transform: translateY(0) scale(1); } 30%{ transform: translateY(-26px) scale(1.07); } 60%{ transform: translateY(0) scale(.96); } 100%{ transform: translateY(0) scale(1); } }
.buddy.oops svg{ animation: oops .5s ease-in-out; }
@keyframes oops{ 0%,100%{ transform: translateX(0) rotate(0); } 25%{ transform: translateX(-7px) rotate(-4deg); } 75%{ transform: translateX(7px) rotate(4deg); } }

.question-card{
  position: relative; background: var(--paper); border: var(--stroke);
  border-radius: 26px; box-shadow: var(--lift);
  padding: clamp(12px, 3vw, 20px); text-align: center;
}

.q-label{ font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; font-size: var(--t-md); color: var(--ink-2); margin-bottom: 6px; }
.q-equation{
  font-family: "Lilita One", system-ui, sans-serif;
  font-size: clamp(1.7rem, 7.6vw, 3.6rem);
  white-space: nowrap; max-width: 100%;
  line-height: 1.05; letter-spacing: .02em; font-variant-numeric: tabular-nums;
}
.q-equation.ord{ font-size: clamp(1.05rem, 4.9vw, 2.1rem); letter-spacing: 0; }
/* Fyra tal på rad blir en lång rad siffror – då får de ta mindre plats */
.q-equation.mellan{ font-size: clamp(1.2rem, 5.4vw, 2.6rem); letter-spacing: 0; }
.q-equation .op{ color: var(--grape); padding: 0 .06em; }
.q-equation .slot{ color: var(--melon); }
.q-equation .facit{ color: var(--grass-deep); animation: right-pop .55s cubic-bezier(.3,1.6,.5,1); display: inline-block; }
.q-visual{ display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; margin: 6px 0 10px; }
.q-visual .grp{ display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; max-width: 42%; }
.q-visual .grp.five{ display: grid; grid-template-columns: repeat(5, auto); justify-items: center; max-width: 100%; }
/* Tiobasram: tio saker i två rader om fem, med ram runt. Så syns 47 som
   fyra fulla ramar och sju lösa – i stället för 47 utspridda figurer. */
.q-visual .ramar{ display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 6px; max-width: 100%; }
.q-visual .ram{
  display: grid; grid-template-columns: repeat(5, auto); gap: 2px;
  padding: 4px; border: 2.5px solid var(--ink); border-radius: 10px;
  background: rgba(255,253,247,.7);
}
.q-visual .ram.del{ border-style: dashed; background: rgba(255,253,247,.4); }
/* Tre tal: grupperna får aldrig skiljas från sina plustecken */
.q-visual.trio{ flex-wrap: nowrap; gap: 4px; }
.q-visual.trio .grp{ max-width: 30%; gap: 3px; }
.q-visual.trio .plus{ font-size: 1.4rem; }
.q-visual .plus{ font-family: "Lilita One", system-ui, sans-serif; font-size: 1.9rem; color: var(--grape); }
.q-visual svg{ width: clamp(30px, 8.5vw, 46px); height: auto; }
/* Få saker att räkna ⇒ rita dem stora. Många ⇒ krymp så de får plats. */
.q-visual.jatte svg{ width: clamp(56px, 16vw, 92px); }
.q-visual.stor svg{ width: clamp(40px, 10.5vw, 60px); }
.q-visual.dense svg{ width: clamp(22px, 5.6vw, 32px); }
.q-visual.packed svg{ width: clamp(18px, 4.4vw, 25px); }
.q-visual.ram-m svg{ width: clamp(16px, 4.2vw, 23px); }
.q-visual.ram-s svg{ width: clamp(12px, 3.1vw, 17px); }
.q-visual.ram-xs svg{ width: clamp(9px, 2.4vw, 13px); }
.q-visual .gone{ opacity: .28; }
.q-visual .grp > span{ display: inline-flex; animation: pip-in .3s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes pip-in{ from{ transform: scale(0) rotate(-25deg); } to{ transform: none; } }

.speak-btn{ margin-top: 8px; display: inline-flex; align-items: center; gap: 7px; font-size: var(--t-sm); padding: 7px 15px; border-radius: 999px; background: var(--sky-hi); }
.speak-btn svg{ width: 18px; height: 18px; }

/* ── Svarsytor ──────────────────────────── */
.answer-area{ margin-bottom: 0; }
.options{ display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(8px, 2.2vw, 14px); }
.options.three{ grid-template-columns: repeat(3, 1fr); }
.opt{
  font-family: "Lilita One", system-ui, sans-serif;
  font-size: clamp(2rem, 8vw, 3rem); padding: clamp(12px, 3.5vw, 22px) 8px;
  border-radius: 24px; font-variant-numeric: tabular-nums; line-height: 1;
}
.opt.c0{ background: var(--sky); }
.opt.c1{ background: var(--sun); }
.opt.c2{ background: var(--bubble); }
.opt.c3{ background: #8FE07E; }
.opt.right{ background: var(--grass) !important; color: #fff; animation: right-pop .5s cubic-bezier(.3,1.6,.5,1); }
.opt.wrong{ background: #C9BEE6 !important; color: rgba(46,26,102,.45); box-shadow: 0 0 0 var(--ink); transform: translateY(6px); }
@keyframes right-pop{ 0%{ transform: scale(1); } 45%{ transform: scale(1.14); } 100%{ transform: scale(1); } }

.typed{ display: grid; gap: 10px; }
.answer-display{
  background: var(--paper); border: var(--stroke); border-radius: 22px; box-shadow: var(--lift-sm);
  min-height: 76px; display: grid; place-items: center;
  font-family: "Lilita One", system-ui, sans-serif; font-size: clamp(2.4rem, 10vw, 3.4rem);
  font-variant-numeric: tabular-nums; letter-spacing: .06em; color: var(--ink);
}
.answer-display.empty{ color: rgba(46,26,102,.24); }
.answer-display.right{ background: var(--grass); color: #fff; animation: right-pop .5s cubic-bezier(.3,1.6,.5,1); }
.answer-display.wrong{ background: var(--melon); color: #fff; animation: oops .5s ease-in-out; }
.keypad{ display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(7px, 2vw, 11px); }
.key{ font-family: "Lilita One", system-ui, sans-serif; font-size: clamp(1.7rem, 6.5vw, 2.4rem); padding: clamp(9px, 2.6vw, 16px) 0; border-radius: 20px; background: var(--paper); line-height: 1; }
.key.num{ background: var(--sky-hi); }
.key.del{ background: var(--melon); color: #fff; }
.key.ok{ background: var(--grass); color: #fff; }
.key svg{ width: 30px; height: 30px; }

.feedback{ min-height: 54px; display: grid; place-items: center; text-align: center; }
.feedback .bubble{
  font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; font-size: var(--t-lg);
  padding: 8px 22px; border-radius: 999px; border: var(--stroke); box-shadow: var(--lift-sm);
  max-width: min(100%, 22ch); text-wrap: balance;
  animation: fb-in .4s cubic-bezier(.25,1.5,.5,1) both;
}
.feedback .bubble.good{ background: var(--grass); color: #fff; }
.feedback .bubble.soft{ background: var(--sun); }
@keyframes fb-in{ from{ opacity: 0; transform: translateY(12px) scale(.85); } to{ opacity: 1; transform: none; } }
.feedback .combo{ display: block; font-size: var(--t-sm); margin-top: 2px; }

/* ── Resultat ───────────────────────────── */
.result-card{ text-align: center; }
.result-card h2{ font-size: var(--t-xl); margin-bottom: 4px; }
.result-buddy{ width: min(170px, 46vw); margin: 0 auto; }
.result-buddy svg{ width: 100%; height: auto; animation: cheer .8s cubic-bezier(.25,1.4,.4,1) 3; }
.stars{ display: flex; justify-content: center; gap: 8px; margin: 12px 0 6px; }
.stars svg{ width: clamp(46px, 14vw, 68px); height: auto; }
.stars .st{ animation: star-in .55s cubic-bezier(.25,1.6,.4,1) both; }
.stars .st:nth-child(2){ animation-delay: .18s; }
.stars .st:nth-child(3){ animation-delay: .36s; }
@keyframes star-in{ from{ opacity: 0; transform: scale(0) rotate(-90deg); } to{ opacity: 1; transform: none; } }
.score-row{ display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 12px 0 14px; }
.result-card .score-row{ flex-direction: column; align-items: stretch; }
.result-card .score-row .score-chip{ align-self: center; }
.score-chip{
  background: var(--paper-2); border: 2.5px solid rgba(46,26,102,.2); border-radius: 16px;
  padding: 7px 16px; font-size: var(--t-sm); font-variant-numeric: tabular-nums;
}
.score-chip b{ font-family: "Lilita One", system-ui, sans-serif; font-size: 1.25rem; }

/* Belöningsrutorna är siffror att läsa, inte knappar att trycka på: platta,
   utan skugga, med ikonen som bär betydelsen. */
.reward-row{ display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
.reward{
  display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 10px;
  background: var(--paper-2); border: 2.5px solid rgba(46,26,102,.18);
  border-radius: 18px; padding: 10px 12px; text-align: left;
}
.reward svg{ width: 38px; height: 38px; flex: none; }
.reward .r-num{
  font-family: "Lilita One", system-ui, sans-serif; font-size: 1.7rem; line-height: 1;
  font-variant-numeric: tabular-nums; display: block;
}
.reward .r-txt{ font-size: var(--t-xs); color: var(--ink-2); font-weight: 800; }
.reward.ny .r-num{ color: var(--sun-deep); }

/* Upplåsningen är en nyhet på en banderoll, inte något man trycker på */
.unlock-note{
  display: flex; align-items: center; justify-content: center; gap: 9px;
  background: #E4F7E2; color: var(--ink);
  border: 3px dashed var(--grass-deep); border-radius: 18px;
  padding: 10px 14px; margin: 0 0 14px; box-shadow: none;
  font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; font-size: var(--t-md);
}
.unlock-note svg{ width: 26px; height: 26px; flex: none; }
.result-actions{ display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.result-actions .btn.again{ background: var(--sun); }
.result-actions .btn.home{ background: var(--sky-hi); }
.new-best{
  display: inline-block; background: var(--bubble); color: #fff; border: var(--stroke);
  border-radius: 999px; padding: 5px 16px; font-family: "Baloo 2", system-ui, sans-serif;
  font-weight: 800; box-shadow: var(--lift-sm); animation: play-pulse 1.1s ease-in-out infinite;
}


#fx{ position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 90; }
.footnote{ text-align: center; font-size: var(--t-xs); color: rgba(46,26,102,.62); margin-top: 6px; }


/* ── Spårvagnsvärlden: ljus kartbotten så linjefärgerna syns ── */
body.on-tram{
  background: #EEF2F6;
  background-image:
    linear-gradient(rgba(46,26,102,.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(46,26,102,.055) 1px, transparent 1px);
  background-size: 26px 26px;
  background-attachment: fixed;
}
body.on-tram .world{ display: none; }

/* Världsväxlaren */
.world-switch{
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  background: var(--paper); border: var(--stroke); border-radius: 18px;
  box-shadow: var(--lift-sm); padding: 5px; margin-bottom: 14px;
}
.world-switch button{
  display: flex; align-items: center; justify-content: center; gap: 7px;
  font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; font-size: var(--t-sm);
  padding: 8px 6px; border-radius: 13px; border: 2.5px solid transparent;
  background: none; color: var(--ink-2); cursor: pointer; touch-action: manipulation;
  transition: background-color .15s ease, color .15s ease;
}
.world-switch button svg{ width: 22px; height: 22px; flex: none; }
.world-switch button[aria-pressed="true"]{ background: var(--sun); color: var(--ink); border-color: var(--ink); }
.world-switch button:focus-visible{ outline: 3px dashed var(--grape); outline-offset: 2px; }

/* Linjeväljaren – uppställd som en linjekarta */
/* Startskärmen i spårvagnsvärlden */
.start-rubrik{ font-family: "Baloo 2", system-ui, sans-serif; font-size: var(--t-lg); margin: 18px 0 8px; }
.fortsatt{
  display: grid; grid-template-columns: 96px 1fr auto; align-items: center; gap: 12px;
  width: 100%; padding: 10px; background: var(--paper); border: var(--stroke); border-radius: 22px;
  box-shadow: var(--lift); cursor: pointer; font-family: inherit; color: inherit; text-align: left;
}
.fortsatt img, .fortsatt .scen-mini{ width: 96px; height: 64px; object-fit: cover; border-radius: 14px; border: 2.5px solid var(--ink); display: block; }
.fortsatt .scen-mini svg{ width: 100%; height: 100%; display: block; }
.fortsatt b{ font-family: "Baloo 2", system-ui, sans-serif; font-size: var(--t-md); display: block; line-height: 1.1; }
.fortsatt small{ font-size: var(--t-xs); color: var(--ink-2); display: block; margin-top: 2px; }
.linjechips{ display: flex; gap: 7px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; }
.linjechips::-webkit-scrollbar{ display: none; }
.linjechips button{
  flex: none; border: 2.5px solid var(--ink); border-radius: 999px; padding: 5px 13px;
  background: var(--paper); font-family: inherit; font-weight: 800; font-size: var(--t-sm);
  color: var(--ink); cursor: pointer;
}
.linjechips button[aria-pressed="true"]{ background: var(--sun); box-shadow: 0 3px 0 var(--ink); }
.linjechips .roundel.sm{ width: 36px; height: 36px; padding: 0; }
.linjechips .roundel.sm[aria-pressed="true"]{ box-shadow: 0 0 0 3px var(--sun); }
.stoppgrid{ display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 520px){ .stoppgrid{ grid-template-columns: repeat(3, 1fr); } }
.stopp-tile{
  padding: 0; background: var(--paper); border: var(--stroke); border-radius: 18px; overflow: hidden;
  box-shadow: var(--lift-sm); cursor: pointer; font-family: inherit; color: inherit; text-align: left;
  transition: transform .09s ease, box-shadow .09s ease;
}
.stopp-tile:active{ transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
.stopp-tile img, .stopp-tile .scen-mini{ display: block; width: 100%; aspect-ratio: 32 / 15; object-fit: cover; border-bottom: 2.5px solid var(--ink); background: #CDEBFB; }
.stopp-tile .scen-mini svg{ width: 100%; height: 100%; display: block; }
.stopp-tile span{ display: block; padding: 7px 10px 9px; font-weight: 800; font-size: var(--t-sm); line-height: 1.15; }
.stopp-tile .linjer{ display: flex; gap: 3px; padding: 0 10px 9px; }
.stopp-tile .linjer i{
  font-style: normal; font-size: 10px; font-weight: 800; width: 20px; height: 20px; border-radius: 50%;
  display: grid; place-items: center; border: 2px solid var(--ink);
}
.mina-linjer{ display: grid; gap: 7px; }
.mina-linjer .line-row{ width: 100%; }
.line-list{ display: grid; gap: 9px; }
/* Perrongen: vagnarna man kan stiga på */
.perrong{ display: grid; gap: 10px; max-height: 52vh; overflow-y: auto; padding: 4px 2px; }
.avgang{
  display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 12px;
  padding: 8px 12px 8px 8px; background: var(--paper-2); border: var(--stroke); border-radius: 20px;
  box-shadow: var(--lift-sm); cursor: pointer; font-family: inherit; color: inherit; text-align: left;
}
.avgang:active{ transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.avgang .vagn{ width: 64px; }
.avgang .vagn svg{ width: 100%; height: auto; display: block; }
.avgang .skylt{
  display: inline-block; font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; font-size: var(--t-md);
  line-height: 1.1;
}
.avgang small{ display: block; font-size: var(--t-xs); color: var(--ink-2); margin-top: 2px; }
.avgang .pil{ font-size: 1.6rem; line-height: 1; }
.trip-knappar{ display: flex; gap: 8px; margin-bottom: 14px; }
.trip-knappar .btn{ flex: 1; padding: 11px 8px; font-size: var(--t-sm); background: var(--paper-2); display: flex; align-items: center; justify-content: center; gap: 8px; }
.trip-knappar .btn svg{ width: 24px; height: 24px; flex: none; }
.go-btn svg{ width: 26px; height: 26px; vertical-align: -6px; margin-right: 6px; }
/* Kartans zoomknapp */
.nat-zoom{
  position: absolute; right: 10px; top: 10px; z-index: 3;
  border: 2.5px solid var(--ink); border-radius: 999px; padding: 6px 12px;
  background: var(--paper); font-family: inherit; font-weight: 800; font-size: var(--t-xs);
  color: var(--ink); cursor: pointer; box-shadow: 0 3px 0 var(--ink);
}
.line-row{
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
  background: var(--paper); border: var(--stroke); border-radius: 20px;
  box-shadow: var(--lift-sm); padding: 9px 13px 9px 9px;
  cursor: pointer; touch-action: manipulation; font-family: inherit; color: inherit; text-align: left;
  position: relative; overflow: hidden;
  transition: transform .12s ease, box-shadow .12s ease;
}
.line-row::before{
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 9px;
  background: var(--linecol); border-right: 2.5px solid var(--ink);
}
.line-row:active{ transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
.line-row:focus-visible{ outline: 4px dashed var(--grape); outline-offset: 3px; }
.roundel{
  width: 46px; height: 46px; border-radius: 50%; flex: none;
  display: grid; place-items: center; border: var(--stroke);
  font-family: "Lilita One", system-ui, sans-serif; font-size: 1.45rem; line-height: 1; padding-top: 3px;
  box-shadow: 0 3px 0 var(--ink);
}
.roundel.sm{ width: 34px; height: 34px; font-size: 1.1rem; border-width: 2.5px; box-shadow: 0 2px 0 var(--ink); }
.roundel.lg{ width: 60px; height: 60px; font-size: 1.9rem; }
.line-ends{ font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; font-size: var(--t-md); line-height: 1.15; }
.line-meta{ font-size: var(--t-xs); color: var(--ink-2); }
.line-prog{
  font-size: var(--t-xs); background: var(--paper-2); border: 2px solid var(--ink);
  border-radius: 999px; padding: 3px 9px; white-space: nowrap; font-variant-numeric: tabular-nums;
}
/* Hur långt man kommit på linjen, i linjens egen färg */
.line-bar{
  display: block; width: 100%; height: 10px; margin-top: 6px;
  background: #DCD2F2; border: 2.5px solid var(--ink);
  border-radius: 999px; overflow: hidden;
}
.line-bar span{
  display: block; height: 100%; background: var(--linecol);
  border-radius: 999px; transition: width .7s cubic-bezier(.3,1.1,.5,1);
}
/* Ettan är vit. Utan en kant i bläck syns dess fyllnad inte alls. */
.line-bar span.pabörjad{ border-right: 3px solid var(--ink); box-sizing: border-box; }
.line-bar.klar span{ background: var(--grass); }
.line-prog.klar{ background: var(--grass); color: #fff; }

/* Resans vy */
.trip-head{
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 11px;
  background: var(--paper); border: var(--stroke); border-radius: 20px;
  box-shadow: var(--lift-sm); padding: 9px 11px; margin-bottom: 12px;
  position: sticky; top: 0; z-index: 20;
}
.trip-mid{ min-width: 0; display: grid; gap: 4px; justify-items: start; width: 100%; }
.trip-mid .line-meta{ max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.trip-bar{ display: block; width: 100%; height: 11px; border-radius: 999px; background: var(--paper-2); border: 2.5px solid var(--ink); overflow: hidden; }
.trip-mid .line-ends{ white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.trip-bar span{ display: block; height: 100%; background: var(--linecol); transition: width .6s cubic-bezier(.3,1.1,.5,1); }

/* Ett riktigt foto ligger över teckningen och tonar bort, så att man först
   ser platsen och sedan spelets egen bild av den. Saknas fotot – eller går det
   inte att hämta – syns teckningen direkt utan att något hoppar till. */
.scen-wrap{ position: relative; line-height: 0; }
.scen-wrap.har-foto{ cursor: pointer; }
.scen-wrap .foto{
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; opacity: 1;
  transition: opacity 1.1s ease;
}
.scen-wrap .foto.borta{ opacity: 0; pointer-events: none; }
.foto-kred{
  margin: 0; padding: 4px 12px 0; font-size: 10px; line-height: 1.3;
  color: var(--ink-2); text-align: right; transition: opacity .5s ease;
}
.foto-kred.borta{ opacity: 0; }
.foto-kred a{ color: inherit; }
/* Kameraknappen visar att det finns ett foto även när teckningen tagit över */
.foto-knapp.på{ background: var(--sun); }

/* Hållplatsbilden */
.stop-card{
  background: var(--paper); border: var(--stroke); border-radius: 24px;
  box-shadow: var(--lift); overflow: hidden; margin-bottom: 14px;
}
.stop-card .scene{ display: block; width: 100%; height: auto; background: #CDEBFB; border-bottom: var(--stroke); }
.stop-card .stop-info{ padding: 11px 15px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stop-card .stop-knappar{ display: flex; gap: 8px; flex: none; }
.stop-card .stop-name{ font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; font-size: var(--t-lg); line-height: 1.1; }
.stop-card .stop-sub{ font-size: var(--t-xs); color: var(--ink-2); }

/* Linjediagram i kollektivtrafikstil */
/* Nätkartan: hela nätet, inzoomat kring hållplatsen man står vid */
.natkarta{
  width: 100%; aspect-ratio: 1 / 1; max-height: 48vh;
  background: #F4F1FA; border: var(--stroke); border-radius: 24px;
  box-shadow: var(--lift); overflow: hidden; margin-bottom: 14px;
  position: relative;
}
.natkarta svg{ width: 100%; height: 100%; display: block; touch-action: manipulation; }
.natkarta .nat-linje{ fill: none; stroke-linecap: round; stroke-linejoin: round; }
.natkarta .nat-linje.annan{ opacity: .28; }
.natkarta .nat-stopp{ cursor: pointer; }
.natkarta .nat-namn{
  font-family: "Nunito", "Trebuchet MS", system-ui, sans-serif; font-weight: 800;
  fill: var(--ink); paint-order: stroke; stroke: #F4F1FA; stroke-width: 4px; stroke-linejoin: round;
  pointer-events: none;
}
.natkarta .nat-namn.har{ font-family: "Baloo 2", system-ui, sans-serif; }
.natkarta .nat-ring{ transform-box: fill-box; transform-origin: center; animation: nat-puls 1.6s ease-in-out infinite; }
@keyframes nat-puls{ 0%,100%{ transform: scale(1); opacity: .55; } 50%{ transform: scale(1.45); opacity: .15; } }
.natkarta .nat-rundel text{
  font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; text-anchor: middle;
  dominant-baseline: central; pointer-events: none;
}
.natkarta .nat-hint{
  position: absolute; left: 10px; bottom: 8px; font-size: 10px; font-weight: 800;
  color: var(--ink-2); background: rgba(255,253,247,.85); border-radius: 999px; padding: 2px 9px;
  pointer-events: none;
}
.alla-stopp{ margin-bottom: 14px; }
.alla-stopp summary{
  cursor: pointer; list-style: none; font-weight: 800; font-size: var(--t-sm); color: var(--ink-2);
  padding: 8px 14px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 999px;
  display: inline-flex; align-items: center; gap: 8px;
}
.alla-stopp summary::-webkit-details-marker{ display: none; }
.alla-stopp summary::before{ content: "▸"; }
.alla-stopp[open] summary::before{ content: "▾"; }
.alla-stopp[open] summary{ margin-bottom: 10px; }
.route{ position: relative; padding-left: 4px; }
.route-line{
  position: absolute; left: 30px; top: 26px; bottom: 26px; width: 12px;
  border-radius: 999px; background: var(--linecol);
  border: 2.5px solid var(--ink);
}
.route-line .done-part{
  position: absolute; left: -2.5px; right: -2.5px; top: -2.5px;
  border-radius: 999px; background: var(--ink); opacity: .28;
  transition: height .6s cubic-bezier(.3,1.1,.5,1);
}
.stop-row{
  position: relative; display: grid; grid-template-columns: 60px 1fr; align-items: center;
  height: 52px; gap: 8px;
}
.stop-dot{
  justify-self: center; width: 22px; height: 22px; border-radius: 50%;
  background: var(--paper); border: 3.5px solid var(--ink); z-index: 2;
  transition: transform .2s ease, background-color .3s ease;
}
.stop-row.done .stop-dot{ background: var(--ink); }
.stop-row.här .stop-dot{ width: 30px; height: 30px; background: var(--sun); transform: scale(1); box-shadow: 0 0 0 5px rgba(255,196,46,.45); }
.stop-row .stop-label{
  font-weight: 800; font-size: var(--t-sm); line-height: 1.15; color: var(--ink-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.stop-row.done .stop-label{ color: rgba(46,26,102,.45); }
.stop-row.här .stop-label{ color: var(--ink); font-family: "Baloo 2", system-ui, sans-serif; font-size: var(--t-md); }
.stop-row .stop-tag{
  display: inline-block; font-size: 10px; font-weight: 800; margin-left: 6px;
  background: var(--sun); border: 2px solid var(--ink); border-radius: 999px;
  padding: 1px 8px 2px; line-height: 1.5; vertical-align: 2px;
}
.tram-marker{
  position: absolute; left: 6px; width: 54px; z-index: 4;
  transform: translateY(-50%);
  transition: top .85s cubic-bezier(.45,.05,.3,1);
  filter: drop-shadow(0 5px 4px rgba(46,26,102,.3));
}
.tram-marker svg{ width: 100%; height: auto; }
.tram-marker.rullar svg{ animation: skaka .28s linear infinite; }
@keyframes skaka{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-1.5px); } }

.go-btn{
  position: sticky; bottom: max(10px, env(safe-area-inset-bottom)); z-index: 22;
  display: block; width: 100%; margin-top: 14px;
  padding: 17px; font-size: clamp(1.3rem, 5vw, 1.9rem);
  background: var(--sun); border-radius: 24px;
}
.go-btn.done{ background: var(--grass); color: #fff; }

/* Resultat efter en hållplats – kort och gott */
.arrive-card{ text-align: center; }
.arrive-card .scene{ display: block; width: 100%; height: auto; border: var(--stroke); border-radius: 20px; background: #CDEBFB; margin-bottom: 12px; }
.arrive-card h2{ font-size: var(--t-xl); }

/* ── Låga skärmar ───────────────────────── */
@media (max-height: 740px){
  #app{ padding-top: 10px; padding-bottom: 8px; }
  .play-area{ gap: 7px; }
  .hud{ margin-bottom: 7px; }
  .question-card{ padding: 10px 12px; }
  .q-label{ font-size: var(--t-sm); margin-bottom: 2px; }
  .q-visual{ margin: 2px 0 6px; gap: 5px; }
  .q-visual svg{ width: clamp(24px, 7vw, 34px); }
  .q-visual.jatte svg{ width: clamp(44px, 13vw, 70px); }
  .q-visual.stor svg{ width: clamp(34px, 9vw, 48px); }
  .q-visual.dense svg{ width: clamp(20px, 5vw, 27px); }
  .q-visual.packed svg{ width: clamp(16px, 4vw, 22px); }
  .speak-btn{ padding: 5px 13px; font-size: var(--t-xs); margin-top: 5px; }
  .feedback{ min-height: 34px; }
  .feedback .bubble{ font-size: var(--t-md); padding: 4px 15px; }
  .answer-display{ min-height: 52px; font-size: clamp(1.9rem, 7.5vw, 2.6rem); border-radius: 18px; }
  .keypad{ gap: 6px; }
  .key{ padding: 7px 0; font-size: clamp(1.35rem, 5.4vw, 1.9rem); border-radius: 16px; }
  .key svg{ width: 24px; height: 24px; }
  .opt{ padding: clamp(8px, 2.4vw, 15px) 8px; font-size: clamp(1.7rem, 7vw, 2.6rem); border-radius: 20px; }
  .options{ gap: 8px; }
}
@media (max-width: 400px){
  .stage{ grid-template-columns: minmax(70px, 22%) 1fr; }
  .badge-grid{ grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration: .01ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>

<div class="world" aria-hidden="true">
  <div class="hill a"></div><div class="hill b"></div><div class="hill c"></div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

<main id="app">

  <!-- ── VÄLJ SPELARE ───────────────────── -->
  <section id="screen-profiles" class="screen">
    <header class="brand">
      <h1>Räknelandet</h1>
      <p class="tagline">Vem ska spela?</p>
    </header>
    <div class="panel">
      <div class="profile-list" id="profileList"></div>
      <button class="btn btn-big" id="newProfileBtn" type="button">+ Ny spelare</button>
    </div>
  </section>

  <!-- ── SKAPA SPELARE ──────────────────── -->
  <section id="screen-create" class="screen">
    <header class="brand">
      <h1>Ny spelare</h1>
    </header>
    <div class="panel">
      <h2 class="panel-title"><span class="step">1</span> Vad heter du?</h2>
      <input class="name-field" id="nameField" type="text" maxlength="14" placeholder="Skriv namnet"
             autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
    </div>
    <div class="panel">
      <h2 class="panel-title"><span class="step">2</span> Välj din kompis</h2>
      <div class="pick-grid char-grid" id="charGrid" role="group" aria-label="Välj kompis"></div>
    </div>
    <button class="btn btn-big pulse" id="createBtn" type="button">Kom igen!</button>
    <button class="btn" id="cancelCreate" type="button" style="width:100%;margin-top:10px;background:var(--paper-2)">Tillbaka</button>
  </section>

  <!-- ── Delad topplist för båda kartorna ─ -->
  <div id="mapHeader" hidden>
    <div class="top-bar">
      <div class="who">
        <button class="who-art" id="whoBtn" type="button" aria-label="Byt spelare">
          <span id="whoArt"></span>
        </button>
        <span class="who-txt">
          <button class="who-name" id="whoName" type="button">Spelare</button>
          <button class="who-sub" id="shopBtn" type="button" aria-label="Öppna skattkistan">
            <span id="whoCoins"></span>
          </button>
        </span>
      </div>
      <button class="star-track" id="badgeBtn" type="button" style="cursor:pointer;font-family:inherit;color:inherit;box-shadow:0 3px 0 var(--ink)">
        <span id="starTrack">0/45</span>
      </button>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="Inställningar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10.2 2.2h3.6l.6 2.7 1.6.7 2.3-1.5 2.6 2.6-1.5 2.3.7 1.6 2.7.6v3.6l-2.7.6-.7 1.6 1.5 2.3-2.6 2.6-2.3-1.5-1.6.7-.6 2.7h-3.6l-.6-2.7-1.6-.7-2.3 1.5-2.6-2.6 1.5-2.3-.7-1.6-2.7-.6v-3.6l2.7-.6.7-1.6-1.5-2.3 2.6-2.6 2.3 1.5 1.6-.7z" fill="#2E1A66"/>
          <circle cx="12" cy="12" r="3.6" fill="#FFFDF7"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ── RÄKNELANDETS KARTA ─────────────── -->
  <section id="screen-map" class="screen">
    <div class="map" id="map"></div>
  </section>

  <!-- ── SPÅRVAGN: VÄLJ LINJE ───────────── -->
  <section id="screen-lines" class="screen">
    <div id="startTram"></div>
    <p class="footnote" id="tramCredit"></p>
  </section>

  <!-- ── SPÅRVAGN: RESAN ────────────────── -->
  <section id="screen-trip" class="screen">
    <div class="trip-head" id="tripHead"></div>
    <div id="stopCard"></div>
    <div class="natkarta" id="natkarta" aria-label="Spårvagnskarta"></div>
    <div class="trip-knappar">
      <button class="btn" data-trip="byt" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>
        Byt vagn eller riktning
      </button>
    </div>
    <details class="alla-stopp" id="allaStopp">
      <summary>Alla hållplatser på linjen</summary>
      <div class="route" id="route"></div>
    </details>
    <button class="btn go-btn" id="goBtn" type="button">Åk till nästa hållplats!</button>
  </section>

  <!-- ── SPEL ───────────────────────────── -->
  <section id="screen-game" class="screen">
    <div class="hud">
      <button class="icon-btn" id="homeBtn" type="button" aria-label="Tillbaka till kartan">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2E1A66" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/></svg>

</main>

<!-- ── Overlay-kort ─────────────────────── -->

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
</div>

<script>
(function(){
"use strict";

/* ═══════════════════════════════════════════
   Småverktyg
   ═══════════════════════════════════════════ */
const el = (id) => document.getElementById(id);
const rnd  = (n) => Math.floor(Math.random() * n);
const ri   = (a, b) => a + rnd(b - a + 1);
const pick = (arr) => arr[rnd(arr.length)];
const INK = "#2E1A66";
/* Syns under Inställningar, så man kan se vilken version telefonen kör.
   Höjs tillsammans med VERSION i sw.js. */
const SPELVERSION = "13";
function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function store(key, val){
  try{
    if(val === undefined){ const v = localStorage.getItem("rakn." + key); return v === null ? null : JSON.parse(v); }
    localStorage.setItem("rakn." + key, JSON.stringify(val));
  }catch(e){ /* privat läge – spelet funkar ändå */ }
  return null;
}

/* ═══════════════════════════════════════════
   Ansikten
   ═══════════════════════════════════════════ */
function eyes(mood, x, y, r, spread){
  const L = x - spread, R = x + spread;
  if(mood === "happy"){
    return [L, R].map(cx =>
      `<path d="M${cx - r - 2} ${y + 3} Q${cx} ${y - r - 5} ${cx + r + 2} ${y + 3}" fill="none" stroke="${INK}" stroke-width="${r * 0.55}" stroke-linecap="round"/>`
    ).join("");
  }
  const dy = mood === "sad" ? r * 0.42 : 0;
  const brow = mood === "sad"
    ? [L, R].map((cx, i) =>
        `<path d="M${cx - r} ${y - r * 1.5 + (i ? -3 : 3)} L${cx + r} ${y - r * 1.5 + (i ? 3 : -3)}" stroke="${INK}" stroke-width="${r * 0.45}" stroke-linecap="round"/>`
      ).join("")
    : "";
  return [L, R].map(cx =>
    `<ellipse cx="${cx}" cy="${y}" rx="${r}" ry="${r * 1.14}" fill="#FFFDF7" stroke="${INK}" stroke-width="3.4"/>` +
    `<circle cx="${cx}" cy="${y + dy}" r="${r * 0.5}" fill="${INK}"/>` +
    `<circle cx="${cx + r * 0.22}" cy="${y + dy - r * 0.2}" r="${r * 0.17}" fill="#FFFDF7"/>`
  ).join("") + brow;
}
function mouth(mood, x, y, s){
  let d;
  if(mood === "happy"){
    d = `<path d="M-21 -4 Q0 26 21 -4 Q0 4 -21 -4 Z" fill="${INK}"/><path d="M-9 11 Q0 23 9 11 Q0 8 -9 11 Z" fill="#FF6B6B"/>`;
  }else if(mood === "sad"){
    d = `<path d="M-13 8 Q0 -4 13 8" fill="none" stroke="${INK}" stroke-width="4.6" stroke-linecap="round"/>`;
  }else{
    d = `<path d="M-13 -2 Q0 12 13 -2" fill="none" stroke="${INK}" stroke-width="4.6" stroke-linecap="round"/>`;
  }
  return `<g transform="translate(${x} ${y}) scale(${s})">${d}</g>`;
}

/* ═══════════════════════════════════════════
   Kompisarna
   ═══════════════════════════════════════════ */
const CHARACTERS = [
  { id:"bloppy", name:"Bloppy", tint:"#62CDF2", draw(m){ return `
      <path d="M148 150 q34 -6 30 -38" fill="none" stroke="${INK}" stroke-width="16" stroke-linecap="round"/>
      <path d="M148 150 q34 -6 30 -38" fill="none" stroke="#62CDF2" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="100" cy="168" rx="46" ry="36" fill="#62CDF2" stroke="${INK}" stroke-width="5"/>
      <ellipse cx="100" cy="178" rx="27" ry="24" fill="#FFFDF7" stroke="${INK}" stroke-width="4"/>
      <ellipse cx="52" cy="72" rx="17" ry="30" transform="rotate(-18 52 72)" fill="#2FA9D8" stroke="${INK}" stroke-width="5"/>

/* Huvudspåret är 1–27, sidospåret 28–31 */
const HUVUD_MAX = 27, SIDO_START = 28, SIDO_MAX = 31;
const huvudspar = (L) => L.id < SIDO_START;
/* Provbanorna ärver sorter och tak från banorna de drar ur, så att allt som
   tittar på en bana kan behandla dem som vilka banor som helst. */
LEVELS.filter(L => L.pool).forEach(L => {
  const delar = L.pool.map(id => LEVELS.find(x => x.id === id));
  L.kinds = [...new Set(delar.flatMap(x => x.kinds))];
  L.max = Math.max(...delar.map(x => x.max));
});
const MAX_STARS = LEVELS.length * 3;
const levelById = (id) => LEVELS.find(l => l.id === id);

/* Två tal att lägga ihop eller dra ifrån, inom banans ramar (se LEVELS).
   Ramarna prövas mot slumpade tal tills ett par passar. */
function plusTal(L){
  const minst = L.minDel || 1;
  for(let f = 0; f < 80; f++){
    const sum = L.tiotal
      ? ri(Math.max(2, Math.ceil((L.lo || 20) / 10)), Math.floor(L.max / 10)) * 10
      : ri(Math.max(2, L.lo || 2), L.max);
    if(sum - minst < minst) continue;
    const a = L.tiotal ? ri(1, sum / 10 - 1) * 10 : ri(minst, sum - minst);
    const b = sum - a;
    const lit = Math.min(a, b), st = Math.max(a, b);
    if(L.ensiffrigt && st > 9) continue;
    if(L.litet && lit > L.litet) continue;
    const vaxling = a % 10 + b % 10 >= 10;
    if(L.over === "ja" && !vaxling) continue;
    if(L.over === "nej" && vaxling) continue;
    return { kind:"add", a, b, answer:sum };
  }
  return { kind:"add", a:1, b:1, answer:2 };
}
function minusTal(L){
  const minst = L.minDel || 1;
  for(let f = 0; f < 80; f++){
    const a = L.tiotal
      ? ri(Math.max(2, Math.ceil((L.lo || 20) / 10)), Math.floor(L.max / 10)) * 10
      : ri(Math.max(2, L.lo || 2), L.max);
    if(a - minst < minst) continue;
    const b = L.tiotal ? ri(1, a / 10 - 1) * 10 : ri(minst, a - minst);
    const svar = a - b;
    if(L.ensiffrigt && (b > 9 || svar > 9)) continue;
    if(L.litet && b > L.litet) continue;
    const lan = a % 10 < b % 10;
    if(L.over === "ja" && !lan) continue;
    if(L.over === "nej" && lan) continue;
    return { kind:"sub", a, b, answer:svar };
  }
  return { kind:"sub", a:2, b:1, answer:1 };
}

/* Uppgiftsmakare – en per sort */
const MAKE = {
  count:   L => { const n = ri(L.min || 1, L.max); return { kind:"count", answer:n, count:n }; },
  /* Tioramarna gör talet läsbart: åtta fulla ramar och sju lösa är 87. Här
     får barnet strukturen given och slipper räkna om från ett varje gång. */
  tiotal:  L => { const n = ri(Math.max(10, L.min || 10), L.max);
                  return { kind:"tiotal", answer:n, count:n,
                           tior:Math.floor(n / 10), ental:n % 10 }; },
  add:     plusTal,
  sub:     minusTal,
  /* Även fattas-tal och dubbelt följer banans minDel, så 1 + ? = 9 och 1 + 1
     inte dyker upp på banor där de andra talen har slutat vara små. */
  missing: L => { const minst = L.minDel || 1;
                  const sum = ri(Math.max(minst * 2, L.lo || 3), L.max);
                  const a = ri(minst, sum - minst);
                  return { kind:"missing", a, sum, answer:sum - a }; },
  double:  L => { const a = ri(L.minDel || 1, Math.max(L.minDel || 1, Math.floor(L.max / 2)));
                  return { kind:"add", a, b:a, answer:a + a }; },
  ten:     L => { const a = ri(1, 9); return { kind:"missing", a, sum:10, answer:10 - a }; },
  add3:    L => { const m = Math.min(6, Math.max(2, Math.floor(L.max / 3)));
                  const a = ri(1, m), b = ri(1, m), c = ri(1, m);
                  return { kind:"add3", a, b, c, answer:a + b + c }; },
  /* Talföljd: tre tal syns, det fjärde ska fram. Steget kan gå åt båda håll. */
  serie:   L => { const steg = pick([2, 5, 10]), upp = rnd(2) === 0, max = L.max || 100;
                  const start = upp
                    ? ri(1, Math.max(1, Math.floor((max - steg * 3) / steg))) * steg
                    : ri(3, Math.floor(max / steg)) * steg;
                  const tal = [0, 1, 2].map(i => start + (upp ? 1 : -1) * steg * i);
                  return { kind:"serie", tal, steg, upp, a:start, b:steg, c:upp ? 1 : 0,
                           answer:start + (upp ? 1 : -1) * steg * 3 }; },
  mul:     L => { const a = pick([2, 5, 10]), b = ri(2, 10);
                  return { kind:"mul", a, b, answer:a * b }; },
  /* Hälften av 94 är inget femåringen räknar i huvudet. Håll talen runda:
     antingen under tjugo, eller ett jämnt femtal. */
  half:    L => { const max = L.max || 100;
                  const svar = rnd(2) === 0 ? ri(2, 20) : ri(1, Math.floor(max / 10)) * 5;
                  return { kind:"half", a:svar * 2, answer:svar }; },
  /* Tre eller fyra tal på rad med blandade storlekar: 12 + 5 + 29 + 10 */
  flera:   L => { const antal = L.termer || 3, max = L.max || 100;
                  /* Taket per tal följer hur många de är, annars fylls
                     summan upp av de första och sista talet blir en tvåa. */
                  const stor = Math.max(12, Math.floor(max / antal));
                  const tal = []; let sum = 0;
                  for(let i = 0; i < antal; i++){
                    const kvar = antal - i - 1;
                    const tak = Math.max(2, Math.min(stor, max - sum - 2 * kvar));
                    /* Minst ett stort tal, resten blandas mellan smått och stort */
                    const litet = i > 0 && rnd(2) === 0;
                    const t = litet ? ri(2, Math.min(9, tak)) : ri(Math.min(10, tak), tak);
                    tal.push(t); sum += t;
                  }
                  shuffle(tal);
                  return { kind:"flera", tal, a:tal[0], b:tal[1], c:tal[2],
                           sum:tal[3], answer:sum }; }
};

/* Hur uppgiften ser ut på skärmen. "Dubbelt" ritas som ett plustal och
   "tiokompisar" som ett fattas-tal, så de räknas som samma sort här. */
const SHOWN = { count:"count", tiotal:"tiotal", add:"add", sub:"sub", missing:"missing",
                double:"add", ten:"missing", add3:"add3", serie:"serie", mul:"mul",
                half:"half", flera:"flera" };

/* Lägg sorterna i en ordning där samma sort aldrig kommer tre gånger i rad:
   ta alltid den sort det finns flest kvar av, men aldrig en som just
   förekommit två gånger. Det är därför en omgång aldrig blir bara minus. */
function arrangeKinds(kinds){
  const left = {};
  kinds.forEach(k => { left[k] = (left[k] || 0) + 1; });
  const kvarAv = (visning) => Object.keys(left)
    .filter(k => left[k] > 0 && SHOWN[k] === visning)
    .reduce((n, k) => n + left[k], 0);
  const out = [];
  while(out.length < kinds.length){
    const kvar = shuffle(Object.keys(left).filter(k => left[k] > 0));
    const f1 = out.length     ? SHOWN[out[out.length - 1]] : null;
    const f2 = out.length > 1 ? SHOWN[out[out.length - 2]] : null;
    const forbjuden = (f1 && f1 === f2) ? f1 : null;
    let val = kvar.filter(k => SHOWN[k] !== forbjuden);
    if(!val.length) val = kvar;
    /* Välj efter hur många som är kvar med samma utseende, inte av samma
       sort: fyra olika sorters plustal ser likadana ut på skärmen, och räknas
       de var för sig hamnar de sist och krockar med varandra. */
    let bast = val[0];
    for(const k of val) if(kvarAv(SHOWN[k]) > kvarAv(SHOWN[bast])) bast = k;
    out.push(bast); left[bast]--;
  }
  return out;
}

/* En omgång byggs i förväg: sorterna fördelas jämnt och sprids ut, och samma
   uppgift kommer inte två gånger förrän alla möjliga varianter är använda. */
function buildRound(L, count, undvik){
  if(L.pool){
    const delar = L.pool.map(levelById);
    return buildFranNivaer(() => pick(delar), delar, count, undvik);
  }
  const kinds = [];
  for(let i = 0; i < count; i++) kinds.push(L.kinds[i % L.kinds.length]);
  const order = arrangeKinds(shuffle(kinds));

  const out = [];
  /* undvik innehåller uppgifter från de närmast föregående omgångarna, så att
     två hållplatser i rad inte ger samma tal */
  let seen = new Set(undvik || []);
  for(const kind of order){
    let q = MAKE[kind](L);
    for(let t = 0; t < 20; t++){
      const key = q.kind + ":" + [q.count, q.a, q.b, q.c, q.sum].join("_");
      if(!seen.has(key)){ seen.add(key); break; }
      /* Små banor har färre uppgifter än en omgång – då börjar vi om varvet */
      if(t === 12) seen = new Set();
      q = MAKE[kind](L);
    }
    q.utanHjalp = !!L.utanHjalp;
    out.push(q);
  }
  return out;
}

const qNyckel = (q) => q.kind + ":" + [q.count, q.a, q.b, q.c, q.sum].join("_");

function stopKind(namn){
  if(STOP_ART[namn]) return STOP_ART[namn];
  if(/(torg|torget)$/i.test(namn)) return "torg";
  if(/(platsen|plats|plan|vallen)$/i.test(namn)) return "torg";
  if(/kyrka/i.test(namn)) return "kyrka";
  if(/sjukhus/i.test(namn)) return "sjukhus";
  return "gata";
}
function sceneSVG(namn){
  return `<svg class="scene" viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg" stroke-linejoin="round">${SCENES[stopKind(namn)] || SCENES.gata}</svg>`;
}

function namnFro(namn){

}

const FOTO_DATA = {};

/* Spårvagn framifrån, i linjens färg och med linjenumret i skylten */
function ljusFarg(hex){
  const h = (hex || "#888").replace("#", "");
  const n = h.length === 3 ? h.split("").map(c => c + c).join("") : h;
  const r = parseInt(n.slice(0,2), 16), g2 = parseInt(n.slice(2,4), 16), b = parseInt(n.slice(4,6), 16);
  return (0.299 * r + 0.587 * g2 + 0.114 * b) > 150;
}
function tramSVG(col, ref){
  const text = ljusFarg(col) ? INK : "#FFFDF7";
  return `<svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" stroke-linejoin="round">

const SFX = {
  ctx: null,
  ensure(){
    if(!P() || !P().settings.sound) return null;
    try{
      if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if(this.ctx.state === "suspended") this.ctx.resume();
      return this.ctx;
    }catch(e){ return null; }
  },
  tone(freq, at, dur, type, vol){
    const c = this.ensure(); if(!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "triangle";
    o.frequency.setValueAtTime(freq, c.currentTime + at);
    g.gain.setValueAtTime(0.0001, c.currentTime + at);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, c.currentTime + at + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + at + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + at); o.stop(c.currentTime + at + dur + 0.05);
  },
  tap(){ this.tone(520, 0, 0.07, "square", 0.09); },
  correct(){ [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, i * 0.075, 0.22, "triangle", 0.16)); },
  coin(){ this.tone(987.77, 0, 0.07, "square", 0.12); this.tone(1318.5, 0.07, 0.2, "square", 0.12); },
  wrong(){ this.tone(311.13, 0, 0.14, "sine", 0.14); this.tone(261.63, 0.13, 0.22, "sine", 0.13); },
  win(){ [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5].forEach((f, i) => this.tone(f, i * 0.13, 0.3, "triangle", 0.17)); },
  unlock(){ [392, 523.25, 659.25, 880].forEach((f, i) => this.tone(f, i * 0.11, 0.32, "triangle", 0.18)); },
  badge(){ [659.25, 880, 1046.5, 1318.5, 1760].forEach((f, i) => this.tone(f, i * 0.1, 0.34, "triangle", 0.18)); },
  tram(){ this.tone(392, 0, 0.5, "sawtooth", 0.07); this.tone(587.33, 0.06, 0.2, "square", 0.07); this.tone(493.88, 0.26, 0.3, "square", 0.06); },
  pling(){ this.tone(1174.7, 0, 0.1, "square", 0.11); this.tone(880, 0.1, 0.26, "square", 0.1); },
  /* Två mjuka toner före hållplatsutropet, som signalen i en spårvagn */
  utrop(){
    [[987.77, 0], [739.99, 0.26]].forEach(([f, t]) => {
      this.tone(f, t, 0.85, "sine", 0.16);
      this.tone(f * 2, t, 0.5, "sine", 0.05);
    });
  }
};

let svVoice = null;
function findVoice(){
  try{
    const vs = speechSynthesis.getVoices() || [];
    svVoice = vs.find(v => /^sv/i.test(v.lang)) || null;
  }catch(e){}
}
if(window.speechSynthesis){
  findVoice();
  if(speechSynthesis.addEventListener) speechSynthesis.addEventListener("voiceschanged", findVoice);
}
/* Hållplatsutrop läses lugnare och med lägre tonläge än matteuppgifterna,
   så att det låter mer som ett utrop och mindre som en lekkamrat. */
function speakUtrop(text){
  const p = P();
  if(!window.speechSynthesis || !text || !p || !p.settings.voice) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "sv-SE";
    if(svVoice) u.voice = svVoice;
    u.rate = Math.max(0.55, RATES[p.settings.rate != null ? p.settings.rate : 1].v - 0.12);
    u.pitch = 0.95;
    speechSynthesis.speak(u);
  }catch(e){}
}

function speak(text, force){
  const p = P();
  if(!window.speechSynthesis || !text) return;
  if(!force && (!p || !p.settings.voice)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "sv-SE";
    if(svVoice) u.voice = svVoice;
    u.rate = RATES[(p && p.settings.rate) != null ? p.settings.rate : 1].v;
    u.pitch = 1.15;
    speechSynthesis.speak(u);
  }catch(e){}
}

const CONFETTI_COLORS = ["#FFC42E", "#FF6B6B", "#62CDF2", "#57C96B", "#FF8AD0", "#9061F9"];
const fx = el("fx"), fxCtx = fx.getContext("2d");
let bits = [], fxRunning = false;
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function sizeCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  fx.width = innerWidth * dpr; fx.height = innerHeight * dpr;
  fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeCanvas();
addEventListener("resize", sizeCanvas);

function confetti(x, y, amount){
  if(reduceMotion) return;
  for(let i = 0; i < (amount || 40); i++){
    bits.push({ x, y, vx:(Math.random() - 0.5) * 9, vy:-Math.random() * 13 - 4,
      w:7 + Math.random() * 8, h:9 + Math.random() * 10,
      rot:Math.random() * Math.PI, vr:(Math.random() - 0.5) * 0.4, col:pick(CONFETTI_COLORS), life:1 });
  }
  if(!fxRunning){ fxRunning = true; requestAnimationFrame(stepFx); }
}
function stepFx(){
  fxCtx.clearRect(0, 0, innerWidth, innerHeight);
  bits = bits.filter(b => b.life > 0 && b.y < innerHeight + 60);
  bits.forEach(b => {
    b.vy += 0.42; b.x += b.vx; b.y += b.vy; b.rot += b.vr; b.vx *= 0.992;
    if(b.y > innerHeight * 0.8) b.life -= 0.02;
    fxCtx.save(); fxCtx.translate(b.x, b.y); fxCtx.rotate(b.rot);
    fxCtx.globalAlpha = Math.max(b.life, 0); fxCtx.fillStyle = b.col;
    fxCtx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); fxCtx.restore();
  });
  if(bits.length){ requestAnimationFrame(stepFx); }
  else { fxRunning = false; fxCtx.clearRect(0, 0, innerWidth, innerHeight); }
}

function newProfile(name, char){
  const p = {
    id: "p" + Date.now() + rnd(999),
    name: name, char: char,
    coins: 0, stars: {}, best: {},
    unlocked: 1, badges: [], bestStreak: 0, perfect: 0, rounds: 0,
    world: "land", tram: {}, tramLine: null, tramLevel: -1, tramMode: "choice", skill: null,
    stopsRidden: 0, linesDone: [], kopta: [],
    settings: { sound:true, voice:true, dots:true, rate:1 }
  };
  /* Ta med skatten från den första versionen av spelet */
  const gammalt = store("purse");
  if(gammalt && profiles.length === 0) p.coins = gammalt;
  return p;
}

/* Två spår. Huvudspåret (1–27) öppnas bana för bana i p.unlocked. Sidospåret
   Stjärnhimlen (28–31) öppnas när Berget är klart och räknas i p.sidoUpp. */
function sidoOppen(p){
  if(!p.sidoUpp && ((p.stars || {})[12] || 0) > 0) p.sidoUpp = SIDO_START;
  return p.sidoUpp || 0;
}
const arLast = (p, L) => huvudspar(L) ? L.id > p.unlocked : L.id > sidoOppen(p);
/* Nästa bana i samma spår, eller null när spåret är slut */
function nastaBana(L){
  return huvudspar(L) ? (L.id < HUVUD_MAX ? levelById(L.id + 1) : null)
                      : (L.id < SIDO_MAX  ? levelById(L.id + 1) : null);
}
/* Öppnar nästa bana om L var den senast öppnade i sitt spår. Ger banan som
   öppnades, annars null. */
function oppnaEfter(p, L){
  if(huvudspar(L)){
    if(L.id === p.unlocked && L.id < HUVUD_MAX){ p.unlocked = L.id + 1; return levelById(p.unlocked); }
  }else{
    if(L.id === sidoOppen(p) && L.id < SIDO_MAX){ p.sidoUpp = L.id + 1; return levelById(p.sidoUpp); }
  }
  return null;
}
function nextLevelId(p){
  for(const L of LEVELS) if(huvudspar(L) && !(p.stars || {})[L.id]) return Math.min(L.id, p.unlocked);
  return HUVUD_MAX;
}

/* Alla fördröjda händelser går genom later(), så att de kan avbrytas när
   barnet lämnar skärmen. Annars kunde nästa fråga, en uppläsning eller ett
   märkesfirande dyka upp ovanpå en helt annan vy. */
let timers = [];
function later(fn, ms){
  const id = setTimeout(() => { timers = timers.filter(t => t !== id); fn(); }, ms);
  timers.push(id);
  return id;
}
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

const SCREENS = ["profiles", "create", "map", "lines", "trip", "game", "result"];
function show(name){
  clearTimers();
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  SCREENS.forEach(n => el("screen-" + n).classList.toggle("is-active", n === name));
  const kartvy = name === "map" || name === "lines";
  el("mapHeader").hidden = !kartvy;
  document.body.classList.toggle("on-map", name === "map");
  document.body.classList.toggle("on-tram", name === "lines" || name === "trip");
  if(name !== "map" && name !== "trip") window.scrollTo({ top: 0, behavior: "auto" });
}

}, true);

function renderMap(){
  const p = P(); if(!p) return;
  renderHeader();
  const map = el("map");
  const height = nodeY(LEVELS.length - 1) + 120;
  map.style.height = height + "px";
  let html = "";

  /* Områdesband bakom banorna */
  REGIONS.forEach((reg, r) => {
    const idx = LEVELS.map((L, i) => L.r === r ? i : -1).filter(i => i >= 0);
    if(!idx.length) return;
    const top = nodeY(idx[0]) - 66, h = nodeY(idx[idx.length - 1]) - nodeY(idx[0]) + 138;
    html += `<div class="region-band ${reg.sidospar ? "sidospar" : ""}" style="top:${top}px;height:${h}px;background:${reg.tint}"></div>`;
    html += landskapHTML(r, top, h);
    html += `<div class="region-name" style="top:${top - 15}px">${reg.name}</div>`;
    if(reg.sidospar){
      const oppet = sidoOppen(p) > 0;
      html += `<div class="sidospar-text" style="top:${top + 34}px">${oppet
        ? "Sidospår · räkna när du vill"
        : "Sidospår · öppnas efter Berget"}</div>`;
    }
  });

  /* Stigen mellan banorna */
  LEVELS.forEach((L, i) => {
    if(i === LEVELS.length - 1) return;
    /* Ingen stig mellan huvudspårets slut och sidospårets början */
    if(huvudspar(L) !== huvudspar(LEVELS[i + 1])) return;
    const x1 = nodeX(i), y1 = nodeY(i), x2 = nodeX(i + 1), y2 = nodeY(i + 1);
    const last = arLast(p, LEVELS[i + 1]);
    for(const t of [0.24, 0.42, 0.6, 0.78]){
      const fyll = last ? "" : `background:${REGIONS[LEVELS[i + 1].r].color};`;
      html += `<div class="trail-dot ${last ? "locked" : ""}" style="${fyll}left:${x1 + (x2 - x1) * t}%;top:${y1 + (y2 - y1) * t}px"></div>`;
    }
  });

  /* Banorna */
  const current = nextLevelId(p);
  LEVELS.forEach((L, i) => {
    const stars = (p.stars || {})[L.id] || 0;
    const locked = arLast(p, L);
    const reg = REGIONS[L.r];
    html += `
      <button class="node ${locked ? "locked" : ""} ${L.id === current && !locked ? "current" : ""}"
              id="node-${L.id}" data-level="${L.id}" type="button" ${locked ? 'aria-disabled="true"' : ""}
              style="left:${nodeX(i)}%;top:${nodeY(i)}px"
              aria-label="Bana ${L.id}, ${L.name}${locked ? " (låst)" : ", " + stars + " av 3 stjärnor"}">
        <span class="node-face" style="background:${reg.color}">${locked ? LOCK_SVG : L.id}</span>
        <span class="node-stars">${locked ? "" : [0,1,2].map(s => s < stars ? STAR_ON : STAR_OFF).join("")}</span>
        <span class="node-label">${L.name}</span>
      </button>`;
  });

  /* Figuren står vid nästa bana */
  const ci = LEVELS.findIndex(L => L.id === current);
  if(ci >= 0){
    const wx = nodeX(ci) > 50 ? nodeX(ci) - 17 : nodeX(ci) + 17;
    html += `<div class="walker" style="left:${wx}%;top:${nodeY(ci)}px">${kompisSVG(p, "idle")}</div>`;
  }
  map.innerHTML = html;
}

function slumpFast(n){ const x = Math.sin(n * 127.1 + 11.7) * 43758.5453; return x - Math.floor(x); }

/* Sprid ut landskapet i kanterna så att banorna i mitten aldrig skyms */
function landskapHTML(r, top, hojd){
  const delar = LANDSKAP[r] || [];
  let html = "";
  const antal = Math.max(6, Math.round(hojd / 78));
  for(let i = 0; i < antal; i++){
    const d = delar[i % delar.length];
    const frö = r * 100 + i;
    const vanster = i % 2 === 0;
    const x = vanster ? 4 + slumpFast(frö) * 11 : 85 + slumpFast(frö + 7) * 11;
    const y = d.top ? top + 6 + slumpFast(frö + 3) * 14
                    : top + 26 + (hojd - 60) * ((i + 0.5) / antal) + slumpFast(frö + 5) * 22 - 11;
    const skala = 0.82 + slumpFast(frö + 9) * 0.42;
    html += `<div class="deco" style="left:${x.toFixed(1)}%;top:${y.toFixed(0)}px;width:${Math.round(d.w * skala)}px${d.top ? ";transform:translate(-50%,0)" : ""}">${d.a}</div>`;
  }
  return html;
}
