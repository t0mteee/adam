const lineByRef = (ref) => TRAM_LINES.find(l => l.ref === ref);

/* Spårvagnen kan köras på en vald bana, eller "Blandat" som drar uppgifter
   ur allt barnet har låst upp – det ger mest omväxling på en lång resa. */
function blandatLevel(p){
  /* Allt barnet kan – men inte 1 + 1 för den som räknar till 200. Uppgifterna
     dras ur de två senaste områdena barnet öppnat på huvudspåret. */
  const oppna = LEVELS.filter(L => huvudspar(L) && L.id <= p.unlocked && !L.pool);
  const omraden = [...new Set(oppna.map(L => L.r))].slice(-2);
  const pool = oppna.filter(L => omraden.includes(L.r)).map(L => L.id);
  const delar = pool.map(levelById);
  return { id:0, name:"Blandat", desc:"Allt du kan", pool,
           kinds:[...new Set(delar.flatMap(L => L.kinds))],
           max:Math.max(...delar.map(L => L.max)),
           utanHjalp: delar.some(L => L.utanHjalp), opts:4 };
}
/* Stigande: spelet håller reda på var barnet ligger med ett flyttal, höjer det
   vid rätt svar och sänker det vid fel. Uppgifterna dras från nivån runt det
   talet, så svårigheten stiger av sig själv och backar tillfälligt när det
   kärvar – tills nivån sitter igen. */
const SKILL_UPP = 0.2, SKILL_HJALP = -0.15, SKILL_NED = -0.5;

function skillNu(p){
  const topp = Math.min(p.unlocked || 1, HUVUD_MAX);
  return Math.max(1, Math.min(topp, p.skill == null ? topp : p.skill));
}
function justeraSkill(p, utfall){
  const topp = Math.min(p.unlocked || 1, HUVUD_MAX);
  const steg = utfall === "ratt" ? SKILL_UPP : utfall === "hjalp" ? SKILL_HJALP : SKILL_NED;
  p.skill = Math.max(1, Math.min(topp, skillNu(p) + steg));
}
function nivaForSkill(p){
  const topp = Math.min(p.unlocked || 1, HUVUD_MAX);
  const s = skillNu(p);
  const r = Math.random();
  /* Mestadels den nivå barnet är på, ibland en lättare och ibland en svårare */
  let id = Math.round(s);
  if(r < 0.22) id -= 1;
  else if(r < 0.37) id += 1;
  return levelById(Math.max(1, Math.min(topp, id))) || LEVELS[0];
}

function stigandeLevel(p){
  const nu = levelById(Math.round(skillNu(p))) || LEVELS[0];
  return { id:-1, name:"Stigande", desc:"Svårare efter hand", nuvarande: nu.name,
           kinds: nu.kinds, max: nu.max, opts: 4 };
}

/* En omgång där varje uppgift kan komma från olika nivå.
   Två uppgifter i samma omgång får aldrig vara lika. Att undvika föregående
   hållplatsers tal är önskvärt men får ge vika när nivåns förråd är litet –
   annars skulle till exempel Dubbelt, som bara har tio varianter, ta slut. */
function buildStigandeRound(p, count, undvik){
  const reserv = LEVELS.filter(L => huvudspar(L) && L.id <= Math.min(p.unlocked || 1, HUVUD_MAX) && !L.pool);
  return buildFranNivaer(() => nivaForSkill(p), reserv, count, undvik);
}
/* valjNiva lottar fram en bana per uppgift; reserv är banorna att leta i när
   inget färskt hittas – så att en omgång aldrig innehåller samma tal två
   gånger. Att undvika föregående hållplatsers tal är önskvärt men får ge vika
   när förrådet är litet, annars tar till exempel Dubbelt slut. */
function buildFranNivaer(valjNiva, reserv, count, undvik){
  const out = [];
  const iRundan = new Set();
  const tidigare = new Set(undvik || []);
  const gor = (L) => {
    const q = MAKE[pick(L.kinds)](L);
    q.opts = L.opts; q.utanHjalp = !!L.utanHjalp;
    return q;
  };
  for(let i = 0; i < count; i++){
    let vald = null, reserven = null;
    for(let t = 0; t < 40; t++){
      const kandidat = gor(valjNiva());
      const treIRad = out.length >= 2 && SHOWN[out[out.length - 1].kind] === SHOWN[kandidat.kind]
                                      && SHOWN[out[out.length - 2].kind] === SHOWN[kandidat.kind];
      if(treIRad) continue;
      if(!reserven) reserven = kandidat;
      const nyckel = qNyckel(kandidat);
      if(iRundan.has(nyckel)) continue;
      if(t < 22 && tidigare.has(nyckel)) continue;
      iRundan.add(nyckel);
      vald = kandidat;
      break;
    }
    if(!vald){
      for(const L2 of shuffle(reserv.slice())){
        for(let t = 0; t < 12 && !vald; t++){
          const kandidat = gor(L2);
          if(iRundan.has(qNyckel(kandidat))) continue;
          iRundan.add(qNyckel(kandidat));
          vald = kandidat;
        }
        if(vald) break;
      }
    }
    if(!vald) vald = reserven || gor(valjNiva());
    out.push(vald);
  }
  return out;
}

function tramLevelDef(p){
  if(p.tramLevel === -1) return stigandeLevel(p);
  return p.tramLevel === 0 ? blandatLevel(p) : (levelById(p.tramLevel) || LEVELS[0]);
}

/* ── Spårvagnen: ett eget äventyr ────────────────────────────────────────
   Spelaren står på en hållplats, väljer vagn och riktning, åker en hållplats
   i taget och kan byta vagn, vända eller hoppa av var som helst. Resan sparas
   som p.resa = { pos, ref, rikt } och åkta hållplatser per linje i p.besokta. */
function roundel(l, cls){
  const text = ljusFarg(l.col) ? INK : "#FFFDF7";
  return `<span class="roundel ${cls || ""}" style="background:${l.col};color:${text}">${l.ref}</span>`;
}
const linjerVid = (namn) => TRAM_LINES.filter(l => l.stops.includes(namn));
const besoktaPa = (p, ref) => (p.besokta && p.besokta[ref]) || [];
function linjeKlar(p, ref){
  const l = lineByRef(ref), b = new Set(besoktaPa(p, ref));
  return !!l && l.stops.every(x => b.has(x));
}
const riktOrdning = (l, rikt) => rikt === 1 ? l.stops : l.stops.slice().reverse();
/* Avgångar från en hållplats: varje linje åt de håll som inte tagit slut */
function avgangar(namn){
  const ut = [];
  for(const l of linjerVid(namn)){
    const i = l.stops.indexOf(namn);
    if(i < l.stops.length - 1) ut.push({ ref:l.ref, rikt:1,  mot:l.b, nasta:l.stops[i + 1], kvar:l.stops.length - 1 - i });
    if(i > 0)                  ut.push({ ref:l.ref, rikt:-1, mot:l.a, nasta:l.stops[i - 1], kvar:i });
  }
  return ut;
}

function stigPa(ref, rikt, pos){
  const p = P();
  p.resa = { pos, ref, rikt };

}

/* Vilka linjer delar en sträcka mellan två hållplatser. Där flera går
   parallellt ritas de bredvid varandra, som på en riktig linjekarta. */
const NAT_SEGMENT = {};
const segNyckel = (a, b) => a < b ? a + "|" + b : b + "|" + a;
TRAM_LINES.forEach(l => {
  for(let i = 0; i + 1 < l.stops.length; i++){
    const k = segNyckel(l.stops[i], l.stops[i + 1]);
    (NAT_SEGMENT[k] = NAT_SEGMENT[k] || []).push(l.ref);
  }
});
Object.values(NAT_SEGMENT).forEach(refs => refs.sort((a, b) => Number(a) - Number(b)));

/* En linjes väg som SVG-path, med sidoförskjutning på delade sträckor */
function natLinjePath(l){
  const bitar = [];
  for(let i = 0; i + 1 < l.stops.length; i++){
    const A = STOP_XY[l.stops[i]], B = STOP_XY[l.stops[i + 1]];
    if(!A || !B) continue;
    const refs = NAT_SEGMENT[segNyckel(l.stops[i], l.stops[i + 1])] || [l.ref];
    const plats = refs.indexOf(l.ref), mitt = (refs.length - 1) / 2;
    const dx = B[0] - A[0], dy = B[1] - A[1], len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len * 4.5 * (plats - mitt), ny = dx / len * 4.5 * (plats - mitt);
    bitar.push(`M${(A[0] + nx).toFixed(1)} ${(A[1] + ny).toFixed(1)}L${(B[0] + nx).toFixed(1)} ${(B[1] + ny).toFixed(1)}`);
  }
  return bitar.join("");
}

/* Fönstret kring en hållplats: så stort att grannhållplatserna får plats,
   men aldrig så litet att kartan blir en tom yta. */
function natFonster(l, i){
  const P = STOP_XY[l.stops[i]] || [530, 530];
  let r = 0;
  for(const j of [i - 1, i + 1]){
    const Q = l.stops[j] && STOP_XY[l.stops[j]];
    if(Q) r = Math.max(r, Math.hypot(Q[0] - P[0], Q[1] - P[1]));
  }
  const bredd = Math.max(200, Math.min(420, r * 2.7));
  /* Kartan tittar lite framåt i färdriktningen – vid ändstationen bakåt –
     så fönstret inte är halvtomt när man står i kanten av nätet. */
  const N = STOP_XY[l.stops[i + 1]] || STOP_XY[l.stops[i - 1]] || P;
  const cx = P[0] + (N[0] - P[0]) * 0.3, cy = P[1] + (N[1] - P[1]) * 0.3;
  return { x: cx - bredd / 2, y: cy - bredd / 2, w: bredd, h: bredd };
}
const viewBoxStr = (f) => `${f.x.toFixed(1)} ${f.y.toFixed(1)} ${f.w.toFixed(1)} ${f.h.toFixed(1)}`;

const HELA_NATET = { x: 20, y: 15, w: 1030, h: 1030 };
function natkartaSVG(l, at, o){
  o = o || {};
  const f = o.utzoomad ? HELA_NATET : natFonster(l, at);
  const skala = f.w / 260;                     /* 1 vid normalt fönster */
  const besokta = o.besokta || new Set();
  const stopp = new Set(l.stops);
  const andra = TRAM_LINES.filter(x => x.ref !== l.ref);
  let html = "";
  /* De andra linjerna, dämpade */
  html += andra.map(x => `<path class="nat-linje annan" d="${natLinjePath(x)}" stroke="${x.col.toLowerCase() === "#ffffff" ? "#B9B2CC" : x.col}" stroke-width="${(5 * skala).toFixed(1)}"/>`).join("");
  /* Den egna linjen */
  html += `<path class="nat-linje" d="${natLinjePath(l)}" stroke="${INK}" stroke-width="${(9.5 * skala).toFixed(1)}"/>`;
  html += `<path class="nat-linje" d="${natLinjePath(l)}" stroke="${l.col}" stroke-width="${(6 * skala).toFixed(1)}"/>`;
  /* Andra linjers hållplatser som små prickar */
  for(const [namn, P] of Object.entries(STOP_XY)){
    if(stopp.has(namn)) continue;
    html += `<circle cx="${P[0]}" cy="${P[1]}" r="${(3 * skala).toFixed(1)}" fill="#FFFDF7" stroke="#B9B2CC" stroke-width="${(1.5 * skala).toFixed(1)}"/>`;
  }
  /* Den egna linjens hållplatser: åkta fyllda, kommande vita */
  l.stops.forEach((namn, i) => {
    const P = STOP_XY[namn]; if(!P) return;
    if(i === at) return;
    const akt = besokta.has(namn);
    html += `<circle class="nat-stopp" data-stopp="${i}" cx="${P[0]}" cy="${P[1]}" r="${((o.utzoomad ? 4 : 6) * skala).toFixed(1)}"
      fill="${akt ? INK : "#FFFDF7"}" stroke="${INK}" stroke-width="${(2.6 * skala).toFixed(1)}"/>`;
  });
  /* Namn på hållplatsen, grannarna och ändstationerna. Varje namn prövar
     fyra lägen – höger, vänster, över, under – och tar det första som inte
     krockar med ett annat namn eller en hållplatsring; hittas inget hoppas
     namnet över. Den egna hållplatsen läggs alltid först, ovanför ringen. */
  const upptaget = [];
  /* Ett namn får varken krocka med ett annat eller sticka utanför fönstret */
  const krockar = (b) => b.x < f.x || b.x + b.w > f.x + f.w || b.y < f.y || b.y + b.h > f.y + f.h
    || upptaget.some(u => b.x < u.x + u.w && b.x + b.w > u.x && b.y < u.y + u.h && b.y + b.h > u.y);
  l.stops.forEach((namn, i) => { const P = STOP_XY[namn]; if(P) upptaget.push({ x:P[0] - 7 * skala, y:P[1] - 7 * skala, w:14 * skala, h:14 * skala }); });
  const ordning = (o.utzoomad ? [at, 0, l.stops.length - 1] : [at, at - 1, at + 1, 0, l.stops.length - 1, at - 2, at + 2])
    .filter((i, k, arr) => i >= 0 && i < l.stops.length && arr.indexOf(i) === k);
  ordning.forEach(i => {
    const P = STOP_XY[l.stops[i]]; if(!P) return;
    const har = i === at, namn = l.stops[i];
    /* Bredden uppskattas grovt – fet Nunito är bred – hellre för stor än för liten */
    const px = (har ? 13 : 11) * skala, w = namn.length * px * 0.7 + 4 * skala, h = px * 1.2;
    const lagen = har
      ? [{ x:P[0] - w / 2, y:P[1] - 20 * skala - h, anchor:"middle", tx:P[0], ty:P[1] - 20 * skala }]
      : [{ x:P[0] + 9 * skala,     y:P[1] - h / 2, anchor:"start",  tx:P[0] + 9 * skala, ty:P[1] + px * 0.35 },
         { x:P[0] - 9 * skala - w, y:P[1] - h / 2, anchor:"end",    tx:P[0] - 9 * skala, ty:P[1] + px * 0.35 },
         { x:P[0] - w / 2, y:P[1] - 10 * skala - h, anchor:"middle", tx:P[0], ty:P[1] - 10 * skala },
         { x:P[0] - w / 2, y:P[1] + 10 * skala,     anchor:"middle", tx:P[0], ty:P[1] + 10 * skala + px }];
    lagen.forEach(b => { b.w = w; b.h = h; });
    const lage = lagen.find(b => !krockar(b)) || (har ? lagen[0] : null);
    if(!lage) return;
    upptaget.push(lage);
    html += `<text class="nat-namn ${har ? "har" : ""}" x="${lage.tx.toFixed(1)}" y="${lage.ty.toFixed(1)}" font-size="${px.toFixed(1)}" text-anchor="${lage.anchor}">${namn}</text>`;
  });
  /* Här är vi: pulserande ring och linjens rundel */
  const H = STOP_XY[l.stops[at]] || [530, 530];
  const text = ljusFarg(l.col) ? INK : "#FFFDF7";
  html += `<g id="natHar" transform="translate(${H[0]},${H[1]})">
    <circle class="nat-ring" r="${(15 * skala).toFixed(1)}" fill="${l.col}" opacity=".5"/>
    <g class="nat-rundel"><circle r="${(11 * skala).toFixed(1)}" fill="${l.col}" stroke="${INK}" stroke-width="${(2.6 * skala).toFixed(1)}"/>
    <text font-size="${(11 * skala).toFixed(1)}" fill="${text}">${l.ref}</text></g>
  </g>`;
  return `<svg viewBox="${viewBoxStr(f)}" xmlns="http://www.w3.org/2000/svg" id="natSvg" role="img" aria-label="Linje ${l.ref} vid ${l.stops[at]}">${html}</svg>
    <button class="nat-zoom" type="button">${o.utzoomad ? "Zooma in" : "Hela nätet"}</button>
    <span class="nat-hint">${o.utzoomad ? "Tryck på kartan för att zooma in" : "Tryck på kartan för hela nätet"}</span>`;
}

/* Vagnen rullar från en hållplats till nästa och kartan följer med */
function animeraNatkarta(l, fran, till, ms){
  const svg = el("natSvg"), har = el("natHar");
  if(!svg || !har) return;
  const f0 = natFonster(l, fran), f1 = natFonster(l, till);
  const A = STOP_XY[l.stops[fran]], B = STOP_XY[l.stops[till]];
  if(!A || !B) return;
  const start = performance.now();
  const mjuk = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  function steg(nu){
    const t = mjuk(Math.min(1, (nu - start) / ms));
    svg.setAttribute("viewBox", viewBoxStr({
      x: f0.x + (f1.x - f0.x) * t, y: f0.y + (f1.y - f0.y) * t,
      w: f0.w + (f1.w - f0.w) * t, h: f0.h + (f1.h - f0.h) * t }));
    har.setAttribute("transform", `translate(${(A[0] + (B[0] - A[0]) * t).toFixed(1)},${(A[1] + (B[1] - A[1]) * t).toFixed(1)})`);
    if(t < 1) requestAnimationFrame(steg);
  }
  requestAnimationFrame(steg);
}

let tripRef = null, tripFrom = null;   /* tripFrom: index i linjen man just lämnade */

/* Kan bilderna inte hämtas alls – i en visare där bildmappen saknas – slutar vi
   be om dem. Ett enstaka misslyckande räcker inte som bevis: då kan det lika
   gärna vara en lucka i nätet, och resten av resan ska inte bli utan foton. */
let fotoMissar = 0, fotonAv = false;
/* Bilderna ligger som filer bredvid spelet. Bakas de in i stället (se
   verktyg/bygg-fristaende.py) ligger de redan i FOTO_DATA. */
function fotoSrc(foto){
  return FOTO_DATA[foto.f] || "./bilder/" + foto.f + ".jpg";
}

function openTrip(animera){
  const p = P();
  if(!p.resa || !lineByRef(p.resa.ref)){ renderStart(); show("lines"); return; }
  tripRef = p.resa.ref;
  if(p.tramLevel == null) p.tramLevel = -1;
  if(!p.tramMode) p.tramMode = "choice";
  if(g.recentLine !== tripRef){ g.recent = []; g.recentLine = tripRef; }
  saveProfiles();
  /* Skärmen först: show() rensar fördröjda händelser, och renderTrip lägger
     upp både fotots övergång och autoscrollen som sådana. */
  show("trip");

/* Fotot, dess byline och kameraknappen är samma sak för den som tittar,
   så de får ändras tillsammans. */
function visaFoto(på){
  const bild = el("stopFoto"), kred = el("stopKred"),
        knapp = el("stopCard").querySelector(".foto-knapp");
  if(!bild) return;
  bild.classList.toggle("borta", !på);
  if(kred) kred.classList.toggle("borta", !på);

    knapp.classList.toggle("på", på);
    knapp.setAttribute("aria-pressed", på ? "true" : "false");
    knapp.setAttribute("aria-label", på ? "Visa den tecknade bilden" : "Visa fotot på hållplatsen");
    knapp.title = på ? "Visa den tecknade bilden" : "Visa fotot";
  }
}

/* Var i linjen resan står: index i linjen, index i färdriktningen, om det är slut */
function resLage(p){
  const l = lineByRef(p.resa.ref), rikt = p.resa.rikt;
  const at = Math.max(0, l.stops.indexOf(p.resa.pos));
  const ordn = riktOrdning(l, rikt), k = ordn.indexOf(l.stops[at]);
  const slut = k >= ordn.length - 1;
  return { l, rikt, at, ordn, k, slut, mot: rikt === 1 ? l.b : l.a, nasta: slut ? null : ordn[k + 1] };
}

function renderTrip(animera, visaBilden){
  const p = P();
  const { l, rikt, at, ordn, k, slut, mot, nasta } = resLage(p);
  const n = ordn.length;
  const talnivå = tramLevelDef(p);
  const besokta = new Set(besoktaPa(p, l.ref));

  el("tripHead").style.setProperty("--linecol", l.col);
  el("tripHead").innerHTML = `
    <button class="icon-btn" data-trip="back" type="button" aria-label="Hoppa av och välj hållplats">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2E1A66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-8 7 8 7"/></svg>
    </button>
    <span class="trip-mid">
      <span class="line-ends">mot ${mot}</span>
      <button class="line-meta" data-trip="level" type="button" style="background:var(--paper-2);border:2px solid var(--ink);border-radius:999px;padding:2px 11px;cursor:pointer;font-family:inherit;color:inherit;white-space:nowrap">
        ${k + 1}/${n} · ${talnivå.name}${talnivå.nuvarande ? " · " + talnivå.nuvarande : ""} · byt
      </button>
      <span class="trip-bar"><span style="width:${Math.round(k / (n - 1) * 100)}%"></span></span>
    </span>
    ${roundel(l)}`;

  const namn = l.stops[at];
  const egetFoto = fotonAv ? null : STOP_PHOTOS[namn];
  const foto = egetFoto || (fotonAv ? null : vagnFoto(namn));
  const altText = egetFoto ? "Foto på hållplatsen " + namn : "En spårvagn i Göteborg";
  el("stopCard").innerHTML = `
    <div class="stop-card">
      <div class="scen-wrap${foto ? " har-foto" : ""}">
        ${sceneSVG(namn)}
        ${foto ? `<img class="foto" id="stopFoto" src="${fotoSrc(foto)}" alt="${altText}">` : ""}
      </div>
      ${foto ? `<p class="foto-kred" id="stopKred">${egetFoto ? "" : "Spårvagn i Göteborg · "}Foto: ${foto.by || "okänd"} · ${foto.lic} · Wikimedia Commons</p>` : ""}
      <div class="stop-info">
        <span style="min-width:0">
          <span class="stop-name" id="stopName">${namn}</span><br>
          <span class="stop-sub">${slut ? "Ändstation – byt vagn eller vänd" : k === 0 ? "Här börjar resan" : "Du är här"}</span>
        </span>
        <span class="stop-knappar">
        ${foto ? `<button class="icon-btn foto-knapp på" data-trip="foto" type="button" aria-label="Visa den tecknade bilden" title="Visa den tecknade bilden" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#2E1A66" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.7h3.4L8.2 6h7.6l1.8 2.7H21v9.6H3z"/><circle cx="12" cy="13.2" r="3.3"/></svg>
        </button>` : ""}
        <button class="icon-btn" data-trip="say" type="button" aria-label="Hör hållplatsen">
          <svg viewBox="0 0 24 24" fill="none" stroke="#2E1A66" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" fill="#2E1A66"/><path d="M16 9.2a4 4 0 0 1 0 5.6"/><path d="M18.6 6.4a8 8 0 0 1 0 11.2"/></svg>
        </button>
        </span>
      </div>
    </div>`;

  /* Rullar vagnen in ritas allt som det såg ut vid förra hållplatsen först */
  const visaAt = animera && tripFrom != null ? tripFrom : at;
  const visaK = ordn.indexOf(l.stops[visaAt]);
  el("natkarta").innerHTML = natkartaSVG(l, visaAt, { besokta, utzoomad: natUtzoomad, rikt });
  el("route").style.setProperty("--linecol", l.col);
  el("route").innerHTML =
    `<div class="route-line"><div class="done-part" style="height:${visaK * 52}px"></div></div>` +
    ordn.map((x, i) => `
      <div class="stop-row ${besokta.has(x) && i !== visaK ? "done" : ""} ${i === visaK ? "här" : ""}" data-stop="${i}">
        <span class="stop-dot"></span>
        <span class="stop-label">${x}${i === 0 || i === n - 1 ? '<span class="stop-tag">Ändstation</span>' : ""}</span>
      </div>`).join("") +
    `<div class="tram-marker ${animera ? "rullar" : ""}" id="tramMarker" style="top:${visaK * 52 + 26}px">${tramSVG(l.col, l.ref)}</div>`;

  const fotoEl = el("stopFoto");
  if(fotoEl){
    fotoEl.addEventListener("error", () => {
      if(++fotoMissar >= 3) fotonAv = true;
      fotoEl.remove();
      el("stopCard").querySelectorAll(".foto-kred, .foto-knapp").forEach(x => x.remove());
      el("stopCard").querySelector(".scen-wrap").classList.remove("har-foto");
    }, { once: true });
  }
  /* Hämta nästa hållplats bild i förväg, så den är på plats vid framkomsten */
  if(!fotonAv && nasta){
    const nästaFoto = STOP_PHOTOS[nasta] || vagnFoto(nasta);
    if(nästaFoto) new Image().src = fotoSrc(nästaFoto);
  }

  el("goBtn").className = "btn go-btn" + (slut ? " done" : "");
  el("goBtn").innerHTML = (slut
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>Ändstation – välj ny vagn!`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="13" height="13" rx="3.5"/><path d="M3 9.5h13M6 21l2-4M13 21l-2-4"/><circle cx="7" cy="13.5" r="1.1" fill="currentColor"/><circle cx="12" cy="13.5" r="1.1" fill="currentColor"/><path d="M18 10.5h4M20 8.5l2 2-2 2" /></svg>Åk till ${nasta}!`);

  if(animera && tripFrom != null && tripFrom !== at){
    requestAnimationFrame(() => later(() => rullaFram(at), 60));
  }else{
    tripFrom = null;
    if(visaBilden){
      window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
    }else if(el("allaStopp").open){
      const rad = el("route").querySelector(".stop-row.här");
      if(rad) later(() => rad.scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" }), 120);
    }
  }
}

/* Spårvagnen rullar fram till nästa hållplats */
function rullaFram(till){
  const p = P(), { l, ordn } = resLage(p), namn = l.stops[till];
  const k = ordn.indexOf(namn), fran = tripFrom;
  const vagn = el("tramMarker"), rader = el("route").querySelectorAll(".stop-row");
  const del = el("route").querySelector(".done-part");
  if(!vagn) return;
  SFX.tram();
  SFX.utrop();
  later(() => speakUtrop("Nästa hållplats: " + namn), 620);
  vagn.style.top = (k * 52 + 26) + "px";
  if(del) del.style.height = (k * 52) + "px";
  rader.forEach((r, i) => {
    r.classList.toggle("done", i < k || r.classList.contains("done"));
    r.classList.toggle("här", i === k);
  });
  if(!reduceMotion && fran != null) animeraNatkarta(l, fran, till, 900);
  el("natkarta").scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" });
  const rad = rader[k];
  if(rad && el("allaStopp").open) rad.scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" });
  later(() => {
    vagn.classList.remove("rullar");
    tripFrom = null;
    SFX.pling();
    const slut = k >= ordn.length - 1;
    /* Belöningen kom redan på resultatskärmen – här räcker plinget */
    speakUtrop(slut ? "Ändstation, " + namn + "." : namn);
    renderTrip(false, true);
  }, reduceMotion ? 60 : 950);
}

el("natkarta").addEventListener("click", (e) => {

  if(c){
    const l = lineByRef(tripRef), namn = l.stops[Number(c.dataset.stopp)];

    speakUtrop(namn);
    return;
  }
  if(!e.target.closest("svg") && !e.target.closest(".nat-zoom")) return;
  SFX.tap();
  vaxlaZoom();
});
function vaxlaZoom(){
  const p = P(); if(!p.resa) return;
  const { l, at, rikt } = resLage(p);
  const svg = el("natSvg");
  const f0 = natUtzoomad ? HELA_NATET : natFonster(l, at);
  natUtzoomad = !natUtzoomad;
  const f1 = natUtzoomad ? HELA_NATET : natFonster(l, at);
  const besokta = new Set(besoktaPa(p, l.ref));
  const klar = () => { el("natkarta").innerHTML = natkartaSVG(l, at, { besokta, utzoomad: natUtzoomad, rikt }); };
  if(reduceMotion || !svg){ klar(); return; }
  const start = performance.now(), ms = 520;
  const mjuk = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  (function steg(nu){
    const t = mjuk(Math.min(1, (nu - start) / ms));
    svg.setAttribute("viewBox", viewBoxStr({
      x: f0.x + (f1.x - f0.x) * t, y: f0.y + (f1.y - f0.y) * t,
      w: f0.w + (f1.w - f0.w) * t, h: f0.h + (f1.h - f0.h) * t }));
    if(t < 1) requestAnimationFrame(steg); else klar();
  })(start);
}

sheet.addEventListener("click", (e) => {
  const p = P();
  const close = e.target.closest('[data-action="close"]');
  if(close){ SFX.tap(); closeSheet(); return; }

  const start = e.target.closest("[data-start]");
  if(start){
    const [id, mode] = start.dataset.start.split(":");
    SFX.ensure(); SFX.tap(); closeSheet();
    startRound(Number(id), mode);
    return;
  }

  const tgl = e.target.closest("[data-toggle]");
  if(tgl){
    const key = tgl.dataset.toggle;
    p.settings[key] = !p.settings[key];
    tgl.setAttribute("aria-pressed", String(p.settings[key]));
    saveProfiles();
    if(key === "sound" && p.settings[key]) SFX.tap();
    if(key === "voice" && p.settings[key]) speak("Nu läser jag frågorna igen!");
    return;
  }

  const rate = e.target.closest("[data-rate]");
  if(rate){
    p.settings.rate = Number(rate.dataset.rate);
    sheet.querySelectorAll("[data-rate]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.rate) === p.settings.rate)));
    saveProfiles();
    speak(`Hej ${p.name}! Så här fort pratar jag nu.`, true);
    return;
  }

  const stig = e.target.closest("[data-stig]");
  if(stig){
    const [ref, rikt, pos] = stig.dataset.stig.split("|");
    SFX.ensure(); closeSheet(); stigPa(ref, Number(rikt), pos); return;
  }

  const tl = e.target.closest("[data-tramlevel]");
  if(tl){
    p.tramLevel = Number(tl.dataset.tramlevel); saveProfiles(); SFX.tap();
    speak(p.tramLevel === -1 ? "Stigande" : p.tramLevel === 0 ? "Blandat" : levelById(p.tramLevel).name);
    g.recent = [];   /* ny svårighet – börja om med färska tal */
    sheet.querySelectorAll("[data-tramlevel]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.tramlevel) === p.tramLevel)));
    if(el("screen-trip").classList.contains("is-active") && p.resa) renderTrip(false);
    return;
  }
  const tm = e.target.closest("[data-trammode]");
  if(tm){
    p.tramMode = tm.dataset.trammode; saveProfiles(); SFX.tap();
    sheet.querySelectorAll("[data-trammode]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.trammode === p.tramMode)));
    return;
  }
  const ch = e.target.closest("[data-setchar]");
  if(ch){
    p.char = ch.dataset.setchar;
    sheet.querySelectorAll("[data-setchar]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.setchar === p.char)));
    saveProfiles(); renderMap(); SFX.tap();
    return;
  }

  if(e.target.closest('[data-action="foton"]')){
    SFX.tap();
    const namn = Object.keys(STOP_PHOTOS).sort();
    openSheet(`
      <div class="sheet-head">
        <div><h2>Bilderna</h2><p class="sheet-sub">${namn.length} hållplatser har ett eget foto. Resten visar en spårvagn från Göteborg – kameraknappen växlar till den tecknade bilden.</p></div>
        ${CLOSE_BTN}
      </div>
      <p class="sheet-sub" style="margin:0 0 10px">Alla foton kommer från Wikimedia Commons och används enligt sina licenser. Tack till fotograferna:</p>
      <div style="max-height:46vh;overflow-y:auto;font-size:var(--t-xs);line-height:1.5">
        ${namn.map(n => `<div style="padding:3px 0;border-bottom:1px dashed rgba(46,26,102,.14)"><b>${n}</b><br>${STOP_PHOTOS[n].by} · ${STOP_PHOTOS[n].lic}</div>`).join("")}
        ${TRAM_PHOTOS.map(v => `<div style="padding:3px 0;border-bottom:1px dashed rgba(46,26,102,.14)"><b>Spårvagn i Göteborg</b><br>${v.by} · ${v.lic}</div>`).join("")}
      </div>`);
    return;
  }
  const varld = e.target.closest("[data-world]");
  if(varld){
    p.world = varld.dataset.world; saveProfiles();
    SFX.tap(); closeSheet();
    enterWorld(false);
    speak(p.world === "tram" ? "Spårvagn" : "Räknelandet");
    return;
  }
  const tapa = e.target.closest("[data-tapa]");
  if(tapa){
    p.tillbehor = p.tillbehor === tapa.dataset.tapa ? null : tapa.dataset.tapa;
    saveProfiles(); SFX.tap(); renderHeader(); visaHatten(); openShop();
    return;
  }
  const kop = e.target.closest("[data-kop]");
  if(kop){
    const v = BUTIK.find(x => x.id === kop.dataset.kop) || tillbehorAv(kop.dataset.kop);
    if(!v || p.coins < v.pris || (p.kopta || []).indexOf(v.id) !== -1) return;
    p.coins -= v.pris;
    p.kopta = (p.kopta || []).concat(v.id);
    /* En hatt tas på direkt – det är hela poängen med att köpa den */
    if(v.rita) p.tillbehor = v.id;
    saveProfiles();
    SFX.coin();
    renderHeader(); visaHatten();
    openShop();
    const r = sheet.getBoundingClientRect();
    confetti(r.left + r.width / 2, r.top + 90, 26);
    speak(v.rita ? `Du köpte ${v.ord}! Snyggt!` : `Du köpte ${v.ord}! Nu får du räkna ${v.flera} också.`);
    return;
  }
  if(e.target.closest('[data-action="switch"]')){
    SFX.tap(); closeSheet(); renderProfiles(); show("profiles"); return;
  }
  if(e.target.closest('[data-action="erase"]')){
    openSheet(`
      <div class="sheet-head"><div><h2>Ta bort ${escapeHtml(p.name)}?</h2>
      <p class="sheet-sub">Alla stjärnor, mynt och märken försvinner. Det går inte att ångra.</p></div>${CLOSE_BTN}</div>
      <div style="display:grid;gap:8px">
        <button class="btn danger" data-action="erase-yes" type="button">Ja, ta bort</button>
        <button class="btn" data-action="close" type="button" style="background:var(--paper-2)">Nej, behåll</button>
      </div>`);
    return;
  }
  if(e.target.closest('[data-action="erase-yes"]')){
    profiles = profiles.filter(x => x.id !== p.id);
    activeId = profiles.length ? profiles[0].id : null;
    saveProfiles(); closeSheet(); renderProfiles(); show("profiles");
    return;
  }
});

function butikRadHTML(v, p){
  const agd = (p.kopta || []).indexOf(v.id) !== -1;
  const hatt = !!v.rita;
  const rad = agd ? "butik-rad min" : "butik-rad";
  const bild = hatt
    ? `<svg viewBox="-64 -80 128 110">${v.rita}</svg>`
    : THINGS[v.id];
  const knapp = !agd
    ? `<button class="kop" data-kop="${v.id}" type="button" ${p.coins < v.pris ? "disabled" : ""}>Köp</button>`
    : hatt
      ? `<button class="kop ${p.tillbehor === v.id ? "pa" : ""}" data-tapa="${v.id}" type="button">${p.tillbehor === v.id ? "Ta av" : "Ta på"}</button>`
      : `<span class="agd">din!</span>`;
  return `<div class="${rad}">
    <span class="sak">${bild}</span>
    <span class="txt"><b>${v.name}</b><span>${COIN_SVG} ${v.pris} mynt</span></span>
    ${knapp}</div>`;
}

/* ═══════════════════════════════════════════
   Spelomgången
   ═══════════════════════════════════════════ */
const ROUND_LEN = 10;      /* Räknelandet: tio uppgifter per bana */
const TRAM_LEN  = 5;       /* Spårvagnen: fem uppgifter per hållplats */
const buddy = el("buddy"), qLabel = el("qLabel"), qVisual = el("qVisual"),
      qEquation = el("qEquation"), answerArea = el("answerArea"),
      feedback = el("feedback"), progress = el("progress"),
      coinCount = el("coinCount"), coinBox = el("coinBox");

const PRAISE = ["Snyggt!", "Precis!", "Toppen!", "Så bra!", "Grymt!", "Jättebra!", "Klockrent!", "Wow!"];
const NUDGE  = ["Nästan!", "Prova igen!", "Nästan där!", "Titta en gång till!"];

const g = {
  level: null, mode: "choice", queue: [], q: null, tram: null, len: ROUND_LEN,
  recent: [], recentLine: null,
  qIndex: 0, score: 0, streak: 0, bestStreak: 0, tries: 0, firstTry: 0,
  results: [], typed: "", locked: false, hint: false, thing: "apple", opts: []
};

function startRound(niva, mode, tramRef){
  const L = typeof niva === "object" ? niva : levelById(niva);
  g.level = L; g.mode = mode; g.tram = tramRef || null;
  g.len = g.tram ? TRAM_LEN : ROUND_LEN;
  /* På spårvagnen är varje omgång bara fem uppgifter, så vi minns de senaste
     hållplatsernas tal och undviker dem – annars känns frågorna likadana. */
  g.queue = (L.id === -1 && g.tram)
    ? buildStigandeRound(P(), g.len, new Set(g.recent))
    : buildRound(L, g.len, g.tram ? new Set(g.recent) : null);
  if(g.tram){
    g.queue.forEach(q => g.recent.push(qNyckel(q)));
    g.recent = g.recent.slice(-24);
  }
  g.qIndex = 0; g.score = 0; g.streak = 0; g.bestStreak = 0;
  g.firstTry = 0; g.results = []; g.locked = false;
  coinCount.textContent = "0";
  show("game");
  nextQuestion();
}

function nextQuestion(){
  if(g.qIndex >= g.len) return finishRound();
  g.q = g.queue[g.qIndex];
  g.tries = 0; g.typed = ""; g.locked = false; g.hint = false;
  g.thing = pick(sakerFor(P()));
  setBuddy("idle", "bob");
  feedback.innerHTML = "";
  renderProgress();
  paintQuestion();
  renderAnswerArea();
  speak(speechFor(g.q));
}

function setBuddy(mood, anim){
  const p = P();
  buddy.innerHTML = kompisSVG(p, mood);
  buddy.className = "buddy " + (anim || "bob");
  if(anim && anim !== "bob"){
    later(() => { buddy.className = "buddy bob"; buddy.innerHTML = kompisSVG(p, "idle"); }, 1300);
  }
}

function renderProgress(){
  let html = "";
  for(let i = 0; i < g.len; i++){
    const r = g.results[i];
    const cls = r === "first" ? "done" : r === "help" ? "miss" : i === g.qIndex ? "now" : "";
    html += `<span class="pip ${cls}"></span>`;
  }
  progress.innerHTML = html;
}
function bumpCoins(){
  coinCount.textContent = g.score;
  coinBox.classList.remove("pop"); void coinBox.offsetWidth; coinBox.classList.add("pop");
}

/* ── Så visas frågan ────────────────────── */
function speechFor(q){
  if(q.kind === "count")   return "Hur många ser du?";
  if(q.kind === "add")     return "Vad blir " + q.a + " plus " + q.b + "?";
  if(q.kind === "sub")     return "Vad blir " + q.a + " minus " + q.b + "?";
  if(q.kind === "add3")    return "Vad blir " + q.a + " plus " + q.b + " plus " + q.c + "?";
  if(q.kind === "missing") return q.a + " plus vad blir " + q.sum + "?";
  if(q.kind === "tiotal")  return q.ental
    ? `Hur många är ${q.tior} tior och ${q.ental} ental?`
    : `Hur många är ${q.tior} tior?`;
  if(q.kind === "mul")     return `Vad blir ${q.a} gånger ${q.b}?`;
  if(q.kind === "half")    return `Vad är hälften av ${q.a}?`;
  if(q.kind === "serie")   return `Vilket tal kommer sen? ${q.tal.join(", ")}, ...`;
  if(q.kind === "flera")   return "Vad blir " + q.tal.join(" plus ") + "?";
  return "";
}
function labelFor(q){
  if(q.kind === "count")   return "Hur många?";
  if(q.kind === "tiotal")  return "Hur många blir det?";
  if(q.kind === "serie")   return "Vilket tal kommer sen?";
  if(q.kind === "half")    return "Hur mycket är hälften?";
  if(q.kind === "missing") return "Hur många fattas?";
  return "Vad blir det?";
}
function equationHTML(q){
  const op = (s) => `<span class="op">${s}</span>`;
  if(q.kind === "count")   return `<span class="slot">?</span>`;
  if(q.kind === "add")     return `${q.a} ${op("+")} ${q.b} ${op("=")} <span class="slot">?</span>`;
  if(q.kind === "sub")     return `${q.a} ${op("−")} ${q.b} ${op("=")} <span class="slot">?</span>`;
  if(q.kind === "add3")    return `${q.a} ${op("+")} ${q.b} ${op("+")} ${q.c} ${op("=")} <span class="slot">?</span>`;
  if(q.kind === "missing") return `${q.a} ${op("+")} <span class="slot">?</span> ${op("=")} ${q.sum}`;
  if(q.kind === "flera")    return `${q.tal.join(" " + op("+") + " ")} ${op("=")} <span class="slot">?</span>`;
  if(q.kind === "mul")      return `${q.a} ${op("×")} ${q.b} ${op("=")} <span class="slot">?</span>`;
  if(q.kind === "half")     return `Hälften av ${q.a} ${op("=")} <span class="slot">?</span>`;
  if(q.kind === "serie")    return `${q.tal.join(op(",") + " ")}${op(",")} <span class="slot">?</span>`;
  if(q.kind === "tiotal")   return q.ental
    ? `${q.tior} tior ${op("+")} ${q.ental} ental ${op("=")} <span class="slot">?</span>`
    : `${q.tior} tior ${op("=")} <span class="slot">?</span>`;
  return "";
}
function thingsRow(count, faded, thing){
  let html = "";
  for(let i = 0; i < count; i++){
    html += `<span class="${i >= count - faded ? "gone" : ""}" style="animation-delay:${Math.min(i * 30, 400)}ms">${THINGS[thing]}</span>`;
  }
  return html;
}

/* Stora tal ritas i tiobasramar: varje ram rymmer tio saker. Fyra fulla ramar
   och sju lösa läses som 47 utan att man behöver räkna om från början. */
function thingsFrames(count, faded, thing){
  let html = "";
  for(let start = 0; start < count; start += 10){
    const antal = Math.min(10, count - start);
    let inner = "";
    for(let i = 0; i < antal; i++){
      const nr = start + i;
      inner += `<span class="${nr >= count - faded ? "gone" : ""}" style="animation-delay:${Math.min(nr * 14, 520)}ms">${THINGS[thing]}</span>`;
    }
    html += `<span class="ram ${antal < 10 ? "del" : ""}">${inner}</span>`;
  }
  return `<span class="ramar">${html}</span>`;
}

/* En hög saker: små tal som en rad om fem, stora som tiobasramar */
function hogHTML(count, faded, thing){
  return count > 10 ? thingsFrames(count, faded, thing)
                    : `<span class="grp five">${thingsRow(count, faded, thing)}</span>`;
}
function visualHTML(q){
  const t = g.thing;
  /* Räknebanorna går ut på att räkna – sakerna syns alltid */
  if(q.kind === "count" || q.kind === "tiotal") return hogHTML(q.count, 0, t);
  /* Från Berget och uppåt ska talet räknas, inte prickarna – då hjälper inga
     figurer, varken av inställningen eller efter ett feltryck. */
  if(q.utanHjalp) return "";
  if(!P().settings.dots && !g.hint) return "";
  /* Hjälpen ska räcka hela vägen upp till tjugo, annars tänds den när barnet
     behöver den mest och visar ingenting. */
  if(q.kind === "add"){
    if(q.a + q.b > 20) return "";
    return `<span class="grp">${thingsRow(q.a, 0, t)}</span><span class="plus">+</span><span class="grp">${thingsRow(q.b, 0, t)}</span>`;
  }
  if(q.kind === "add3"){
    if(q.a + q.b + q.c > 20) return "";
    return `<span class="grp">${thingsRow(q.a, 0, t)}</span><span class="plus">+</span>` +
           `<span class="grp">${thingsRow(q.b, 0, t)}</span><span class="plus">+</span>` +
           `<span class="grp">${thingsRow(q.c, 0, t)}</span>`;
  }
  if(q.kind === "sub")     return hogHTML(q.a, q.b, t);
  if(q.kind === "missing") return hogHTML(q.sum, q.sum - q.a, t);
  return "";
}
function paintQuestion(){
  const q = g.q;
  qLabel.textContent = labelFor(q);
  qVisual.innerHTML = visualHTML(q);
  const n = qVisual.querySelectorAll("svg").length;
  const ramar = !!qVisual.querySelector(".ram");
  const storlek = n === 0 ? ""
    : ramar ? (n > 60 ? " ram-xs" : n > 30 ? " ram-s" : " ram-m")
    : n <= 3 ? " jatte" : n <= 6 ? " stor" : n <= 10 ? "" : n <= 14 ? " dense" : " packed";
  qVisual.className = "q-visual" + storlek + (q.kind === "add3" && !ramar ? " trio packed" : "");
  qEquation.innerHTML = equationHTML(q);
  /* "8 tior + 7 ental = ?" är ord, inte siffror, och behöver mindre stil */
  qEquation.className = "q-equation"
    + (q.kind === "tiotal" || q.kind === "half" ? " ord" : "")
    + (q.kind === "flera" ? " mellan" : "");
  qEquation.style.display = q.kind === "count" ? "none" : "";
}

function makeOptions(q, n){
  const out = [q.answer], near = [];
  if(q.kind === "add")     near.push(Math.abs(q.a - q.b));
  if(q.kind === "sub")     near.push(q.a + q.b);
  if(q.kind === "add3")    near.push(q.a + q.b, q.b + q.c);
  if(q.kind === "missing") near.push(q.sum, q.a);
  if(q.kind === "count" && q.answer > 12) near.push(q.answer + 1, q.answer - 1, q.answer + 10, q.answer - 10);
  /* Vanligaste feltanken är att kasta om siffrorna eller lägga ihop dem */
  if(q.kind === "tiotal")  near.push(q.ental * 10 + q.tior, q.tior + q.ental,
                                     q.answer + 10, q.answer - 10);
  if(q.kind === "mul")     near.push(q.a + q.b, q.answer + q.a, q.answer - q.a, q.a * (q.b + 1));
  if(q.kind === "half")    near.push(q.a, q.answer + 1, q.answer - 1, q.a + 2);
  if(q.kind === "serie")   near.push(q.answer + q.steg, q.answer - q.steg,
                                     q.tal[2], q.answer + 1, q.answer - 1);
  if(q.kind === "flera"){
    /* Att glömma sista talet eller lägga ihop bara de två första är de fel
       som faktiskt görs när talen står på rad. */
    near.push(q.answer - q.tal[q.tal.length - 1], q.tal[0] + q.tal[1],
              q.answer + q.tal[0], q.answer + 10, q.answer - 10);
  }
  if(q.answer > 20)        near.push(q.answer + 10, q.answer - 10);
  near.push(q.answer + 1, q.answer - 1, q.answer + 2, q.answer - 2, q.answer + 3, q.answer - 3, q.answer + 4);
  const tak = Math.max(30, q.answer + 12);
  for(const v of near){
    if(out.length >= n) break;
    if(v >= 0 && v <= tak && out.indexOf(v) === -1) out.push(v);
  }
  let extra = q.answer + 5;
  while(out.length < n){ if(out.indexOf(extra) === -1 && extra >= 0) out.push(extra); extra++; }
  return shuffle(out);
}

function renderAnswerArea(){
  if(g.mode === "choice"){
    const n = g.q.opts || g.level.opts;
    g.opts = makeOptions(g.q, n);
    answerArea.innerHTML = `<div class="options ${n === 3 ? "three" : ""}">` +
      g.opts.map((v, i) => `<button type="button" class="btn opt c${i}" data-val="${v}">${v}</button>`).join("") + `</div>`;
  }else{
    answerArea.innerHTML = `
      <div class="typed">
        <div class="answer-display empty" id="display">?</div>
        <div class="keypad">
          ${[1,2,3,4,5,6,7,8,9].map(n => `<button type="button" class="btn key num" data-key="${n}">${n}</button>`).join("")}
          <button type="button" class="btn key del" data-key="del" aria-label="Sudda">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11v14H9L3 12z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg>
          </button>
          <button type="button" class="btn key num" data-key="0">0</button>
          <button type="button" class="btn key ok" data-key="ok" aria-label="Svara">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6"/></svg>
          </button>
        </div>
      </div>`;
  }
}
function updateDisplay(){
  const d = el("display"); if(!d) return;
  d.textContent = g.typed === "" ? "?" : g.typed;
  d.className = "answer-display" + (g.typed === "" ? " empty" : "");
}

/* ── Svarshantering ─────────────────────── */
function answer(value, sourceEl){
  if(g.locked) return;
  const q = g.q;
  const right = Number(value) === q.answer;
  g.tries++;

  if(right){
    g.locked = true;
    const firstTry = g.tries === 1;
    if(firstTry){ g.streak++; g.firstTry++; g.bestStreak = Math.max(g.bestStreak, g.streak); }
    else g.streak = 0;

    if(g.tram && g.level.id === -1) justeraSkill(P(), firstTry ? "ratt" : "hjalp");
    const mult = g.streak >= 6 ? 3 : g.streak >= 3 ? 2 : 1;
    const gain = firstTry ? 10 * mult : 5;
    g.score += gain;
    g.results[g.qIndex] = firstTry ? "first" : "help";

    if(sourceEl) sourceEl.classList.add("right");
    else { const d = el("display"); if(d) d.classList.add("right"); }

    SFX.correct();
    later(() => { SFX.coin(); bumpCoins(); }, 220);
    setBuddy("happy", "cheer");
    const r = buddy.getBoundingClientRect();
    confetti(r.left + r.width / 2, r.top + r.height / 2, firstTry ? 46 : 26);

    feedback.innerHTML = `<span class="bubble good">${pick(PRAISE)} +${gain}
      ${mult > 1 ? `<span class="combo">${g.streak} i rad — ×${mult} poäng!</span>` : ""}</span>`;
    const svit = g.streak === 3 || g.streak === 6;
    if(svit) speak(g.streak + " rätt i rad!");

    /* Extra beröm behöver längre paus, annars hinner varken texten läsas
       eller rösten tala innan nästa fråga börjar. */
    later(() => { g.qIndex++; nextQuestion(); }, svit ? 2400 : mult > 1 ? 1700 : 1250);
    return;
  }

  /* Fel svar — mjukt, aldrig minuspoäng */
  SFX.wrong();
  setBuddy("sad", "oops");
  if(sourceEl){ sourceEl.classList.add("wrong"); sourceEl.disabled = true; }
  else {
    const d = el("display");
    /* Vid tredje felet skrivs facit in i rutan strax nedan – då får den inte
       nollställas av den här fördröjningen. */
    if(d){ d.classList.add("wrong"); if(g.tries < 3) later(() => { g.typed = ""; updateDisplay(); }, 550); }
  }

  if(g.tries >= 3){
    g.locked = true;
    g.results[g.qIndex] = "help";
    if(g.tram && g.level.id === -1) justeraSkill(P(), "ned");
    /* Skriv in facit där barnet letade efter det – i svarsrutan, på rätt ruta
       och i själva talet – i stället för att bara säga siffran i en bubbla. */
    if(g.mode === "type"){
      g.typed = String(q.answer);
      updateDisplay();
      const d = el("display"); if(d) d.classList.add("right");
    }else{
      const ratt = [...answerArea.querySelectorAll(".opt")].find(x => Number(x.dataset.val) === q.answer);
      if(ratt){ ratt.disabled = false; ratt.classList.remove("wrong"); ratt.classList.add("right"); }
    }
    /* Utan hjälpbilder visas ändå svaret som saker när det är över – det är
       ingen räknehjälp längre, bara en bild av hur det hänger ihop. */
    if(q.utanHjalp && q.answer <= 30 && ["add", "sub", "missing"].includes(q.kind)){
      const kopia = Object.assign({}, q, { utanHjalp:false });
      const t = g.thing;
      qVisual.innerHTML = q.kind === "add" ? `<span class="grp">${thingsRow(q.a, 0, t)}</span><span class="plus">+</span><span class="grp">${thingsRow(q.b, 0, t)}</span>`
                        : q.kind === "sub" ? hogHTML(q.a, q.b, t) : hogHTML(q.sum, q.sum - q.a, t);
      qVisual.className = "q-visual" + (q.answer > 12 ? " packed" : q.answer > 6 ? "" : " stor");
    }
    qEquation.style.display = "";
    qEquation.innerHTML = q.kind === "count"
      ? `<span class="facit">${q.answer}</span>`
      : equationHTML(q).replace('<span class="slot">?</span>', `<span class="facit">${q.answer}</span>`);
    feedback.innerHTML = `<span class="bubble soft">Svaret är ${q.answer}. Nu tar vi nästa!</span>`;
    speak("Svaret är " + q.answer);
    later(() => { g.qIndex++; nextQuestion(); }, 2400);
    return;
  }
  if(!g.hint){
    g.hint = true;
    paintQuestion();
    feedback.innerHTML = `<span class="bubble soft">Räkna sakerna!</span>`;
  }else{
    feedback.innerHTML = `<span class="bubble soft">${pick(NUDGE)}</span>`;
  }
}

answerArea.addEventListener("click", (e) => {
  const opt = e.target.closest("[data-val]");
  if(opt){ answer(opt.dataset.val, opt); return; }
  const key = e.target.closest("[data-key]");
  if(!key) return;
  const k = key.dataset.key;
  if(k === "del"){ g.typed = g.typed.slice(0, -1); SFX.tap(); updateDisplay(); }
  else if(k === "ok"){ if(g.typed !== "") answer(g.typed, null); }
  else if(g.typed.length < 3){ g.typed += k; SFX.tap(); updateDisplay(); }
});

addEventListener("keydown", (e) => {
  if(!el("screen-game").classList.contains("is-active") || g.locked) return;
  if(overlay.classList.contains("open")) return;
  if(g.mode === "type"){
    if(/^[0-9]$/.test(e.key)){ if(g.typed.length < 3){ g.typed += e.key; SFX.tap(); updateDisplay(); } }
    else if(e.key === "Backspace"){ g.typed = g.typed.slice(0, -1); updateDisplay(); }
    else if(e.key === "Enter" && g.typed !== ""){ answer(g.typed, null); }
  }else if(/^[1-4]$/.test(e.key)){
    const btn = answerArea.querySelectorAll(".opt")[Number(e.key) - 1];
    if(btn && !btn.disabled) answer(btn.dataset.val, btn);
  }
});

/* ═══════════════════════════════════════════
   Resultat, upplåsning och nya märken
   ═══════════════════════════════════════════ */
function finishRound(){
  const p = P(), L = g.level;
  const perfect = g.firstTry;
  p.coins += g.score;
  p.bestStreak = Math.max(p.bestStreak || 0, g.bestStreak);
  if(g.tram) return finishTramStop(p, perfect);
  const stars = perfect >= 9 ? 3 : perfect >= 7 ? 2 : perfect >= 4 ? 1 : 0;

  const prevStars = (p.stars || {})[L.id] || 0;
  const bestKey = L.id + ":" + g.mode;
  const prevBest = p.best[bestKey] || 0;
  const isBest = g.score > prevBest;

  p.rounds = (p.rounds || 0) + 1;
  p.stars[L.id] = Math.max(prevStars, stars);
  p.best[bestKey] = Math.max(prevBest, g.score);
  if(perfect === ROUND_LEN) p.perfect = (p.perfect || 0) + 1;

  /* Nästa bana öppnas när den här är klarad med minst en stjärna */
  let unlocked = stars > 0 ? oppnaEfter(p, L) : null;
  /* Berget klart öppnar sidospåret – det är också en ny bana */
  if(!unlocked && stars > 0 && L.id === 12 && !p.sidoUpp) unlocked = levelById(sidoOppen(p));
  saveProfiles();
  const nya = newBadges(p);

  el("resultBuddy").innerHTML = kompisSVG(p, stars ? "happy" : "idle");
  el("resultStars").innerHTML = [0,1,2].map(i => i < stars ? STAR_ON : STAR_OFF).join("");
  const titles = ["Bra kämpat!", "Fint jobbat!", "Superbra!", "Helt fantastiskt!"];
  el("resultTitle").textContent = titles[stars];
  el("resultLand").hidden = false; el("resultTram").hidden = true;
  el("resultSub").textContent = `${perfect} av ${ROUND_LEN} rätt direkt · ${L.name}`;
  el("resultScore").innerHTML =
    `<div class="reward-row" style="grid-column:1/-1;width:100%">
       <span class="reward ny">${COIN_SVG}<span><span class="r-num">+${g.score}</span><span class="r-txt">nya mynt</span></span></span>
       <span class="reward">${KISTA_SVG}<span><span class="r-num">${p.coins}</span><span class="r-txt">i skattkistan</span></span></span>
     </div>
     <span class="score-chip">Rekord <b>${p.best[bestKey]}</b></span>
     <span class="score-chip">Stjärnor <b>${totalStars(p)}/${MAX_STARS}</b></span>` +
    (isBest && prevBest > 0 ? `<span class="new-best">Nytt rekord!</span>` : "");
  el("resultUnlock").innerHTML = unlocked
    ? `<span class="unlock-note">${NYCKEL_SVG} Ny bana öppen: ${unlocked.name}!</span>`
    : (stars === 0 ? `<span class="unlock-note" style="background:#FFF3CF;border-color:var(--sun-deep)">Ta minst 4 rätt direkt så öppnas nästa bana.</span>` : "");

  show("result");
  SFX.win();
  if(stars){
    later(() => confetti(innerWidth * 0.3, innerHeight * 0.4, 60), 150);
    later(() => confetti(innerWidth * 0.7, innerHeight * 0.4, 60), 450);
  }
  const namn = p.name;
  let spoken = stars === 3 ? `Helt fantastiskt, ${namn}! Tre stjärnor!`
    : stars ? `Fint jobbat, ${namn}! Du fick ${stars === 1 ? "en stjärna" : stars + " stjärnor"}!`
    : `Bra kämpat, ${namn}! Vi provar igen.`;
  if(unlocked) spoken += " Nu är en ny bana öppen!";
  speak(spoken);

  if(nya.length) later(() => celebrateBadges(nya), 2600);
}


/* Framme vid en hållplats: kort summering och en enda knapp vidare */
function finishTramStop(p, perfect){
  const { l, rikt, at, slut } = resLage(p);

  /* Att åka spårvagn ska också föra spelaren framåt: en felfri hållplats på
     den svåraste banan man har öppen (eller på Blandat) öppnar nästa bana.
     Annars vore man tvungen att spela Räknelandet för att få svårare tal. */
  let nyBana = null;
  if(perfect === g.len) p.tramPerfect = (p.tramPerfect || 0) + 1;
  /* Fyra av fem räcker. Ett enda feltryck ska inte stoppa en fyraåring.
     Stigande och Blandat för huvudspåret framåt; en vald bana för sitt spår. */
  if(perfect >= g.len - 1){
    const spelad = p.tramLevel > 0 ? levelById(p.tramLevel) : levelById(p.unlocked);
    if(spelad) nyBana = oppnaEfter(p, spelad);
    if(!nyBana && spelad && spelad.id === 12 && !p.sidoUpp) nyBana = levelById(sidoOppen(p));
  }
  const nästa = slut ? at : at + rikt;
  p.resa.pos = l.stops[nästa];
  p.besokta = p.besokta || {};
  for(const x of [l.stops[at], l.stops[nästa]])
    if(!besoktaPa(p, l.ref).includes(x)) p.besokta[l.ref] = besoktaPa(p, l.ref).concat(x);
  p.stopsRidden = (p.stopsRidden || 0) + 1;
  p.linesDone = p.linesDone || [];
  if(linjeKlar(p, l.ref) && !p.linesDone.includes(l.ref)) p.linesDone.push(l.ref);
  saveProfiles();
  tripFrom = at;
  const nya = newBadges(p);

  el("resultLand").hidden = true;
  el("resultTram").hidden = false;
  el("resultTram").innerHTML = `
    ${roundel(l, "lg")}
    <h2 style="margin-top:8px">Bra åkt!</h2>
    <p class="sheet-sub" style="margin:4px 0 0">${perfect} av ${g.len} rätt direkt</p>
    <div class="reward-row">
      <span class="reward ny">${COIN_SVG}<span><span class="r-num">+${g.score}</span><span class="r-txt">nya mynt</span></span></span>
      <span class="reward">${KISTA_SVG}<span><span class="r-num">${p.coins}</span><span class="r-txt">i skattkistan</span></span></span>
    </div>
    ${nyBana ? `<span class="unlock-note">${NYCKEL_SVG} Ny bana öppen: ${nyBana.name}!</span>` : ""}
    <button class="btn btn-big" id="rideOnBtn" type="button">Åk vidare!</button>`;
  el("rideOnBtn").addEventListener("click", () => {
    SFX.tap();
    openTrip(true);
  }, { once: true });

  show("result");
  SFX.win();
  confetti(innerWidth / 2, innerHeight * 0.42, 34);
  speak(nyBana ? `Bra åkt! Ny bana öppen: ${nyBana.name}!` : `Bra åkt! ${g.score} mynt.`);
  /* Fira märket här, inte när vagnen rullar in – annars skyms hållplatsen */
  if(nya.length) later(() => celebrateBadges(nya), 900);
}

function newBadges(p){
  const nya = [];
  for(const b of BADGES){
    if(!p.badges.includes(b.id) && b.test(p)){ p.badges.push(b.id); nya.push(b); }
  }
  if(nya.length) saveProfiles();
  return nya;
}

function celebrateBadges(list){
  if(!list.length){ closeSheet(); return; }
  const b = list[0];
  SFX.badge();
  confetti(innerWidth / 2, innerHeight * 0.45, 70);
  openSheet(`
    <div class="cheer-card">
      <span class="b-art">${badgeArt(b.art)}</span>
      <p class="sheet-sub" style="margin:0">Nytt märke!</p>
      <h2>${b.name}</h2>
      <p class="sheet-sub">${b.desc}</p>
      <button class="btn btn-big" data-action="close" type="button" style="margin-top:14px">${list.length > 1 ? "Nästa märke" : "Toppen!"}</button>
    </div>`);
  sheet.querySelector('[data-action="close"]').addEventListener("click", () => {
    if(list.length > 1) later(() => celebrateBadges(list.slice(1)), 220);
  }, { once: true });
  speak(`Nytt märke! ${b.name}!`);
}

el("againBtn").addEventListener("click", () => { SFX.tap(); startRound(g.level, g.mode); });
el("backBtn").addEventListener("click", () => { SFX.tap(); enterWorld(false); });
el("homeBtn").addEventListener("click", () => {
  SFX.tap();
  try{ speechSynthesis.cancel(); }catch(e){}
  if(g.tram){ renderTrip(false); show("trip"); } else enterWorld(false);
});
el("speakBtn").addEventListener("click", () => {

});

/* Ligger spelet på en egen adress med manifest sparas det för spel utan nät.
   I artifact-visaren finns inget manifest, och då hoppas registreringen över. */
/* Hemskärmsappen kan ligga kvar i minnet i dagar med en gammal sida uppe.
   När en ny version har hämtats i bakgrunden visas en knapp som laddar om,
   och varje gång appen kommer tillbaka i förgrunden letas efter en nyare. */
function visaNyVersion(){
  if(el("nyVersion")) return;
  const k = document.createElement("button");
  k.id = "nyVersion"; k.type = "button"; k.className = "ny-version";
  k.textContent = "Ny version – tryck för att ladda om";
  k.addEventListener("click", () => location.reload());
  document.body.appendChild(k);
}
if("serviceWorker" in navigator && location.protocol.startsWith("http")
   && document.querySelector('link[rel="manifest"]')){
  addEventListener("load", () => navigator.serviceWorker.register("./sw.js").then(reg => {
    const bevaka = (w) => w && w.addEventListener("statechange", () => {
      if(w.state === "installed" && navigator.serviceWorker.controller) visaNyVersion();
    });
    bevaka(reg.installing);
    reg.addEventListener("updatefound", () => bevaka(reg.installing));
    document.addEventListener("visibilitychange", () => {
      if(document.visibilityState === "visible") reg.update().catch(() => {});
    });
  }).catch(() => {}));
}

/* Räknebanorna 16–19 låg mitt i kedjan och spärrade Vagnhallen. Nu är de
   sidospåret 28–31 och Vagnhallen börjar på 16. Sparfiler från den gamla
   ordningen flyttas en gång: stjärnor, rekord, öppnade banor, valt tal. */
function flyttaTillTvaSpar(p){
  if(p.tvaSpar) return;
  const ny = (id) => id <= 15 ? id : id <= 19 ? id + 12 : id - 4;
  const stars = {}, best = {};
  for(const k of Object.keys(p.stars || {})) stars[ny(Number(k))] = p.stars[k];
  for(const k of Object.keys(p.best || {})){
    const [id, lage] = k.split(":");
    best[ny(Number(id)) + ":" + lage] = p.best[k];
  }
  p.stars = stars; p.best = best;
  const u = p.unlocked || 1;
  if(u <= 15){ p.unlocked = u; }
  else if(u <= 19){ p.unlocked = 16; p.sidoUpp = 28 + (u - 16); }
  else { p.unlocked = u - 4; p.sidoUpp = 31; }
  if(p.tramLevel > 0) p.tramLevel = ny(p.tramLevel);
  if(p.skill != null){
    p.skill = p.skill < 16 ? p.skill : p.skill < 20 ? 15 + (p.skill - 16) / 4 : p.skill - 4;
  }
  const marke = { reg5:"regS", reg6:"regV", reg7:"regA" };
  p.badges = (p.badges || []).map(b => marke[b] || b);
  p.tvaSpar = true; p.nyssFlyttad = true;
}

(function init(){
  /* Äldre sparfiler kan sakna fält som tillkommit senare */
  profiles.forEach(p => {
    p.stars = p.stars || {}; p.best = p.best || {}; p.badges = p.badges || [];
    p.coins = p.coins || 0; p.unlocked = p.unlocked || 1;
    p.tram = p.tram || {}; p.world = p.world || "land";
    p.tramMode = p.tramMode || "choice"; p.stopsRidden = p.stopsRidden || 0;
    /* Stigande är nytt standardläge. Flytta över den som aldrig valt själv,
       en enda gång, så ett medvetet val av Blandat får stå kvar sedan. */
    if(!p.stigandeFlytt){ if(p.tramLevel == null || p.tramLevel === 0) p.tramLevel = -1; p.stigandeFlytt = true; }
    p.linesDone = p.linesDone || [];
    p.settings = Object.assign({ sound:true, voice:true, dots:true, rate:1 }, p.settings || {});
    flyttaTillTvaSpar(p);
    /* Förr åkte man en linje från ände till ände och läget var ett index per
       linje. Nu är resan fri: åkta hållplatser per linje, och var man står. */
    if(!p.frittAventyr){
      p.besokta = p.besokta || {};
      for(const ref of Object.keys(p.tram || {})){
        const l = lineByRef(ref); if(!l) continue;
        p.besokta[ref] = l.stops.slice(0, Math.min(p.tram[ref], l.stops.length - 1) + 1);
      }
      const l = p.tramLine && lineByRef(p.tramLine);
      if(l){
        const k = Math.min((p.tram || {})[l.ref] || 0, l.stops.length - 1);
        p.resa = { pos: l.stops[k], ref: l.ref, rikt: k >= l.stops.length - 1 ? -1 : 1 };
      }
      p.frittAventyr = true; p.nyssFlyttad = true;
    }
  });
  /* Flyttade sparfiler ska sparas direkt, inte först vid nästa omgång */
  if(profiles.some(p => p.nyssFlyttad)){ profiles.forEach(p => delete p.nyssFlyttad); saveProfiles(); }
  if(activeId && P()) enterWorld(true);
  else { renderProfiles(); show("profiles"); }
})();
})();
