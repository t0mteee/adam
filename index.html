<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Räknelandet – ett färgglatt mattespel för barn från 4 år. Fem nivåer, välj-svar eller skriv-svar, guldmynt och stjärnor.">
<meta name="theme-color" content="#62CDF2">
<title>Räknelandet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600..800&family=Lilita+One&family=Nunito:wght@700;800&display=swap">
<style>
/* ─────────────────────────────────────────────
   RÄKNELANDET — leksaksvärld i klistermärkesstil
   Medvetet enfärgstema (ingen mörkt läge): en
   solig lekvärld ska se likadan ut överallt.
   ───────────────────────────────────────────── */
:root{
  color-scheme: light;

  /* Bläck & neutraler (lila-stick, aldrig rent grått) */
  --ink:        #2E1A66;
  --ink-2:      #5B47A0;
  --paper:      #FFFDF7;
  --paper-2:    #F0EAFF;

  /* Lekvärldens färger */
  --sky:        #62CDF2;
  --sky-hi:     #A6E7FF;
  --sky-deep:   #2FA9D8;
  --grass:      #57C96B;
  --grass-deep: #3E9E51;
  --sun:        #FFC42E;
  --sun-deep:   #E29A00;
  --melon:      #FF6B6B;
  --melon-deep: #DD4747;
  --bubble:     #FF8AD0;
  --grape:      #9061F9;

  /* Djup */
  --lift:  0 6px 0 var(--ink), 0 12px 20px rgba(46,26,102,.22);
  --lift-sm: 0 4px 0 var(--ink), 0 8px 14px rgba(46,26,102,.18);
  --stroke: 3px solid var(--ink);

  /* Typskala */
  --t-xs: .78rem;
  --t-sm: .95rem;
  --t-md: 1.15rem;
  --t-lg: 1.6rem;
  --t-xl: 2.3rem;
  --t-2xl: clamp(2.6rem, 9vw, 4.2rem);
}

*{ box-sizing: border-box; }

html, body{ height: 100%; }

body{
  margin: 0;
  padding: 0;
  font-family: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  font-weight: 700;
  color: var(--ink);
  background: var(--sky);
  background-image:
    radial-gradient(circle at 18% 12%, rgba(255,255,255,.55) 0 42px, transparent 43px),
    radial-gradient(circle at 24% 15%, rgba(255,255,255,.55) 0 30px, transparent 31px),
    radial-gradient(circle at 82% 22%, rgba(255,255,255,.42) 0 34px, transparent 35px),
    radial-gradient(circle at 76% 25%, rgba(255,255,255,.42) 0 24px, transparent 25px),
    linear-gradient(180deg, var(--sky-hi) 0%, var(--sky) 46%, #7FD9F6 100%);
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

/* Gräskulle längst ner i världen */
.world{ position: fixed; inset: auto 0 0 0; height: 26vh; min-height: 130px; pointer-events: none; z-index: 0; }
.world .hill{ position: absolute; bottom: -40%; border-radius: 50% 50% 0 0; }
.world .hill.a{ left: -12%; width: 62%; height: 150%; background: var(--grass); opacity: .85; }
.world .hill.b{ right: -14%; width: 68%; height: 130%; background: var(--grass-deep); opacity: .8; }
.world .hill.c{ left: 26%; width: 55%; height: 105%; background: #6BD97E; opacity: .9; }

/* ── Layout ─────────────────────────────── */
#app{
  position: relative; z-index: 1;
  max-width: 780px;
  margin: 0 auto;
  padding: clamp(14px, 3vw, 28px) clamp(12px, 3vw, 20px) 40px;
  min-height: 100%;
}
.screen{ display: none; animation: screen-in .35s cubic-bezier(.2,1.3,.5,1) both; }
.screen.is-active{ display: block; }
/* Spel och resultat fyller skärmen så inget flyter upp i ett tomt hörn */
#screen-game.is-active,
#screen-result.is-active{
  display: flex;
  flex-direction: column;
  min-height: calc(100vh - 110px);
  min-height: calc(100dvh - 110px);
}
#screen-result.is-active{ justify-content: center; }
@keyframes screen-in{ from{ opacity: 0; transform: translateY(14px) scale(.98); } to{ opacity: 1; transform: none; } }

/* ── Typografi ──────────────────────────── */
h1, h2, h3{ font-family: "Baloo 2", "Baloo 2 Fallback", system-ui, sans-serif; font-weight: 800; margin: 0; line-height: 1.05; text-wrap: balance; }

.brand{ text-align: center; margin-bottom: clamp(16px, 4vw, 26px); }
.brand h1{
  font-size: var(--t-2xl);
  color: var(--paper);
  letter-spacing: -.01em;
  -webkit-text-stroke: 8px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 7px 0 var(--ink);
}
.brand .tagline{
  margin: 10px auto 0;
  display: inline-block;
  padding: 5px 16px;
  background: var(--sun);
  border: var(--stroke);
  border-radius: 999px;
  box-shadow: var(--lift-sm);
  font-size: var(--t-sm);
  letter-spacing: .01em;
}

/* ── Paneler ────────────────────────────── */
.panel{
  background: var(--paper);
  border: var(--stroke);
  border-radius: 26px;
  box-shadow: var(--lift);
  padding: clamp(14px, 3vw, 20px);
  margin-bottom: clamp(16px, 3.5vw, 24px);
}
.panel-title{
  display: flex; align-items: center; gap: 10px;
  font-size: var(--t-lg);
  margin-bottom: 14px;
}
/* Siffran är ett riktigt steg i ordningen: kompis → nivå → spelsätt */
.step{
  flex: none;
  width: 34px; height: 34px;
  display: grid; place-items: center;
  background: var(--grape); color: #fff;
  border: var(--stroke); border-radius: 50%;
  font-family: "Lilita One", system-ui, sans-serif;
  font-size: 1.15rem; line-height: 1;
  padding-top: 2px;
}

/* ── Leksaksknapp: trycks ihop när man klickar ── */
.btn{
  font-family: "Baloo 2", system-ui, sans-serif;
  font-weight: 800;
  color: var(--ink);
  background: var(--paper);
  border: var(--stroke);
  border-radius: 20px;
  box-shadow: var(--lift);
  cursor: pointer;
  padding: 12px 20px;
  font-size: var(--t-md);
  touch-action: manipulation;
  transition: transform .09s ease, box-shadow .09s ease, background-color .15s ease;
  -webkit-user-select: none; user-select: none;
}
.btn:active,
.btn.is-pressed{ transform: translateY(6px); box-shadow: 0 0 0 var(--ink), 0 3px 8px rgba(46,26,102,.2); }
.btn:focus-visible{ outline: 4px dashed var(--grape); outline-offset: 4px; }
.btn[disabled]{ cursor: default; }

.btn-play{
  display: block;
  width: 100%;
  padding: 20px;
  font-size: clamp(1.7rem, 6vw, 2.4rem);
  background: var(--sun);
  border-radius: 28px;
  letter-spacing: .01em;
  animation: play-pulse 2.4s ease-in-out infinite;
}
.btn-play:hover{ background: #FFD35E; }
@keyframes play-pulse{ 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.025); } }

/* ── Val: kompisar ──────────────────────── */
.pick-grid{ display: grid; gap: 10px; }
.char-grid{ grid-template-columns: repeat(3, 1fr); }
@media (min-width: 560px){ .char-grid{ grid-template-columns: repeat(6, 1fr); } }

.char-card{
  background: var(--paper-2);
  border: var(--stroke);
  border-radius: 20px;
  box-shadow: var(--lift-sm);
  padding: 8px 4px 6px;
  display: grid; justify-items: center; gap: 2px;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .12s ease, box-shadow .12s ease, background-color .15s ease;
}
.char-card svg{ width: 100%; max-width: 76px; height: auto; display: block; }
.char-card .char-name{ font-size: var(--t-xs); font-weight: 800; }
.char-card[aria-pressed="true"]{
  background: var(--sun);
  transform: translateY(-3px);
  box-shadow: 0 8px 0 var(--ink), 0 14px 18px rgba(46,26,102,.24);
}
.char-card:focus-visible{ outline: 4px dashed var(--grape); outline-offset: 3px; }

/* ── Val: nivåer ────────────────────────── */
.level-grid{ grid-template-columns: 1fr; gap: 8px; }
.level-card{
  display: grid;
  grid-template-columns: 46px 1fr auto;
  align-items: center;
  gap: 12px;
  text-align: left;
  padding: 10px 14px;
  border-radius: 18px;
  background: var(--paper-2);
  border: var(--stroke);
  box-shadow: var(--lift-sm);
  cursor: pointer;
  touch-action: manipulation;
  font-family: inherit;
  color: inherit;
  transition: transform .12s ease, box-shadow .12s ease, background-color .15s ease;
}
.level-card .lvl-badge{
  width: 46px; height: 46px;
  display: grid; place-items: center;
  border: var(--stroke); border-radius: 14px;
  font-family: "Lilita One", system-ui, sans-serif;
  font-size: 1.5rem; color: #fff; padding-top: 3px;
}
.level-card .lvl-name{ font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; font-size: var(--t-md); line-height: 1.1; }
.level-card .lvl-desc{ font-size: var(--t-xs); font-weight: 700; color: var(--ink-2); }
.level-card .lvl-best{
  font-size: var(--t-xs);
  background: var(--paper); border: 2px solid var(--ink); border-radius: 999px;
  padding: 3px 10px; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.level-card[aria-pressed="true"]{ background: var(--sun); transform: translateY(-2px); box-shadow: 0 7px 0 var(--ink), 0 12px 16px rgba(46,26,102,.22); }
.level-card:focus-visible{ outline: 4px dashed var(--grape); outline-offset: 3px; }

/* ── Val: spelsätt ──────────────────────── */
.mode-grid{ grid-template-columns: 1fr 1fr; gap: 10px; }
.mode-card{
  background: var(--paper-2);
  border: var(--stroke); border-radius: 20px; box-shadow: var(--lift-sm);
  padding: 12px 10px; cursor: pointer; touch-action: manipulation;
  display: grid; justify-items: center; gap: 6px;
  font-family: inherit; color: inherit;
  transition: transform .12s ease, box-shadow .12s ease, background-color .15s ease;
}
.mode-card .mode-name{ font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; font-size: var(--t-md); }
.mode-card .mode-desc{ font-size: var(--t-xs); font-weight: 700; color: var(--ink-2); text-align: center; }
.mode-card svg{ width: 100%; max-width: 120px; height: auto; }
.mode-card[aria-pressed="true"]{ background: var(--sun); transform: translateY(-2px); box-shadow: 0 7px 0 var(--ink), 0 12px 16px rgba(46,26,102,.22); }
.mode-card:focus-visible{ outline: 4px dashed var(--grape); outline-offset: 3px; }

/* ── Inställningar (för vuxna) ──────────── */
.settings{ display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
.toggle{
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255,253,247,.9);
  border: var(--stroke); border-radius: 999px;
  padding: 7px 14px 7px 9px;
  font-size: var(--t-xs); font-weight: 800;
  cursor: pointer; touch-action: manipulation;
  box-shadow: var(--lift-sm);
  transition: transform .1s ease, box-shadow .1s ease;
}
.toggle:active{ transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
.toggle .dot{
  width: 30px; height: 18px; border-radius: 999px;
  background: #D6CCF0; border: 2px solid var(--ink);
  position: relative; flex: none; transition: background-color .18s ease;
}
.toggle .dot::after{
  content: ""; position: absolute; top: 1px; left: 1px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--paper); border: 2px solid var(--ink);
  transition: transform .18s cubic-bezier(.3,1.4,.5,1);
}
.toggle[aria-pressed="true"] .dot{ background: var(--grass); }
.toggle[aria-pressed="true"] .dot::after{ transform: translateX(12px); }
.toggle:focus-visible{ outline: 4px dashed var(--grape); outline-offset: 3px; }

/* ── Spelskärmens topprad ───────────────── */
.hud{
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 10px;
  margin-bottom: clamp(10px, 2.5vw, 16px);
}
.icon-btn{
  width: 46px; height: 46px; padding: 0;
  display: grid; place-items: center;
  border-radius: 16px; background: var(--paper);
  border: var(--stroke); box-shadow: var(--lift-sm);
  cursor: pointer; touch-action: manipulation;
  transition: transform .09s ease, box-shadow .09s ease;
}
.icon-btn:active{ transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
.icon-btn:focus-visible{ outline: 4px dashed var(--grape); outline-offset: 3px; }
.icon-btn svg{ width: 26px; height: 26px; }

.progress{ display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
.progress .pip{
  width: 15px; height: 15px; border-radius: 50%;
  background: rgba(255,253,247,.6);
  border: 2.5px solid var(--ink);
  transition: background-color .25s ease, transform .25s cubic-bezier(.3,1.5,.5,1);
}
.progress .pip.done{ background: var(--grass); }
.progress .pip.miss{ background: var(--sun); }
.progress .pip.now{ background: var(--sun); transform: scale(1.35); }

.coins{
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--paper); border: var(--stroke); border-radius: 999px;
  padding: 6px 14px 6px 8px; box-shadow: var(--lift-sm);
  font-family: "Lilita One", system-ui, sans-serif;
  font-size: 1.25rem; font-variant-numeric: tabular-nums;
  line-height: 1;
}
.coins svg{ width: 24px; height: 24px; flex: none; }
.coins.pop{ animation: coin-pop .42s cubic-bezier(.3,1.6,.5,1); }
@keyframes coin-pop{ 0%{ transform: scale(1); } 40%{ transform: scale(1.22) rotate(-3deg); } 100%{ transform: scale(1); } }

/* ── Scenen: kompis + fråga ─────────────── */
.play-area{
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: clamp(6px, 2vw, 14px);
}
.stage{
  display: grid;
  grid-template-columns: minmax(72px, 22%) 1fr;
  align-items: center;
  gap: clamp(6px, 1.6vw, 14px);
}
.buddy{ position: relative; }
.buddy svg{ width: 100%; height: auto; display: block; filter: drop-shadow(0 8px 6px rgba(46,26,102,.22)); }
.buddy.bob svg{ animation: bob 2.6s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform: translateY(0) rotate(-1deg); } 50%{ transform: translateY(-8px) rotate(1deg); } }
.buddy.cheer svg{ animation: cheer .62s cubic-bezier(.25,1.4,.4,1) 2; }
@keyframes cheer{ 0%{ transform: translateY(0) scale(1); } 30%{ transform: translateY(-26px) scale(1.07); } 60%{ transform: translateY(0) scale(.96); } 100%{ transform: translateY(0) scale(1); } }
.buddy.oops svg{ animation: oops .5s ease-in-out; }
@keyframes oops{ 0%,100%{ transform: translateX(0) rotate(0); } 25%{ transform: translateX(-7px) rotate(-4deg); } 75%{ transform: translateX(7px) rotate(4deg); } }

.question-card{
  position: relative;
  background: var(--paper);
  border: var(--stroke);
  border-radius: 26px;
  box-shadow: var(--lift);
  padding: clamp(12px, 3vw, 20px);
  text-align: center;
}
/* Pratbubblans spets mot kompisen */
.question-card::before,
.question-card::after{
  content: ""; position: absolute; left: -17px; top: 50%;
  transform: translateY(-50%);
  border: 17px solid transparent;
  border-right-color: var(--ink);
}
.question-card::after{ left: -11px; border-right-color: var(--paper); }

.q-label{ font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; font-size: var(--t-md); color: var(--ink-2); margin-bottom: 6px; }
.q-equation{
  font-family: "Lilita One", system-ui, sans-serif;
  font-size: clamp(1.9rem, 8.4vw, 4rem);
  white-space: nowrap;
  max-width: 100%;
  line-height: 1.05;
  letter-spacing: .02em;
  font-variant-numeric: tabular-nums;
}
.q-equation .op{ color: var(--grape); padding: 0 .08em; }
.q-equation .slot{ color: var(--melon); }
.q-visual{ display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; margin: 6px 0 10px; }
.q-visual .grp{ display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; max-width: 42%; }
/* Fem i rad gör talet lätt att se utan att räkna om från början */
.q-visual .grp.five{ display: grid; grid-template-columns: repeat(5, auto); justify-items: center; max-width: 100%; }
.q-visual .plus{ font-family: "Lilita One", system-ui, sans-serif; font-size: 1.9rem; color: var(--grape); }
.q-visual svg{ width: clamp(30px, 8.5vw, 46px); height: auto; }
.q-visual.dense svg{ width: clamp(22px, 5.6vw, 32px); }
.q-visual.packed svg{ width: clamp(18px, 4.4vw, 25px); }
.q-visual .gone{ opacity: .28; }
.q-visual .grp > span{ display: inline-flex; animation: pip-in .3s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes pip-in{ from{ transform: scale(0) rotate(-25deg); } to{ transform: none; } }

.speak-btn{
  margin-top: 8px;
  display: inline-flex; align-items: center; gap: 7px;
  font-size: var(--t-sm); padding: 7px 15px; border-radius: 999px;
  background: var(--sky-hi);
}
.speak-btn svg{ width: 18px; height: 18px; }

/* ── Svarsytor ──────────────────────────── */
.answer-area{ margin-bottom: 0; }
.options{ display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(8px, 2.2vw, 14px); }
.options.three{ grid-template-columns: repeat(3, 1fr); }
.opt{
  font-family: "Lilita One", system-ui, sans-serif;
  font-size: clamp(2rem, 8vw, 3rem);
  padding: clamp(12px, 3.5vw, 22px) 8px;
  border-radius: 24px;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.opt.c0{ background: var(--sky); }
.opt.c1{ background: var(--sun); }
.opt.c2{ background: var(--bubble); }
.opt.c3{ background: #8FE07E; }
.opt.right{ background: var(--grass) !important; color: #fff; animation: right-pop .5s cubic-bezier(.3,1.6,.5,1); }
.opt.wrong{ background: #C9BEE6 !important; color: rgba(46,26,102,.45); box-shadow: 0 0 0 var(--ink); transform: translateY(6px); }
@keyframes right-pop{ 0%{ transform: scale(1); } 45%{ transform: scale(1.14); } 100%{ transform: scale(1); } }

/* Skriv-läge */
.typed{ display: grid; gap: 10px; }
.answer-display{
  background: var(--paper); border: var(--stroke); border-radius: 22px;
  box-shadow: var(--lift-sm);
  min-height: 76px;
  display: grid; place-items: center;
  font-family: "Lilita One", system-ui, sans-serif;
  font-size: clamp(2.4rem, 10vw, 3.4rem);
  font-variant-numeric: tabular-nums;
  letter-spacing: .06em;
  color: var(--ink);
}
.answer-display.empty{ color: rgba(46,26,102,.24); }
.answer-display.right{ background: var(--grass); color: #fff; animation: right-pop .5s cubic-bezier(.3,1.6,.5,1); }
.answer-display.wrong{ background: var(--melon); color: #fff; animation: oops .5s ease-in-out; }
.keypad{ display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(7px, 2vw, 11px); }
.key{
  font-family: "Lilita One", system-ui, sans-serif;
  font-size: clamp(1.7rem, 6.5vw, 2.4rem);
  padding: clamp(9px, 2.6vw, 16px) 0;
  border-radius: 20px;
  background: var(--paper);
  line-height: 1;
}
.key.num{ background: var(--sky-hi); }
.key.del{ background: var(--melon); color: #fff; }
.key.ok{ background: var(--grass); color: #fff; }
.key svg{ width: 30px; height: 30px; }

/* ── Återkoppling ───────────────────────── */
.feedback{
  min-height: 54px;
  display: grid; place-items: center;
  text-align: center;
}
.feedback .bubble{
  font-family: "Baloo 2", system-ui, sans-serif;
  font-weight: 800; font-size: var(--t-lg);
  max-width: min(100%, 22ch);
  text-wrap: balance;
  padding: 8px 22px; border-radius: 999px;
  border: var(--stroke); box-shadow: var(--lift-sm);
  animation: fb-in .4s cubic-bezier(.25,1.5,.5,1) both;
}
.feedback .bubble.good{ background: var(--grass); color: #fff; }
.feedback .bubble.soft{ background: var(--sun); }
@keyframes fb-in{ from{ opacity: 0; transform: translateY(12px) scale(.85); } to{ opacity: 1; transform: none; } }
.feedback .combo{ display: block; font-size: var(--t-sm); margin-top: 2px; }

/* ── Resultat ───────────────────────────── */
.result-card{ text-align: center; }
.result-card h2{ font-size: var(--t-xl); margin-bottom: 4px; }
.result-buddy{ width: min(190px, 52vw); margin: 0 auto; }
.result-buddy svg{ width: 100%; height: auto; animation: cheer .8s cubic-bezier(.25,1.4,.4,1) 3; }
.stars{ display: flex; justify-content: center; gap: 8px; margin: 12px 0 6px; }
.stars svg{ width: clamp(48px, 15vw, 72px); height: auto; }
.stars .st{ animation: star-in .55s cubic-bezier(.25,1.6,.4,1) both; }
.stars .st:nth-child(2){ animation-delay: .18s; }
.stars .st:nth-child(3){ animation-delay: .36s; }
@keyframes star-in{ from{ opacity: 0; transform: scale(0) rotate(-90deg); } to{ opacity: 1; transform: none; } }
.score-row{
  display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
  margin: 12px 0 16px;
}
.score-chip{
  background: var(--paper-2); border: var(--stroke); border-radius: 999px;
  padding: 7px 16px; font-size: var(--t-sm);
  font-variant-numeric: tabular-nums;
  box-shadow: var(--lift-sm);
}
.score-chip b{ font-family: "Lilita One", system-ui, sans-serif; font-size: 1.25rem; }
.result-actions{ display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.result-actions .btn.again{ background: var(--sun); }
.result-actions .btn.home{ background: var(--sky-hi); }
.new-best{
  display: inline-block; background: var(--bubble); color: #fff;
  border: var(--stroke); border-radius: 999px; padding: 5px 16px;
  font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800;
  box-shadow: var(--lift-sm);
  animation: play-pulse 1.1s ease-in-out infinite;
}

/* Konfetti-lager */
#fx{ position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

.footnote{
  text-align: center; font-size: var(--t-xs);
  color: rgba(46,26,102,.62);
  margin-top: 6px;
}

/* ── Låga skärmar: allt ska rymmas utan att man scrollar ── */
@media (max-height: 740px){
  #app{ padding-top: 10px; padding-bottom: 14px; }
  .play-area{ gap: 8px; }
  .question-card{ padding: 10px 12px; }
  .q-label{ font-size: var(--t-sm); margin-bottom: 2px; }
  .q-visual{ margin: 2px 0 6px; gap: 5px; }
  .q-visual svg{ width: clamp(24px, 7vw, 34px); }
  .q-visual.dense svg{ width: clamp(20px, 5vw, 27px); }
  .q-visual.packed svg{ width: clamp(16px, 4vw, 22px); }
  .speak-btn{ padding: 5px 13px; font-size: var(--t-xs); margin-top: 5px; }
  .feedback{ min-height: 38px; }
  .feedback .bubble{ font-size: var(--t-md); padding: 5px 16px; }
  .answer-display{ min-height: 56px; font-size: clamp(1.9rem, 7.5vw, 2.6rem); }
  .keypad{ gap: 6px; }
  .key{ padding: 7px 0; font-size: clamp(1.35rem, 5.4vw, 1.9rem); border-radius: 16px; }
  .key svg{ width: 24px; height: 24px; }
  .opt{ padding: clamp(8px, 2.4vw, 15px) 8px; font-size: clamp(1.7rem, 7vw, 2.6rem); border-radius: 20px; }
  .options{ gap: 8px; }
}

/* ── Mindre skärmar ─────────────────────── */
@media (max-width: 400px){
  .stage{ grid-template-columns: minmax(70px, 26%) 1fr; }
  .question-card::before, .question-card::after{ top: 34px; }
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>

<div class="world" aria-hidden="true">
  <div class="hill a"></div>
  <div class="hill b"></div>
  <div class="hill c"></div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

<main id="app">

  <!-- ── STARTSKÄRM ─────────────────────── -->
  <section id="screen-start" class="screen is-active">
    <header class="brand">
      <h1>Räknelandet</h1>
      <p class="tagline">Mattespel för små räknare</p>
    </header>

    <div class="panel">
      <h2 class="panel-title"><span class="step">1</span> Välj kompis</h2>
      <div class="pick-grid char-grid" id="charGrid" role="group" aria-label="Välj kompis"></div>
    </div>

    <div class="panel">
      <h2 class="panel-title"><span class="step">2</span> Välj nivå</h2>
      <div class="pick-grid level-grid" id="levelGrid" role="group" aria-label="Välj nivå"></div>
    </div>

    <div class="panel">
      <h2 class="panel-title"><span class="step">3</span> Välj spelsätt</h2>

    </div>

    <button class="btn btn-play" id="playBtn" type="button">Spela!</button>

    <div class="settings">
      <button class="toggle" id="tglSound" type="button" aria-pressed="true"><span class="dot"></span> Ljud</button>
      <button class="toggle" id="tglVoice" type="button" aria-pressed="true"><span class="dot"></span> Läs upp frågan</button>
      <button class="toggle" id="tglDots" type="button" aria-pressed="true"><span class="dot"></span> Visa prickar</button>
    </div>
    <p class="footnote">Tips för vuxna: prickarna visar talet som saker att räkna – stäng av dem när det börjar sitta i huvudet.</p>
  </section>

  <!-- ── SPELSKÄRM ──────────────────────── -->
  <section id="screen-game" class="screen">
    <div class="hud">
      <button class="icon-btn" id="homeBtn" type="button" aria-label="Tillbaka till start">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2E1A66" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/></svg>
      </button>
      <div class="progress" id="progress" aria-label="Uppgifter klara"></div>
      <div class="coins" id="coinBox">
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#FFC42E" stroke="#2E1A66" stroke-width="3"/><circle cx="20" cy="20" r="11" fill="none" stroke="#E29A00" stroke-width="2.5"/><path d="M20 12v16M16.5 15.5h5.5a2.6 2.6 0 0 1 0 5.2h-4a2.6 2.6 0 0 0 0 5.2H24" fill="none" stroke="#2E1A66" stroke-width="2.6" stroke-linecap="round"/></svg>
        <span id="coinCount">0</span>
      </div>
    </div>

    <div class="play-area">
    <div class="stage">
      <div class="buddy bob" id="buddy" aria-hidden="true"></div>
      <div class="question-card">
        <p class="q-label" id="qLabel">Hur många?</p>
        <div class="q-visual" id="qVisual" aria-hidden="true"></div>
        <p class="q-equation" id="qEquation"></p>
        <button class="btn speak-btn" id="speakBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="#2E1A66" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" fill="#2E1A66"/><path d="M16 9.2a4 4 0 0 1 0 5.6"/><path d="M18.6 6.4a8 8 0 0 1 0 11.2"/></svg>
          Hör frågan
        </button>
      </div>
    </div>

      <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
      <div class="answer-area" id="answerArea"></div>
    </div>
  </section>

  <!-- ── RESULTAT ───────────────────────── -->
  <section id="screen-result" class="screen">
    <div class="panel result-card">
      <div class="result-buddy" id="resultBuddy" aria-hidden="true"></div>
      <h2 id="resultTitle">Bra jobbat!</h2>
      <p id="resultSub" style="margin:6px 0 0;font-size:var(--t-sm)"></p>
      <div class="stars" id="resultStars" aria-hidden="true"></div>
      <div class="score-row" id="resultScore"></div>
      <div class="result-actions">
        <button class="btn again" id="againBtn" type="button">Spela igen</button>
        <button class="btn home" id="backBtn" type="button">Byt nivå</button>
      </div>
    </div>
  </section>

</main>

<script>
(function(){
"use strict";

/* ═══════════════════════════════════════════
   Småverktyg
   ═══════════════════════════════════════════ */
const $  = (sel) => document.querySelector(sel);
const el = (id) => document.getElementById(id);
const rnd  = (n) => Math.floor(Math.random() * n);
const pick = (arr) => arr[rnd(arr.length)];
const INK = "#2E1A66";

function store(key, val){
  try{
    if(val === undefined) { const v = localStorage.getItem("rakn." + key); return v === null ? null : JSON.parse(v); }
    localStorage.setItem("rakn." + key, JSON.stringify(val));
  }catch(e){ /* privat läge – spelet funkar ändå */ }
  return null;
}

/* ═══════════════════════════════════════════
   Ansikten — samma ögon och mun till alla,
   så varje figur kan bli glad, pigg eller ledsen
   ═══════════════════════════════════════════ */
function eyes(mood, x, y, r, spread){
  const L = x - spread, R = x + spread;
  if(mood === "happy"){
    return [L, R].map(cx =>
      `<path d="M${cx - r - 2} ${y + 3} Q${cx} ${y - r - 5} ${cx + r + 2} ${y + 3}" fill="none" stroke="${INK}" stroke-width="${r * 0.55}" stroke-linecap="round"/>`
    ).join("");
  }
  const dy = mood === "sad" ? r * 0.42 : 0;
  const brow = mood === "sad"
    ? [L, R].map((cx, i) =>
        `<path d="M${cx - r} ${y - r * 1.5 + (i ? -3 : 3)} L${cx + r} ${y - r * 1.5 + (i ? 3 : -3)}" stroke="${INK}" stroke-width="${r * 0.45}" stroke-linecap="round"/>`
      ).join("")
    : "";
  return [L, R].map(cx =>
    `<ellipse cx="${cx}" cy="${y}" rx="${r}" ry="${r * 1.14}" fill="#FFFDF7" stroke="${INK}" stroke-width="3.4"/>` +
    `<circle cx="${cx}" cy="${y + dy}" r="${r * 0.5}" fill="${INK}"/>` +
    `<circle cx="${cx + r * 0.22}" cy="${y + dy - r * 0.2}" r="${r * 0.17}" fill="#FFFDF7"/>`
  ).join("") + brow;
}

function mouth(mood, x, y, s){
  let d;
  if(mood === "happy"){
    d = `<path d="M-21 -4 Q0 26 21 -4 Q0 4 -21 -4 Z" fill="${INK}"/>` +
        `<path d="M-9 11 Q0 23 9 11 Q0 8 -9 11 Z" fill="#FF6B6B"/>`;
  }else if(mood === "sad"){
    d = `<path d="M-13 8 Q0 -4 13 8" fill="none" stroke="${INK}" stroke-width="4.6" stroke-linecap="round"/>`;
  }else{
    d = `<path d="M-13 -2 Q0 12 13 -2" fill="none" stroke="${INK}" stroke-width="4.6" stroke-linecap="round"/>`;
  }
  return `<g transform="translate(${x} ${y}) scale(${s})">${d}</g>`;
}

/* ═══════════════════════════════════════════
   Kompisarna — egna figurer, ritade i SVG
   ═══════════════════════════════════════════ */
const CHARACTERS = [
  {
    id: "bloppy", name: "Bloppy", tint: "#62CDF2",
    draw(m){ return `
      <path d="M148 150 q34 -6 30 -38" fill="none" stroke="${INK}" stroke-width="16" stroke-linecap="round"/>
      <path d="M148 150 q34 -6 30 -38" fill="none" stroke="#62CDF2" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="100" cy="168" rx="46" ry="36" fill="#62CDF2" stroke="${INK}" stroke-width="5"/>
      <ellipse cx="100" cy="178" rx="27" ry="24" fill="#FFFDF7" stroke="${INK}" stroke-width="4"/>
      <ellipse cx="52" cy="72" rx="17" ry="30" transform="rotate(-18 52 72)" fill="#2FA9D8" stroke="${INK}" stroke-width="5"/>
      <ellipse cx="148" cy="72" rx="17" ry="30" transform="rotate(18 148 72)" fill="#2FA9D8" stroke="${INK}" stroke-width="5"/>
      <circle cx="100" cy="84" r="54" fill="#62CDF2" stroke="${INK}" stroke-width="5"/>
      <path d="M70 44 q16 -12 30 -2" fill="none" stroke="#2FA9D8" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="100" cy="110" rx="35" ry="26" fill="#FFFDF7" stroke="${INK}" stroke-width="4.5"/>
      ${eyes(m, 100, 66, 12, 21)}
      <ellipse cx="100" cy="98" rx="10" ry="7.5" fill="${INK}"/>
      ${mouth(m, 100, 118, 0.8)}`;
    }
  },
  {
    id: "zippy", name: "Zippy", tint: "#FFC42E",
    draw(m){ return `
      <path d="M100 26 v14" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>
      <circle cx="100" cy="22" r="9" fill="#FF6B6B" stroke="${INK}" stroke-width="4.5"/>
      <ellipse cx="62" cy="182" rx="17" ry="11" fill="#2E1A66"/>
      <ellipse cx="138" cy="182" rx="17" ry="11" fill="#2E1A66"/>
      <circle cx="100" cy="112" r="64" fill="#FFC42E" stroke="${INK}" stroke-width="5"/>
      <path d="M36 106 a64 64 0 0 1 128 0 z" fill="#57C96B" stroke="${INK}" stroke-width="5"/>
      <path d="M36 106 h128" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="30" cy="132" rx="11" ry="17" fill="#FFC42E" stroke="${INK}" stroke-width="4.5"/>
      <ellipse cx="170" cy="132" rx="11" ry="17" fill="#FFC42E" stroke="${INK}" stroke-width="4.5"/>
      <path d="M74 128 h52" stroke="${INK}" stroke-width="5"/>
      <circle cx="74" cy="128" r="25" fill="rgba(255,255,255,.55)" stroke="${INK}" stroke-width="5"/>
      <circle cx="126" cy="128" r="25" fill="rgba(255,255,255,.55)" stroke="${INK}" stroke-width="5"/>
      ${eyes(m, 100, 128, 12, 26)}
      ${mouth(m, 100, 162, 0.72)}`;
    }
  },
  {
    id: "toffe", name: "Toffe", tint: "#FF6B6B",
    draw(m){ return `
      <rect x="62" y="96" width="76" height="88" rx="26" fill="#FFF1D2" stroke="${INK}" stroke-width="5"/>
      <ellipse cx="46" cy="140" rx="12" ry="15" fill="#FFF1D2" stroke="${INK}" stroke-width="4.5"/>
      <ellipse cx="154" cy="140" rx="12" ry="15" fill="#FFF1D2" stroke="${INK}" stroke-width="4.5"/>
      <path d="M18 106 a82 66 0 0 1 164 0 q-82 16 -164 0 z" fill="#FF6B6B" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="58" cy="72" r="14" fill="#FFFDF7"/>
      <circle cx="112" cy="56" r="17" fill="#FFFDF7"/>
      <circle cx="152" cy="86" r="11" fill="#FFFDF7"/>
      ${eyes(m, 100, 128, 11, 20)}
      ${mouth(m, 100, 154, 0.66)}`;
    }
  },
  {
    id: "stella", name: "Stella", tint: "#FF8AD0",
    draw(m){ return `
      <circle cx="46" cy="86" r="22" fill="#FF6B6B" stroke="${INK}" stroke-width="4.5"/>
      <circle cx="36" cy="122" r="20" fill="#FFC42E" stroke="${INK}" stroke-width="4.5"/>
      <circle cx="46" cy="156" r="18" fill="#57C96B" stroke="${INK}" stroke-width="4.5"/>
      <circle cx="64" cy="52" r="18" fill="#62CDF2" stroke="${INK}" stroke-width="4.5"/>
      <path d="M118 26 L104 62 L136 58 Z" fill="#FFC42E" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
      <path d="M70 44 L60 66 L84 62 Z" fill="#FF8AD0" stroke="${INK}" stroke-width="4.5" stroke-linejoin="round"/>
      <ellipse cx="106" cy="112" rx="58" ry="52" fill="#FFC9E6" stroke="${INK}" stroke-width="5"/>
      <ellipse cx="118" cy="140" rx="34" ry="25" fill="#FFE7F3" stroke="${INK}" stroke-width="4"/>
      <circle cx="106" cy="138" r="4" fill="${INK}"/>
      <circle cx="130" cy="138" r="4" fill="${INK}"/>
      ${eyes(m, 104, 100, 12, 23)}
      ${mouth(m, 118, 152, 0.6)}`;
    }
  },
  {
    id: "bip", name: "Bip", tint: "#4ED8C8",
    draw(m){ return `
      <path d="M100 22 v18" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>
      <circle cx="100" cy="18" r="10" fill="#FFC42E" stroke="${INK}" stroke-width="4.5"/>
      <rect x="66" y="150" width="68" height="42" rx="16" fill="#9061F9" stroke="${INK}" stroke-width="5"/>
      <circle cx="86" cy="172" r="7" fill="#FFC42E" stroke="${INK}" stroke-width="3"/>
      <circle cx="114" cy="172" r="7" fill="#FF6B6B" stroke="${INK}" stroke-width="3"/>
      <rect x="30" y="118" width="16" height="26" rx="7" fill="#9061F9" stroke="${INK}" stroke-width="4.5"/>
      <rect x="154" y="118" width="16" height="26" rx="7" fill="#9061F9" stroke="${INK}" stroke-width="4.5"/>
      <rect x="42" y="44" width="116" height="110" rx="30" fill="#4ED8C8" stroke="${INK}" stroke-width="5"/>
      <rect x="58" y="60" width="84" height="20" rx="10" fill="#2FA9D8" stroke="${INK}" stroke-width="4"/>
      ${eyes(m, 100, 108, 13, 24)}
      ${mouth(m, 100, 138, 0.72)}`;
    }
  },
  {
    id: "mans", name: "Måns", tint: "#FF9E4A",
    draw(m){ return `
      <ellipse cx="100" cy="176" rx="42" ry="30" fill="#FF9E4A" stroke="${INK}" stroke-width="5"/>
      <path d="M56 62 L50 20 L88 42 Z" fill="#FF9E4A" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
      <path d="M144 62 L150 20 L112 42 Z" fill="#FF9E4A" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="100" cy="98" r="58" fill="#FF9E4A" stroke="${INK}" stroke-width="5"/>
      <path d="M76 52 q10 -9 20 -2M104 50 q10 -9 20 -2" fill="none" stroke="#E2762A" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="84" cy="126" rx="20" ry="15" fill="#FFF1D2" stroke="${INK}" stroke-width="3.5"/>
      <ellipse cx="116" cy="126" rx="20" ry="15" fill="#FFF1D2" stroke="${INK}" stroke-width="3.5"/>
      <path d="M92 114 h16 l-8 9 z" fill="#FF6B6B" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
      <path d="M40 116 h22M40 130 h22M138 116 h22M138 130 h22" stroke="${INK}" stroke-width="3.4" stroke-linecap="round"/>
      ${eyes(m, 100, 88, 12, 22)}
      ${mouth(m, 100, 128, 0.62)}`;
    }

];

function charSVG(id, mood){
  const c = CHARACTERS.find(x => x.id === id) || CHARACTERS[0];
  return `<svg viewBox="0 0 200 208" xmlns="http://www.w3.org/2000/svg" stroke-linejoin="round">${c.draw(mood || "idle")}</svg>`;
}

/* ═══════════════════════════════════════════
   Saker att räkna
   ═══════════════════════════════════════════ */
const THINGS = {
  apple: `<svg viewBox="0 0 40 40"><path d="M20 10c-9-6-18 1-15 12 2 8 9 15 15 15s13-7 15-15c3-11-6-18-15-12z" fill="#FF6B6B" stroke="${INK}" stroke-width="3"/><path d="M20 11V4" stroke="#3E9E51" stroke-width="3.4" stroke-linecap="round"/><path d="M21 7c4-5 9-4 9-4s-1 6-7 6" fill="#57C96B" stroke="${INK}" stroke-width="2.4"/></svg>`,
  ball:  `<svg viewBox="0 0 40 40"><circle cx="20" cy="21" r="15" fill="#62CDF2" stroke="${INK}" stroke-width="3"/><path d="M6 17c9 4 19 4 28 0M20 6c-5 9-5 21 0 30" fill="none" stroke="${INK}" stroke-width="2.6"/></svg>`,
  star:  `<svg viewBox="0 0 40 40"><path d="M20 4l4.8 10.2 11 1.4-8.1 7.6 2.1 11-9.8-5.5-9.8 5.5 2.1-11L4.2 15.6l11-1.4z" fill="#FFC42E" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/></svg>`,
  fish:  `<svg viewBox="0 0 40 40"><path d="M25 20c0 6-6 11-12 11S3 26 3 20 7 9 13 9s12 5 12 11z" fill="#FF8AD0" stroke="${INK}" stroke-width="3"/><path d="M25 20l12-8v16z" fill="#FF8AD0" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><circle cx="11" cy="17" r="2.4" fill="${INK}"/></svg>`,
  flower:`<svg viewBox="0 0 40 40"><g stroke="${INK}" stroke-width="3"><circle cx="20" cy="10" r="7" fill="#9061F9"/><circle cx="30" cy="20" r="7" fill="#9061F9"/><circle cx="20" cy="30" r="7" fill="#9061F9"/><circle cx="10" cy="20" r="7" fill="#9061F9"/><circle cx="20" cy="20" r="6" fill="#FFC42E"/></g></svg>`,
  frog:  `<svg viewBox="0 0 40 40"><circle cx="20" cy="24" r="14" fill="#57C96B" stroke="${INK}" stroke-width="3"/><circle cx="12" cy="11" r="7" fill="#57C96B" stroke="${INK}" stroke-width="3"/><circle cx="28" cy="11" r="7" fill="#57C96B" stroke="${INK}" stroke-width="3"/><circle cx="12" cy="11" r="2.6" fill="${INK}"/><circle cx="28" cy="11" r="2.6" fill="${INK}"/><path d="M13 26q7 6 14 0" fill="none" stroke="${INK}" stroke-width="2.8" stroke-linecap="round"/></svg>`
};
const THING_KEYS = Object.keys(THINGS);

const STAR_ON  = `<svg class="st" viewBox="0 0 40 40"><path d="M20 3l5.2 11 12.1 1.6-8.9 8.3 2.3 12-10.7-6-10.7 6 2.3-12-8.9-8.3L14.8 14z" fill="#FFC42E" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/></svg>`;
const STAR_OFF = `<svg class="st" viewBox="0 0 40 40"><path d="M20 3l5.2 11 12.1 1.6-8.9 8.3 2.3 12-10.7-6-10.7 6 2.3-12-8.9-8.3L14.8 14z" fill="#EDE6FA" stroke="#B9A9DD" stroke-width="3" stroke-linejoin="round"/></svg>`;

/* ═══════════════════════════════════════════
   Nivåer
   ═══════════════════════════════════════════ */
function ri(min, max){ return min + rnd(max - min + 1); }

const LEVELS = [
  { id:1, name:"Räkna saker",  desc:"Hur många ser du? 1–10",     color:"#57C96B", options:3,
    make(){ const n = ri(1, 10); return { kind:"count", answer:n, count:n }; } },

  { id:2, name:"Plus till 5",  desc:"1 + 2 · 3 + 1 · 2 + 2",      color:"#62CDF2", options:3,
    make(){ const a = ri(1, 4), b = ri(1, 5 - a); return { kind:"add", a, b, answer:a + b }; } },

  { id:3, name:"Plus till 10", desc:"4 + 5 · 6 + 3 · 7 + 2",      color:"#FFC42E", options:4,
    make(){ const a = ri(1, 8), b = ri(1, 10 - a); return { kind:"add", a, b, answer:a + b }; } },

  { id:4, name:"Plus och minus till 10", desc:"5 + 4 · 9 − 3 · 8 − 6", color:"#FF8AD0", options:4,
    make(){
      if(rnd(2)){ const a = ri(1, 9), b = ri(1, 10 - a); return { kind:"add", a, b, answer:a + b }; }
      const a = ri(3, 10), b = ri(1, a - 1); return { kind:"sub", a, b, answer:a - b };
    } },

  { id:5, name:"Plus och minus till 20", desc:"12 + 6 · 17 − 8 · 4 + ? = 9", color:"#9061F9", options:4,
    make(){
      const r = rnd(10);
      if(r < 4){ const a = ri(2, 17), b = ri(1, 20 - a); return { kind:"add", a, b, answer:a + b }; }
      if(r < 8){ const a = ri(5, 20), b = ri(1, a - 1); return { kind:"sub", a, b, answer:a - b }; }
      const answer = ri(1, 9), a = ri(1, 9); return { kind:"missing", a, b:answer, answer, sum:a + answer };
    } }

   Ljud — allt görs i webbläsaren, inga filer

const SFX = {
  ctx: null,
  ensure(){
    if(!state.sound) return null;
    try{
      if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if(this.ctx.state === "suspended") this.ctx.resume();
      return this.ctx;
    }catch(e){ return null; }
  },
  tone(freq, at, dur, type, vol){
    const c = this.ensure(); if(!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "triangle";
    o.frequency.setValueAtTime(freq, c.currentTime + at);
    g.gain.setValueAtTime(0.0001, c.currentTime + at);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, c.currentTime + at + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + at + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + at); o.stop(c.currentTime + at + dur + 0.05);
  },
  tap(){ this.tone(520, 0, 0.07, "square", 0.09); },
  correct(){ [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, i * 0.075, 0.22, "triangle", 0.16)); },
  coin(){ this.tone(987.77, 0, 0.07, "square", 0.12); this.tone(1318.5, 0.07, 0.2, "square", 0.12); },
  wrong(){ this.tone(311.13, 0, 0.14, "sine", 0.14); this.tone(261.63, 0.13, 0.22, "sine", 0.13); },
  win(){ [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5].forEach((f, i) => this.tone(f, i * 0.13, 0.3, "triangle", 0.17)); }
};

/* Uppläsning på svenska */
let svVoice = null;
function findVoice(){
  try{
    const vs = speechSynthesis.getVoices() || [];
    svVoice = vs.find(v => /^sv/i.test(v.lang)) || null;
  }catch(e){}
}
if(window.speechSynthesis){
  findVoice();
  speechSynthesis.addEventListener && speechSynthesis.addEventListener("voiceschanged", findVoice);
}
function speak(text){
  if(!state.voice || !window.speechSynthesis || !text) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "sv-SE";
    if(svVoice) u.voice = svVoice;
    u.rate = 0.92; u.pitch = 1.15;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ═══════════════════════════════════════════
   Konfetti
   ═══════════════════════════════════════════ */
const CONFETTI_COLORS = ["#FFC42E", "#FF6B6B", "#62CDF2", "#57C96B", "#FF8AD0", "#9061F9"];
const fx = el("fx");
const fxCtx = fx.getContext("2d");
let bits = [], fxRunning = false;
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function sizeCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  fx.width = innerWidth * dpr; fx.height = innerHeight * dpr;
  fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeCanvas();
addEventListener("resize", sizeCanvas);

function confetti(x, y, amount){
  if(reduceMotion) return;
  for(let i = 0; i < (amount || 40); i++){
    bits.push({
      x, y,
      vx: (Math.random() - 0.5) * 9,
      vy: -Math.random() * 13 - 4,
      w: 7 + Math.random() * 8,
      h: 9 + Math.random() * 10,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.4,
      col: pick(CONFETTI_COLORS),
      life: 1
    });
  }
  if(!fxRunning){ fxRunning = true; requestAnimationFrame(stepFx); }
}

function stepFx(){
  fxCtx.clearRect(0, 0, innerWidth, innerHeight);
  bits = bits.filter(b => b.life > 0 && b.y < innerHeight + 60);
  bits.forEach(b => {
    b.vy += 0.42; b.x += b.vx; b.y += b.vy; b.rot += b.vr; b.vx *= 0.992;
    if(b.y > innerHeight * 0.8) b.life -= 0.02;
    fxCtx.save();
    fxCtx.translate(b.x, b.y); fxCtx.rotate(b.rot);
    fxCtx.globalAlpha = Math.max(b.life, 0);
    fxCtx.fillStyle = b.col;
    fxCtx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
    fxCtx.restore();
  });
  if(bits.length){ requestAnimationFrame(stepFx); }
  else { fxRunning = false; fxCtx.clearRect(0, 0, innerWidth, innerHeight); }
}

/* ═══════════════════════════════════════════
   Frågor
   ═══════════════════════════════════════════ */
function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function makeOptions(q, n){
  const out = [q.answer];
  const near = [];
  if(q.kind === "add") near.push(Math.abs(q.a - q.b));
  if(q.kind === "sub") near.push(q.a + q.b);
  if(q.kind === "missing") near.push(q.sum, q.a);
  near.push(q.answer + 1, q.answer - 1, q.answer + 2, q.answer - 2, q.answer + 3, q.answer - 3, q.answer + 4);
  for(const v of near){
    if(out.length >= n) break;
    if(v >= 0 && v <= 25 && out.indexOf(v) === -1) out.push(v);
  }
  let extra = q.answer + 5;
  while(out.length < n){ if(out.indexOf(extra) === -1 && extra >= 0) out.push(extra); extra++; }
  return shuffle(out);
}

function speechFor(q){
  if(q.kind === "count")   return "Hur många ser du?";
  if(q.kind === "add")     return "Vad blir " + q.a + " plus " + q.b + "?";
  if(q.kind === "sub")     return "Vad blir " + q.a + " minus " + q.b + "?";
  if(q.kind === "missing") return q.a + " plus vad blir " + q.sum + "?";
  return "";
}

function labelFor(q){
  if(q.kind === "count")   return "Hur många?";
  if(q.kind === "missing") return "Hur många fattas?";
  return "Vad blir det?";
}

function equationHTML(q){
  const op = (s) => `<span class="op">${s}</span>`;
  if(q.kind === "count")   return `<span class="slot">?</span>`;
  if(q.kind === "add")     return `${q.a} ${op("+")} ${q.b} ${op("=")} <span class="slot">?</span>`;
  if(q.kind === "sub")     return `${q.a} ${op("−")} ${q.b} ${op("=")} <span class="slot">?</span>`;
  if(q.kind === "missing") return `${q.a} ${op("+")} <span class="slot">?</span> ${op("=")} ${q.sum}`;
  return "";
}

function thingsRow(count, faded, thing){
  let html = "";
  for(let i = 0; i < count; i++){
    html += `<span class="${i >= count - faded ? "gone" : ""}" style="display:inline-flex;animation-delay:${Math.min(i * 30, 400)}ms">${THINGS[thing]}</span>`;
  }
  return html;
}

function visualHTML(q){
  const t = state.thing;
  /* Nivå 1 går ut på att räkna – sakerna syns alltid */
  if(q.kind === "count") return `<span class="grp five">${thingsRow(q.count, 0, t)}</span>`;
  if(!state.dots && !state.hint) return "";
  if(q.kind === "add"){
    if(q.a + q.b > 15) return "";
    return `<span class="grp">${thingsRow(q.a, 0, t)}</span><span class="plus">+</span><span class="grp">${thingsRow(q.b, 0, t)}</span>`;
  }
  if(q.kind === "sub"){
    if(q.a > 15) return "";
    return `<span class="grp five">${thingsRow(q.a, q.b, t)}</span>`;
  }
  if(q.kind === "missing"){
    if(q.sum > 15) return "";
    return `<span class="grp five">${thingsRow(q.sum, q.sum - q.a, t)}</span>`;
  }
  return "";
}

/* ═══════════════════════════════════════════
   Spelomgången
   ═══════════════════════════════════════════ */
const buddy = el("buddy"), qLabel = el("qLabel"), qVisual = el("qVisual"),
      qEquation = el("qEquation"), answerArea = el("answerArea"),
      feedback = el("feedback"), progress = el("progress"), coinCount = el("coinCount"),
      coinBox = el("coinBox");

const PRAISE = ["Snyggt!", "Precis!", "Toppen!", "Så bra!", "Grymt!", "Jättebra!", "Klockrent!", "Wow!"];
const NUDGE  = ["Nästan!", "Prova igen!", "Nästan där!", "Titta en gång till!"];

function setBuddy(mood, anim){
  buddy.innerHTML = charSVG(state.char, mood);
  buddy.className = "buddy " + (anim || "bob");
  if(anim && anim !== "bob"){
    setTimeout(() => { buddy.className = "buddy bob"; buddy.innerHTML = charSVG(state.char, "idle"); }, 1300);
  }
}

function renderProgress(){
  let html = "";
  for(let i = 0; i < ROUND_LEN; i++){
    const r = state.results[i];
    const cls = r === "first" ? "done" : r === "help" ? "miss" : i === state.qIndex ? "now" : "";
    html += `<span class="pip ${cls}"></span>`;
  }
  progress.innerHTML = html;
}

function bumpCoins(){
  coinCount.textContent = state.score;
  coinBox.classList.remove("pop");
  void coinBox.offsetWidth;
  coinBox.classList.add("pop");
}

function startRound(){
  state.qIndex = 0; state.score = 0; state.streak = 0; state.firstTry = 0;
  state.results = []; state.locked = false;
  coinCount.textContent = "0";
  show("game");
  nextQuestion();
}

function nextQuestion(){
  if(state.qIndex >= ROUND_LEN) return finishRound();
  state.q = levelDef().make();
  state.tries = 0; state.typed = ""; state.locked = false;
  state.hint = false;
  state.thing = pick(THING_KEYS);
  setBuddy("idle", "bob");
  feedback.innerHTML = "";
  renderProgress();
  paintQuestion();
  renderAnswerArea();
  speak(speechFor(state.q));
}

function paintQuestion(){
  const q = state.q;
  qLabel.textContent = labelFor(q);
  qVisual.innerHTML = visualHTML(q);
  const n = qVisual.querySelectorAll("svg").length;
  qVisual.className = "q-visual" + (n > 10 ? " packed" : n > 6 ? " dense" : "");
  qEquation.innerHTML = equationHTML(q);
  qEquation.style.display = q.kind === "count" ? "none" : "";
}

function renderAnswerArea(){
  const q = state.q;
  if(state.mode === "choice"){
    const n = levelDef().options;
    state.opts = makeOptions(q, n);
    answerArea.innerHTML = `<div class="options ${n === 3 ? "three" : ""}" id="optWrap">` +
      state.opts.map((v, i) => `<button type="button" class="btn opt c${i}" data-val="${v}">${v}</button>`).join("") +
      `</div>`;
  }else{
    answerArea.innerHTML = `
      <div class="typed">
        <div class="answer-display empty" id="display">?</div>
        <div class="keypad" id="keypad">
          ${[1,2,3,4,5,6,7,8,9].map(n => `<button type="button" class="btn key num" data-key="${n}">${n}</button>`).join("")}
          <button type="button" class="btn key del" data-key="del" aria-label="Sudda">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11v14H9L3 12z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg>
          </button>
          <button type="button" class="btn key num" data-key="0">0</button>
          <button type="button" class="btn key ok" data-key="ok" aria-label="Svara">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6"/></svg>
          </button>
        </div>
      </div>`;
  }
}

function updateDisplay(){
  const d = el("display"); if(!d) return;
  d.textContent = state.typed === "" ? "?" : state.typed;
  d.className = "answer-display" + (state.typed === "" ? " empty" : "");
}

/* ── Svarshantering ─────────────────────── */
function answer(value, sourceEl){
  if(state.locked) return;
  const q = state.q;
  const right = Number(value) === q.answer;
  state.tries++;

  if(right){
    state.locked = true;
    const firstTry = state.tries === 1;
    if(firstTry){ state.streak++; state.firstTry++; }
    else state.streak = 0;

    const mult = state.streak >= 6 ? 3 : state.streak >= 3 ? 2 : 1;
    const gain = firstTry ? 10 * mult : 5;
    state.score += gain;
    state.results[state.qIndex] = firstTry ? "first" : "help";

    if(sourceEl) sourceEl.classList.add("right");
    else { const d = el("display"); if(d) d.classList.add("right"); }

    SFX.correct();
    setTimeout(() => { SFX.coin(); bumpCoins(); }, 220);
    setBuddy("happy", "cheer");

    const r = buddy.getBoundingClientRect();
    confetti(r.left + r.width / 2, r.top + r.height / 2, firstTry ? 46 : 26);

    feedback.innerHTML = `<span class="bubble good">${pick(PRAISE)} +${gain}
      ${mult > 1 ? `<span class="combo">${state.streak} i rad — ×${mult} poäng!</span>` : ""}</span>`;
    if(state.streak === 3 || state.streak === 6) speak(state.streak + " rätt i rad!");

    setTimeout(() => { state.qIndex++; nextQuestion(); }, 1250);
    return;
  }

  /* Fel svar — mjukt, aldrig minuspoäng */
  SFX.wrong();
  setBuddy("sad", "oops");
  if(sourceEl){ sourceEl.classList.add("wrong"); sourceEl.disabled = true; }
  else {
    const d = el("display");
    if(d){ d.classList.add("wrong"); setTimeout(() => { state.typed = ""; updateDisplay(); }, 550); }
  }

  if(state.tries >= 3){
    state.locked = true;
    state.results[state.qIndex] = "help";
    feedback.innerHTML = `<span class="bubble soft">Svaret är ${q.answer}. Nu tar vi nästa!</span>`;
    speak("Svaret är " + q.answer);
    setTimeout(() => { state.qIndex++; nextQuestion(); }, 2100);
    return;
  }

  if(!state.hint){
    state.hint = true;
    paintQuestion();
    feedback.innerHTML = `<span class="bubble soft">Räkna sakerna!</span>`;
  }else{
    feedback.innerHTML = `<span class="bubble soft">${pick(NUDGE)}</span>`;
  }
}

/* Klick i svarsytan */
answerArea.addEventListener("click", (e) => {
  const opt = e.target.closest("[data-val]");
  if(opt){ answer(opt.dataset.val, opt); return; }
  const key = e.target.closest("[data-key]");
  if(!key) return;
  const k = key.dataset.key;
  if(k === "del"){ state.typed = state.typed.slice(0, -1); SFX.tap(); updateDisplay(); }
  else if(k === "ok"){ if(state.typed !== "") answer(state.typed, null); }
  else if(state.typed.length < 2){ state.typed += k; SFX.tap(); updateDisplay(); }
});

/* Tangentbord för den som hellre knappar */
addEventListener("keydown", (e) => {
  if(!el("screen-game").classList.contains("is-active") || state.locked) return;
  if(state.mode === "type"){
    if(/^[0-9]$/.test(e.key)){ if(state.typed.length < 2){ state.typed += e.key; SFX.tap(); updateDisplay(); } }
    else if(e.key === "Backspace"){ state.typed = state.typed.slice(0, -1); updateDisplay(); }
    else if(e.key === "Enter" && state.typed !== ""){ answer(state.typed, null); }
  }else if(/^[1-4]$/.test(e.key)){
    const btn = answerArea.querySelectorAll(".opt")[Number(e.key) - 1];
    if(btn && !btn.disabled) answer(btn.dataset.val, btn);
  }
});

/* ═══════════════════════════════════════════
   Resultat
   ═══════════════════════════════════════════ */
function finishRound(){
  const perfect = state.firstTry;
  const stars = perfect >= 9 ? 3 : perfect >= 7 ? 2 : perfect >= 4 ? 1 : 0;
  const prevBest = store(bestKey()) || 0;
  const isBest = state.score > prevBest;
  if(isBest) store(bestKey(), state.score);
  state.purse += state.score; store("purse", state.purse);

  el("resultBuddy").innerHTML = charSVG(state.char, stars ? "happy" : "idle");
  el("resultStars").innerHTML = [0, 1, 2].map(i => i < stars ? STAR_ON : STAR_OFF).join("");

  const titles = ["Bra kämpat!", "Fint jobbat!", "Superbra!", "Helt fantastiskt!"];
  el("resultTitle").textContent = titles[stars];
  el("resultSub").textContent = `${perfect} av ${ROUND_LEN} rätt direkt · ${levelDef().name}`;

  el("resultScore").innerHTML =
    `<span class="score-chip">Poäng <b>${state.score}</b></span>` +
    `<span class="score-chip">Rekord <b>${Math.max(prevBest, state.score)}</b></span>` +
    `<span class="score-chip">Skattkista <b>${state.purse}</b></span>` +
    (isBest ? `<span class="new-best">Nytt rekord!</span>` : "");

  show("result");
  SFX.win();
  if(stars){
    setTimeout(() => confetti(innerWidth * 0.3, innerHeight * 0.4, 60), 150);
    setTimeout(() => confetti(innerWidth * 0.7, innerHeight * 0.4, 60), 450);
  }
  const spoken = stars === 3 ? "Helt fantastiskt! Tre stjärnor!"
    : stars ? "Fint jobbat! Du fick " + stars + (stars === 1 ? " stjärna!" : " stjärnor!")
    : "Bra kämpat! Vi provar igen.";
  speak(spoken);
}

/* ═══════════════════════════════════════════
   Knappar
   ═══════════════════════════════════════════ */
el("playBtn").addEventListener("click", () => { SFX.ensure(); SFX.tap(); startRound(); });
el("againBtn").addEventListener("click", () => { SFX.tap(); startRound(); });
el("backBtn").addEventListener("click", () => { SFX.tap(); renderStart(); show("start"); });
el("homeBtn").addEventListener("click", () => {
  SFX.tap();
  try{ speechSynthesis.cancel(); }catch(e){}
  renderStart(); show("start");
});
el("speakBtn").addEventListener("click", () => {
  if(!state.voice){ state.voice = true; store("voice", true); el("tglVoice").setAttribute("aria-pressed", "true"); }
  speak(speechFor(state.q));
});

/* Igång! */
renderStart();
})();
</script>
</body>
</html>
