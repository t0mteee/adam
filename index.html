function slumpFast(n){ const x = Math.sin(n * 127.1 + 11.7) * 43758.5453; return x - Math.floor(x); }

/* Sprid ut landskapet i kanterna så att banorna i mitten aldrig skyms */
function landskapHTML(r, top, hojd){
  const delar = LANDSKAP[r] || [];
  let html = "";
  const antal = Math.max(6, Math.round(hojd / 78));
  for(let i = 0; i < antal; i++){
    const d = delar[i % delar.length];
    const frö = r * 100 + i;
    const vanster = i % 2 === 0;
    const x = vanster ? 4 + slumpFast(frö) * 11 : 85 + slumpFast(frö + 7) * 11;
    const y = d.top ? top + 6 + slumpFast(frö + 3) * 14
                    : top + 26 + (hojd - 60) * ((i + 0.5) / antal) + slumpFast(frö + 5) * 22 - 11;
    const skala = 0.82 + slumpFast(frö + 9) * 0.42;
    html += `<div class="deco" style="left:${x.toFixed(1)}%;top:${y.toFixed(0)}px;width:${Math.round(d.w * skala)}px${d.top ? ";transform:translate(-50%,0)" : ""}">${d.a}</div>`;
  }
  return html;
}

/* ═══════════════════════════════════════════
   Spårvagnsvärlden
   ═══════════════════════════════════════════ */
const lineByRef = (ref) => TRAM_LINES.find(l => l.ref === ref);

/* Spårvagnen kan köras på en vald bana, eller "Blandat" som drar uppgifter
   ur allt barnet har låst upp – det ger mest omväxling på en lång resa. */
function blandatLevel(p){
  const alla = LEVELS.filter(L => L.id <= p.unlocked);
  const tal = alla.filter(L => L.kinds[0] !== "count");
  const rakning = alla.filter(L => L.kinds[0] === "count");
  /* Blandat ska betyda allt barnet kan. Räkning följer med som ett inslag –
     bara den svåraste räknebanan, så det inte blir "räkna till 5" om och om. */
  const kallor = tal.length ? tal : (alla.length ? alla : [LEVELS[0]]);
  const kinds = [...new Set(kallor.flatMap(L => L.kinds))];
  const bastaRakning = rakning[rakning.length - 1];
  if(tal.length && bastaRakning) kinds.push("count");
  const max = Math.max(...kallor.map(L => L.max));
  return { id:0, name:"Blandat", desc:"Allt du kan",
           kinds, max,
           min: bastaRakning ? (bastaRakning.min || 1) : 1,
           räknaMax: bastaRakning ? bastaRakning.max : 10,
           /* Golvet följer med uppåt, så en van spelare slipper 1 + 1 */
           lo: Math.max(2, Math.floor(max * 0.45)), opts: 4 };
}
/* Stigande: spelet håller reda på var barnet ligger med ett flyttal, höjer det
   vid rätt svar och sänker det vid fel. Uppgifterna dras från nivån runt det
   talet, så svårigheten stiger av sig själv och backar tillfälligt när det
   kärvar – tills nivån sitter igen. */
const SKILL_UPP = 0.2, SKILL_HJALP = -0.15, SKILL_NED = -0.5;

function skillNu(p){
  const topp = Math.min(p.unlocked || 1, LEVELS.length);
  return Math.max(1, Math.min(topp, p.skill == null ? topp : p.skill));
}
function justeraSkill(p, utfall){
  const topp = Math.min(p.unlocked || 1, LEVELS.length);
  const steg = utfall === "ratt" ? SKILL_UPP : utfall === "hjalp" ? SKILL_HJALP : SKILL_NED;
  p.skill = Math.max(1, Math.min(topp, skillNu(p) + steg));
}
function nivaForSkill(p){
  const topp = Math.min(p.unlocked || 1, LEVELS.length);
  const s = skillNu(p);
  const r = Math.random();
  /* Mestadels den nivå barnet är på, ibland en lättare och ibland en svårare */
  let id = Math.round(s);
  if(r < 0.22) id -= 1;
  else if(r < 0.37) id += 1;
  return levelById(Math.max(1, Math.min(topp, id))) || LEVELS[0];
}

function stigandeLevel(p){
  const nu = levelById(Math.round(skillNu(p))) || LEVELS[0];
  return { id:-1, name:"Stigande", desc:"Svårare efter hand", nuvarande: nu.name,
           kinds: nu.kinds, max: nu.max, opts: 4 };
}

/* En omgång där varje uppgift kan komma från olika nivå.
   Två uppgifter i samma omgång får aldrig vara lika. Att undvika föregående
   hållplatsers tal är önskvärt men får ge vika när nivåns förråd är litet –
   annars skulle till exempel Dubbelt, som bara har tio varianter, ta slut. */
function buildStigandeRound(p, count, undvik){
  const out = [];
  const iRundan = new Set();
  const tidigare = new Set(undvik || []);
  for(let i = 0; i < count; i++){
    let vald = null, reserv = null;
    for(let t = 0; t < 40; t++){
      /* Nivån lottas om vid varje försök. Tar en lätt banas förråd slut –
         "Räkna till 5" har bara fem uppgifter – hittas en färsk på grannivån
         i stället för att samma tal kommer två gånger. */
      const L = nivaForSkill(p);
      const kandidat = MAKE[pick(L.kinds)](L);
      kandidat.opts = L.opts;
      const treIRad = out.length >= 2 && out[out.length - 1].kind === kandidat.kind
                                      && out[out.length - 2].kind === kandidat.kind;
      if(treIRad) continue;
      if(!reserv) reserv = kandidat;
      const nyckel = qNyckel(kandidat);
      if(iRundan.has(nyckel)) continue;
      if(t < 22 && tidigare.has(nyckel)) continue;
      iRundan.add(nyckel);
      vald = kandidat;
      break;
    }
    if(!vald){
      /* Sista utvägen: sök igenom alla öppnade banor efter något oanvänt,
         så att en omgång aldrig innehåller samma uppgift två gånger. */
      const topp = Math.min(p.unlocked || 1, LEVELS.length);
      for(const L2 of LEVELS.filter(x => x.id <= topp)){
        for(let t = 0; t < 12 && !vald; t++){
          const kandidat = MAKE[pick(L2.kinds)](L2);
          kandidat.opts = L2.opts;
          if(iRundan.has(qNyckel(kandidat))) continue;
          iRundan.add(qNyckel(kandidat));
          vald = kandidat;
        }
        if(vald) break;
      }
    }
    if(!vald){
      const L = nivaForSkill(p);
      vald = reserv || MAKE[pick(L.kinds)](L);
      if(!vald.opts) vald.opts = L.opts;
    }
    out.push(vald);
  }
  return out;
}

function tramLevelDef(p){
  if(p.tramLevel === -1) return stigandeLevel(p);
  return p.tramLevel === 0 ? blandatLevel(p) : (levelById(p.tramLevel) || LEVELS[0]);
}

/* Val av tal och svarssätt – samma ruta används före resan och under den */

  return `
    <p class="sheet-sub" style="margin:0 0 7px">Vilka tal vill du räkna?

    </div>
    <p class="sheet-sub" style="margin:0 0 7px">Hur vill du svara?</p>
    <div class="seg">
      <button type="button" data-trammode="choice" aria-pressed="${p.tramMode === "choice"}">Välj svar</button>
      <button type="button" data-trammode="type" aria-pressed="${p.tramMode === "type"}">Skriv svar</button>
    </div>
    ${p.unlocked < LEVELS.length ? `<p class="sheet-sub" style="margin:12px 0 0;text-align:center">
      Klara fyra av fem på ${p.tramLevel <= 0 ? (p.tramLevel === -1 ? "Stigande" : "Blandat") : "svåraste banan"} så öppnas <b>${levelById(p.unlocked + 1).name}</b>.</p>` : ""}`;
}
const tramAt    = (p, ref) => (p.tram && p.tram[ref]) || 0;
const lineDone  = (p, ref) => tramAt(p, ref) >= lineByRef(ref).stops.length - 1;

function roundel(l, cls){
  const text = ljusFarg(l.col) ? INK : "#FFFDF7";
  return `<span class="roundel ${cls || ""}" style="background:${l.col};color:${text}">${l.ref}</span>`;
}

/* ── Välj linje ─────────────────────────── */
function renderLines(){
  const p = P();
  renderHeader();
  el("lineList").innerHTML = TRAM_LINES.map(l => {
    const at = tramAt(p, l.ref), n = l.stops.length, klar = at >= n - 1;
    return `
      <button class="line-row" data-line="${l.ref}" type="button" style="--linecol:${l.col}">
        ${roundel(l)}

/* ── Resan längs linjen ─────────────────── */
let tripRef = null, tripFrom = null;
/* Kan bilderna inte hämtas alls – i en visare där bildmappen saknas – slutar vi
   be om dem. Ett enstaka misslyckande räcker inte som bevis: då kan det lika
   gärna vara en lucka i nätet, och resten av resan ska inte bli utan foton. */
let fotoMissar = 0, fotonAv = false;

/* Bilderna ligger som filer bredvid spelet. Bakas de in i stället (se
   verktyg/bygg-fristaende.py) ligger de redan i FOTO_DATA. */
function fotoSrc(foto){
  return FOTO_DATA[foto.f] || "./bilder/" + foto.f + ".jpg";
}

function openTrip(ref, animera){
  const p = P();
  tripRef = ref; p.tramLine = ref;
  if(p.tramLevel == null) p.tramLevel = -1;
  if(!p.tramMode) p.tramMode = "choice";
  if(g.recentLine !== ref){ g.recent = []; g.recentLine = ref; }
  saveProfiles();
  /* Skärmen först: show() rensar fördröjda händelser, och renderTrip lägger
     upp både fotots övergång och autoscrollen som sådana. */
  show("trip");
  renderTrip(animera);
}

/* Fotot, dess byline och kameraknappen är samma sak för den som tittar,
   så de får ändras tillsammans. */
function visaFoto(på){
  const bild = el("stopFoto"), kred = el("stopKred"),
        knapp = el("stopCard").querySelector(".foto-knapp");
  if(!bild) return;
  bild.classList.toggle("borta", !på);
  if(kred) kred.classList.toggle("borta", !på);
  if(knapp){
    knapp.classList.toggle("på", på);
    knapp.setAttribute("aria-pressed", på ? "true" : "false");
    knapp.setAttribute("aria-label", på ? "Dölj fotot på hållplatsen" : "Visa fotot på hållplatsen");
  }
}

function renderTrip(animera, visaBilden){
  const p = P(), l = lineByRef(tripRef);
  const at = tramAt(p, tripRef), n = l.stops.length, klar = at >= n - 1;
  const talnivå = tramLevelDef(p);

  el("tripHead").style.setProperty("--linecol", l.col);
  el("tripHead").innerHTML = `
    <button class="icon-btn" data-trip="back" type="button" aria-label="Tillbaka till linjerna">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2E1A66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-8 7 8 7"/></svg>
    </button>
    <span class="trip-mid">
      <span class="line-ends">mot ${l.b}</span>
      <button class="line-meta" data-trip="level" type="button" style="background:var(--paper-2);border:2px solid var(--ink);border-radius:999px;padding:2px 11px;cursor:pointer;font-family:inherit;color:inherit;white-space:nowrap">
        ${at + 1}/${n} · ${talnivå.name}${talnivå.nuvarande ? " · " + talnivå.nuvarande : ""} · byt
      </button>
      <span class="trip-bar"><span style="width:${Math.round(at / (n - 1) * 100)}%"></span></span>
    </span>
    ${roundel(l)}`;

  const foto = fotonAv ? null : STOP_PHOTOS[l.stops[at]];
  el("stopCard").innerHTML = `
    <div class="stop-card">
      <div class="scen-wrap">
        ${sceneSVG(l.stops[at])}
        ${foto ? `<img class="foto" id="stopFoto" src="${fotoSrc(foto)}" alt="Foto på hållplatsen ${l.stops[at]}">` : ""}
      </div>
      ${foto ? `<p class="foto-kred" id="stopKred">Foto: ${foto.by || "okänd"} · ${foto.lic} · Wikimedia Commons</p>` : ""}
      <div class="stop-info">
        <span style="min-width:0">
          <span class="stop-name" id="stopName">${l.stops[at]}</span><br>
          <span class="stop-sub">${at === 0 ? "Ändstation – här börjar resan" : klar ? "Ändstation – hela linjen klar!" : "Du är här"}</span>
        </span>
        <span class="stop-knappar">
        ${foto ? `<button class="icon-btn foto-knapp på" data-trip="foto" type="button" aria-label="Visa fotot på hållplatsen" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#2E1A66" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.7h3.4L8.2 6h7.6l1.8 2.7H21v9.6H3z"/><circle cx="12" cy="13.2" r="3.3"/></svg>
        </button>` : ""}
        <button class="icon-btn" data-trip="say" type="button" aria-label="Hör hållplatsen">
          <svg viewBox="0 0 24 24" fill="none" stroke="#2E1A66" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" fill="#2E1A66"/><path d="M16 9.2a4 4 0 0 1 0 5.6"/><path d="M18.6 6.4a8 8 0 0 1 0 11.2"/></svg>
        </button>
        </span>
      </div>
    </div>`;

  const visaFrån = animera && tripFrom != null ? tripFrom : at;
  el("route").style.setProperty("--linecol", l.col);
  el("route").innerHTML =
    `<div class="route-line"><div class="done-part" style="height:${visaFrån * 52}px"></div></div>` +
    l.stops.map((namn, i) => `
      <div class="stop-row ${i < visaFrån ? "done" : ""} ${i === visaFrån ? "här" : ""}" data-stop="${i}">
        <span class="stop-dot"></span>
        <span class="stop-label">${namn}${i === 0 || i === n - 1 ? '<span class="stop-tag">Ändstation</span>' : ""}</span>
      </div>`).join("") +
    `<div class="tram-marker ${animera ? "rullar" : ""}" id="tramMarker" style="top:${visaFrån * 52 + 26}px">${tramSVG(l.col, l.ref)}</div>`;

  /* Låt fotot stå kvar en stund och tona sedan över i teckningen */
  const fotoEl = el("stopFoto");
  if(fotoEl){
    fotoEl.addEventListener("error", () => {
      if(++fotoMissar >= 3) fotonAv = true;
      fotoEl.remove();
      el("stopCard").querySelectorAll(".foto-kred, .foto-knapp").forEach(x => x.remove());
    }, { once: true });
    fotoEl.addEventListener("click", () => visaFoto(fotoEl.classList.contains("borta")));
    /* Fotot får stå kvar tills man hunnit titta – sidan rullar upp först. */
    later(() => visaFoto(false), reduceMotion ? 100 : 2800);
  }
  /* Hämta nästa hållplats bild i förväg, så den är på plats vid framkomsten */
  if(!fotonAv && at + 1 < n){
    const nästaFoto = STOP_PHOTOS[l.stops[at + 1]];
    if(nästaFoto) new Image().src = fotoSrc(nästaFoto);
  }

  el("goBtn").className = "btn go-btn" + (klar ? " done" : "");
  el("goBtn").textContent = klar ? "Åk hela linjen igen!" : "Åk till " + l.stops[at + 1] + "!";

  if(animera && tripFrom != null && tripFrom !== at){
    requestAnimationFrame(() => later(() => rullaFram(at), 60));
  }else{
    tripFrom = null;
    if(visaBilden){
      /* Nyss framme: bilden på hållplatsen är belöningen, visa den */
      window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
    }else{
      const rad = el("route").querySelector(".stop-row.här");
      if(rad) later(() => rad.scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" }), 120);
    }
  }
}

/* Spårvagnen rullar fram till nästa hållplats */
function rullaFram(till){
  const l = lineByRef(tripRef), namn = l.stops[till];
  const vagn = el("tramMarker"), rader = el("route").querySelectorAll(".stop-row");
  const del = el("route").querySelector(".done-part");
  if(!vagn) return;
  SFX.tram();
  SFX.utrop();
  later(() => speakUtrop("Nästa hållplats: " + namn), 620);
  vagn.style.top = (till * 52 + 26) + "px";
  if(del) del.style.height = (till * 52) + "px";
  rader.forEach((r, i) => {
    r.classList.toggle("done", i < till);
    r.classList.toggle("här", i === till);
  });
  const rad = rader[till];
  if(rad) rad.scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" });
  later(() => {
    vagn.classList.remove("rullar");
    tripFrom = null;
    SFX.pling();
    confetti(innerWidth / 2, innerHeight * 0.4, till >= l.stops.length - 1 ? 70 : 22);
    speakUtrop(till >= l.stops.length - 1 ? "Ändstation, " + namn + ". Hela linjen klar!" : namn);
    renderTrip(false, true);
  }, reduceMotion ? 60 : 950);
}

sheet.addEventListener("click", (e) => {
  const p = P();
  const close = e.target.closest('[data-action="close"]');
  if(close){ SFX.tap(); closeSheet(); return; }

  const start = e.target.closest("[data-start]");
  if(start){
    const [id, mode] = start.dataset.start.split(":");
    SFX.ensure(); SFX.tap(); closeSheet();
    startRound(Number(id), mode);
    return;
  }

  const tgl = e.target.closest("[data-toggle]");
  if(tgl){
    const key = tgl.dataset.toggle;
    p.settings[key] = !p.settings[key];
    tgl.setAttribute("aria-pressed", String(p.settings[key]));
    saveProfiles();
    if(key === "sound" && p.settings[key]) SFX.tap();
    if(key === "voice" && p.settings[key]) speak("Nu läser jag frågorna igen!");
    return;
  }

  const rate = e.target.closest("[data-rate]");
  if(rate){
    p.settings.rate = Number(rate.dataset.rate);
    sheet.querySelectorAll("[data-rate]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.rate) === p.settings.rate)));
    saveProfiles();
    speak(`Hej ${p.name}! Så här fort pratar jag nu.`, true);
    return;
  }

  const startline = e.target.closest("[data-startline]");
  if(startline){ SFX.ensure(); SFX.tap(); closeSheet(); openTrip(startline.dataset.startline, false); return; }

  const tl = e.target.closest("[data-tramlevel]");
  if(tl){
    p.tramLevel = Number(tl.dataset.tramlevel); saveProfiles(); SFX.tap();
    speak(p.tramLevel === -1 ? "Stigande" : p.tramLevel === 0 ? "Blandat" : levelById(p.tramLevel).name);
    g.recent = [];   /* ny svårighet – börja om med färska tal */
    sheet.querySelectorAll("[data-tramlevel]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.tramlevel) === p.tramLevel)));
    if(el("screen-trip").classList.contains("is-active")) renderTrip(false);
    return;
  }
  const tm = e.target.closest("[data-trammode]");
  if(tm){
    p.tramMode = tm.dataset.trammode; saveProfiles(); SFX.tap();
    sheet.querySelectorAll("[data-trammode]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.trammode === p.tramMode)));
    return;
  }
  const ch = e.target.closest("[data-setchar]");
  if(ch){
    p.char = ch.dataset.setchar;
    sheet.querySelectorAll("[data-setchar]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.setchar === p.char)));
    saveProfiles(); renderMap(); SFX.tap();
    return;
  }

  if(e.target.closest('[data-action="foton"]')){
    SFX.tap();
    const namn = Object.keys(STOP_PHOTOS).sort();
    openSheet(`
      <div class="sheet-head">
        <div><h2>Bilderna</h2><p class="sheet-sub">${namn.length} hållplatser har ett riktigt foto som tonar över i den tecknade bilden. Övriga visar bara teckningen.</p></div>
        ${CLOSE_BTN}
      </div>
      <p class="sheet-sub" style="margin:0 0 10px">Alla foton kommer från Wikimedia Commons och används enligt sina licenser. Tack till fotograferna:</p>
      <div style="max-height:46vh;overflow-y:auto;font-size:var(--t-xs);line-height:1.5">
        ${namn.map(n => `<div style="padding:3px 0;border-bottom:1px dashed rgba(46,26,102,.14)"><b>${n}</b><br>${STOP_PHOTOS[n].by} · ${STOP_PHOTOS[n].lic}</div>`).join("")}
      </div>`);
    return;
  }
  if(e.target.closest('[data-action="switch"]')){
    SFX.tap(); closeSheet(); renderProfiles(); show("profiles"); return;
  }
  if(e.target.closest('[data-action="erase"]')){
    openSheet(`
      <div class="sheet-head"><div><h2>Ta bort ${escapeHtml(p.name)}?</h2>
      <p class="sheet-sub">Alla stjärnor, mynt och märken försvinner. Det går inte att ångra.</p></div>${CLOSE_BTN}</div>
      <div style="display:grid;gap:8px">
        <button class="btn danger" data-action="erase-yes" type="button">Ja, ta bort</button>
        <button class="btn" data-action="close" type="button" style="background:var(--paper-2)">Nej, behåll</button>
      </div>`);
    return;
  }
  if(e.target.closest('[data-action="erase-yes"]')){
    profiles = profiles.filter(x => x.id !== p.id);
    activeId = profiles.length ? profiles[0].id : null;
    saveProfiles(); closeSheet(); renderProfiles(); show("profiles");
    return;
  }
});

/* ═══════════════════════════════════════════
   Spelomgången
   ═══════════════════════════════════════════ */
const ROUND_LEN = 10;      /* Räknelandet: tio uppgifter per bana */
const TRAM_LEN  = 5;       /* Spårvagnen: fem uppgifter per hållplats */
const buddy = el("buddy"), qLabel = el("qLabel"), qVisual = el("qVisual"),
      qEquation = el("qEquation"), answerArea = el("answerArea"),
      feedback = el("feedback"), progress = el("progress"),
      coinCount = el("coinCount"), coinBox = el("coinBox");

const PRAISE = ["Snyggt!", "Precis!", "Toppen!", "Så bra!", "Grymt!", "Jättebra!", "Klockrent!", "Wow!"];
const NUDGE  = ["Nästan!", "Prova igen!", "Nästan där!", "Titta en gång till!"];

const g = {
  level: null, mode: "choice", queue: [], q: null, tram: null, len: ROUND_LEN,
  recent: [], recentLine: null,
  qIndex: 0, score: 0, streak: 0, bestStreak: 0, tries: 0, firstTry: 0,
  results: [], typed: "", locked: false, hint: false, thing: "apple", opts: []
};

function startRound(niva, mode, tramRef){
  const L = typeof niva === "object" ? niva : levelById(niva);
  g.level = L; g.mode = mode; g.tram = tramRef || null;
  g.len = g.tram ? TRAM_LEN : ROUND_LEN;
  /* På spårvagnen är varje omgång bara fem uppgifter, så vi minns de senaste
     hållplatsernas tal och undviker dem – annars känns frågorna likadana. */
  g.queue = (L.id === -1 && g.tram)
    ? buildStigandeRound(P(), g.len, new Set(g.recent))
    : buildRound(L, g.len, g.tram ? new Set(g.recent) : null);
  if(g.tram){
    g.queue.forEach(q => g.recent.push(qNyckel(q)));
    g.recent = g.recent.slice(-24);
  }
  g.qIndex = 0; g.score = 0; g.streak = 0; g.bestStreak = 0;
  g.firstTry = 0; g.results = []; g.locked = false;
  coinCount.textContent = "0";
  show("game");
  nextQuestion();
}

function nextQuestion(){
  if(g.qIndex >= g.len) return finishRound();
  g.q = g.queue[g.qIndex];
  g.tries = 0; g.typed = ""; g.locked = false; g.hint = false;
  g.thing = pick(THING_KEYS);
  setBuddy("idle", "bob");
  feedback.innerHTML = "";
  renderProgress();
  paintQuestion();
  renderAnswerArea();
  speak(speechFor(g.q));
}

function setBuddy(mood, anim){
  const p = P();
  buddy.innerHTML = charSVG(p.char, mood);
  buddy.className = "buddy " + (anim || "bob");
  if(anim && anim !== "bob"){
    later(() => { buddy.className = "buddy bob"; buddy.innerHTML = charSVG(p.char, "idle"); }, 1300);
  }
}

function renderProgress(){
  let html = "";
  for(let i = 0; i < g.len; i++){
    const r = g.results[i];
    const cls = r === "first" ? "done" : r === "help" ? "miss" : i === g.qIndex ? "now" : "";
    html += `<span class="pip ${cls}"></span>`;
  }
  progress.innerHTML = html;
}
function bumpCoins(){
  coinCount.textContent = g.score;
  coinBox.classList.remove("pop"); void coinBox.offsetWidth; coinBox.classList.add("pop");
}

/* ── Så visas frågan ────────────────────── */
function speechFor(q){
  if(q.kind === "count")   return "Hur många ser du?";
  if(q.kind === "add")     return "Vad blir " + q.a + " plus " + q.b + "?";
  if(q.kind === "sub")     return "Vad blir " + q.a + " minus " + q.b + "?";
  if(q.kind === "add3")    return "Vad blir " + q.a + " plus " + q.b + " plus " + q.c + "?";
  if(q.kind === "missing") return q.a + " plus vad blir " + q.sum + "?";
  return "";
}
function labelFor(q){
  if(q.kind === "count")   return "Hur många?";
  if(q.kind === "missing") return "Hur många fattas?";
  return "Vad blir det?";
}
function equationHTML(q){
  const op = (s) => `<span class="op">${s}</span>`;
  if(q.kind === "count")   return `<span class="slot">?</span>`;
  if(q.kind === "add")     return `${q.a} ${op("+")} ${q.b} ${op("=")} <span class="slot">?</span>`;
  if(q.kind === "sub")     return `${q.a} ${op("−")} ${q.b} ${op("=")} <span class="slot">?</span>`;
  if(q.kind === "add3")    return `${q.a} ${op("+")} ${q.b} ${op("+")} ${q.c} ${op("=")} <span class="slot">?</span>`;
  if(q.kind === "missing") return `${q.a} ${op("+")} <span class="slot">?</span> ${op("=")} ${q.sum}`;
  return "";
}
function thingsRow(count, faded, thing){
  let html = "";
  for(let i = 0; i < count; i++){
    html += `<span class="${i >= count - faded ? "gone" : ""}" style="animation-delay:${Math.min(i * 30, 400)}ms">${THINGS[thing]}</span>`;
  }
  return html;
}

/* Stora tal ritas i tiobasramar: varje ram rymmer tio saker. Fyra fulla ramar
   och sju lösa läses som 47 utan att man behöver räkna om från början. */
function thingsFrames(count, faded, thing){
  let html = "";
  for(let start = 0; start < count; start += 10){
    const antal = Math.min(10, count - start);
    let inner = "";
    for(let i = 0; i < antal; i++){
      const nr = start + i;
      inner += `<span class="${nr >= count - faded ? "gone" : ""}" style="animation-delay:${Math.min(nr * 14, 520)}ms">${THINGS[thing]}</span>`;
    }
    html += `<span class="ram ${antal < 10 ? "del" : ""}">${inner}</span>`;
  }
  return `<span class="ramar">${html}</span>`;
}

/* En hög saker: små tal som en rad om fem, stora som tiobasramar */
function hogHTML(count, faded, thing){
  return count > 10 ? thingsFrames(count, faded, thing)
                    : `<span class="grp five">${thingsRow(count, faded, thing)}</span>`;
}
function visualHTML(q){
  const t = g.thing;
  /* Räknebanorna går ut på att räkna – sakerna syns alltid */
  if(q.kind === "count") return hogHTML(q.count, 0, t);
  if(!P().settings.dots && !g.hint) return "";
  /* Hjälpen ska räcka hela vägen upp till tjugo, annars tänds den när barnet
     behöver den mest och visar ingenting. */
  if(q.kind === "add"){
    if(q.a + q.b > 20) return "";
    return `<span class="grp">${thingsRow(q.a, 0, t)}</span><span class="plus">+</span><span class="grp">${thingsRow(q.b, 0, t)}</span>`;
  }
  if(q.kind === "add3"){
    if(q.a + q.b + q.c > 20) return "";
    return `<span class="grp">${thingsRow(q.a, 0, t)}</span><span class="plus">+</span>` +
           `<span class="grp">${thingsRow(q.b, 0, t)}</span><span class="plus">+</span>` +
           `<span class="grp">${thingsRow(q.c, 0, t)}</span>`;
  }
  if(q.kind === "sub")     return hogHTML(q.a, q.b, t);
  if(q.kind === "missing") return hogHTML(q.sum, q.sum - q.a, t);
  return "";
}
function paintQuestion(){
  const q = g.q;
  qLabel.textContent = labelFor(q);
  qVisual.innerHTML = visualHTML(q);
  const n = qVisual.querySelectorAll("svg").length;
  const ramar = !!qVisual.querySelector(".ram");
  const storlek = n === 0 ? ""
    : ramar ? (n > 60 ? " ram-xs" : n > 30 ? " ram-s" : " ram-m")
    : n <= 3 ? " jatte" : n <= 6 ? " stor" : n <= 10 ? "" : n <= 14 ? " dense" : " packed";
  qVisual.className = "q-visual" + storlek + (q.kind === "add3" && !ramar ? " trio packed" : "");
  qEquation.innerHTML = equationHTML(q);
  qEquation.style.display = q.kind === "count" ? "none" : "";
}

function makeOptions(q, n){
  const out = [q.answer], near = [];
  if(q.kind === "add")     near.push(Math.abs(q.a - q.b));
  if(q.kind === "sub")     near.push(q.a + q.b);
  if(q.kind === "add3")    near.push(q.a + q.b, q.b + q.c);
  if(q.kind === "missing") near.push(q.sum, q.a);
  if(q.kind === "count" && q.answer > 12) near.push(q.answer + 1, q.answer - 1, q.answer + 10, q.answer - 10);
  near.push(q.answer + 1, q.answer - 1, q.answer + 2, q.answer - 2, q.answer + 3, q.answer - 3, q.answer + 4);
  const tak = Math.max(30, q.answer + 12);
  for(const v of near){
    if(out.length >= n) break;
    if(v >= 0 && v <= tak && out.indexOf(v) === -1) out.push(v);
  }
  let extra = q.answer + 5;
  while(out.length < n){ if(out.indexOf(extra) === -1 && extra >= 0) out.push(extra); extra++; }
  return shuffle(out);
}

function renderAnswerArea(){
  if(g.mode === "choice"){
    const n = g.q.opts || g.level.opts;
    g.opts = makeOptions(g.q, n);
    answerArea.innerHTML = `<div class="options ${n === 3 ? "three" : ""}">` +
      g.opts.map((v, i) => `<button type="button" class="btn opt c${i}" data-val="${v}">${v}</button>`).join("") + `</div>`;
  }else{
    answerArea.innerHTML = `
      <div class="typed">
        <div class="answer-display empty" id="display">?</div>
        <div class="keypad">
          ${[1,2,3,4,5,6,7,8,9].map(n => `<button type="button" class="btn key num" data-key="${n}">${n}</button>`).join("")}
          <button type="button" class="btn key del" data-key="del" aria-label="Sudda">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11v14H9L3 12z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg>
          </button>
          <button type="button" class="btn key num" data-key="0">0</button>
          <button type="button" class="btn key ok" data-key="ok" aria-label="Svara">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6"/></svg>
          </button>
        </div>
      </div>`;
  }
}
function updateDisplay(){
  const d = el("display"); if(!d) return;
  d.textContent = g.typed === "" ? "?" : g.typed;
  d.className = "answer-display" + (g.typed === "" ? " empty" : "");
}

/* ── Svarshantering ─────────────────────── */
function answer(value, sourceEl){
  if(g.locked) return;
  const q = g.q;
  const right = Number(value) === q.answer;
  g.tries++;

  if(right){
    g.locked = true;
    const firstTry = g.tries === 1;
    if(firstTry){ g.streak++; g.firstTry++; g.bestStreak = Math.max(g.bestStreak, g.streak); }
    else g.streak = 0;

    if(g.tram && g.level.id === -1) justeraSkill(P(), firstTry ? "ratt" : "hjalp");
    const mult = g.streak >= 6 ? 3 : g.streak >= 3 ? 2 : 1;
    const gain = firstTry ? 10 * mult : 5;
    g.score += gain;
    g.results[g.qIndex] = firstTry ? "first" : "help";

    if(sourceEl) sourceEl.classList.add("right");
    else { const d = el("display"); if(d) d.classList.add("right"); }

    SFX.correct();
    later(() => { SFX.coin(); bumpCoins(); }, 220);
    setBuddy("happy", "cheer");
    const r = buddy.getBoundingClientRect();
    confetti(r.left + r.width / 2, r.top + r.height / 2, firstTry ? 46 : 26);

    feedback.innerHTML = `<span class="bubble good">${pick(PRAISE)} +${gain}
      ${mult > 1 ? `<span class="combo">${g.streak} i rad — ×${mult} poäng!</span>` : ""}</span>`;
    const svit = g.streak === 3 || g.streak === 6;
    if(svit) speak(g.streak + " rätt i rad!");

    /* Extra beröm behöver längre paus, annars hinner varken texten läsas
       eller rösten tala innan nästa fråga börjar. */
    later(() => { g.qIndex++; nextQuestion(); }, svit ? 2400 : mult > 1 ? 1700 : 1250);
    return;
  }

  /* Fel svar — mjukt, aldrig minuspoäng */
  SFX.wrong();
  setBuddy("sad", "oops");
  if(sourceEl){ sourceEl.classList.add("wrong"); sourceEl.disabled = true; }
  else {
    const d = el("display");
    /* Vid tredje felet skrivs facit in i rutan strax nedan – då får den inte
       nollställas av den här fördröjningen. */
    if(d){ d.classList.add("wrong"); if(g.tries < 3) later(() => { g.typed = ""; updateDisplay(); }, 550); }
  }

  if(g.tries >= 3){
    g.locked = true;
    g.results[g.qIndex] = "help";
    if(g.tram && g.level.id === -1) justeraSkill(P(), "ned");
    /* Skriv in facit där barnet letade efter det – i svarsrutan, på rätt ruta
       och i själva talet – i stället för att bara säga siffran i en bubbla. */
    if(g.mode === "type"){
      g.typed = String(q.answer);
      updateDisplay();
      const d = el("display"); if(d) d.classList.add("right");
    }else{
      const ratt = [...answerArea.querySelectorAll(".opt")].find(x => Number(x.dataset.val) === q.answer);
      if(ratt){ ratt.disabled = false; ratt.classList.remove("wrong"); ratt.classList.add("right"); }
    }
    qEquation.style.display = "";
    qEquation.innerHTML = q.kind === "count"
      ? `<span class="facit">${q.answer}</span>`
      : equationHTML(q).replace('<span class="slot">?</span>', `<span class="facit">${q.answer}</span>`);
    feedback.innerHTML = `<span class="bubble soft">Svaret är ${q.answer}. Nu tar vi nästa!</span>`;
    speak("Svaret är " + q.answer);
    later(() => { g.qIndex++; nextQuestion(); }, 2400);
    return;
  }
  if(!g.hint){
    g.hint = true;
    paintQuestion();
    feedback.innerHTML = `<span class="bubble soft">Räkna sakerna!</span>`;
  }else{
    feedback.innerHTML = `<span class="bubble soft">${pick(NUDGE)}</span>`;
  }
}

answerArea.addEventListener("click", (e) => {
  const opt = e.target.closest("[data-val]");
  if(opt){ answer(opt.dataset.val, opt); return; }
  const key = e.target.closest("[data-key]");
  if(!key) return;
  const k = key.dataset.key;
  if(k === "del"){ g.typed = g.typed.slice(0, -1); SFX.tap(); updateDisplay(); }
  else if(k === "ok"){ if(g.typed !== "") answer(g.typed, null); }
  else if(g.typed.length < 3){ g.typed += k; SFX.tap(); updateDisplay(); }
});

addEventListener("keydown", (e) => {
  if(!el("screen-game").classList.contains("is-active") || g.locked) return;
  if(overlay.classList.contains("open")) return;
  if(g.mode === "type"){
    if(/^[0-9]$/.test(e.key)){ if(g.typed.length < 3){ g.typed += e.key; SFX.tap(); updateDisplay(); } }
    else if(e.key === "Backspace"){ g.typed = g.typed.slice(0, -1); updateDisplay(); }
    else if(e.key === "Enter" && g.typed !== ""){ answer(g.typed, null); }
  }else if(/^[1-4]$/.test(e.key)){
    const btn = answerArea.querySelectorAll(".opt")[Number(e.key) - 1];
    if(btn && !btn.disabled) answer(btn.dataset.val, btn);
  }
});

/* ═══════════════════════════════════════════
   Resultat, upplåsning och nya märken
   ═══════════════════════════════════════════ */
function finishRound(){
  const p = P(), L = g.level;
  const perfect = g.firstTry;
  p.coins += g.score;
  p.bestStreak = Math.max(p.bestStreak || 0, g.bestStreak);
  if(g.tram) return finishTramStop(p, perfect);
  const stars = perfect >= 9 ? 3 : perfect >= 7 ? 2 : perfect >= 4 ? 1 : 0;

  const prevStars = (p.stars || {})[L.id] || 0;
  const bestKey = L.id + ":" + g.mode;
  const prevBest = p.best[bestKey] || 0;
  const isBest = g.score > prevBest;

  p.rounds = (p.rounds || 0) + 1;
  p.stars[L.id] = Math.max(prevStars, stars);
  p.best[bestKey] = Math.max(prevBest, g.score);
  if(perfect === ROUND_LEN) p.perfect = (p.perfect || 0) + 1;

  /* Nästa bana öppnas när den här är klarad med minst en stjärna */
  let unlocked = null;
  if(stars > 0 && L.id === p.unlocked && L.id < LEVELS.length){
    p.unlocked = L.id + 1;
    unlocked = levelById(p.unlocked);
  }
  saveProfiles();
  const nya = newBadges(p);

  el("resultBuddy").innerHTML = charSVG(p.char, stars ? "happy" : "idle");
  el("resultStars").innerHTML = [0,1,2].map(i => i < stars ? STAR_ON : STAR_OFF).join("");
  const titles = ["Bra kämpat!", "Fint jobbat!", "Superbra!", "Helt fantastiskt!"];
  el("resultTitle").textContent = titles[stars];
  el("resultLand").hidden = false; el("resultTram").hidden = true;
  el("resultSub").textContent = `${perfect} av ${ROUND_LEN} rätt direkt · ${L.name}`;
  el("resultScore").innerHTML =
    `<div class="reward-row" style="grid-column:1/-1;width:100%">
       <span class="reward ny">${COIN_SVG}<span><span class="r-num">+${g.score}</span><span class="r-txt">nya mynt</span></span></span>
       <span class="reward">${KISTA_SVG}<span><span class="r-num">${p.coins}</span><span class="r-txt">i skattkistan</span></span></span>
     </div>
     <span class="score-chip">Rekord <b>${p.best[bestKey]}</b></span>
     <span class="score-chip">Stjärnor <b>${totalStars(p)}/${MAX_STARS}</b></span>` +
    (isBest && prevBest > 0 ? `<span class="new-best">Nytt rekord!</span>` : "");
  el("resultUnlock").innerHTML = unlocked
    ? `<span class="unlock-note">${NYCKEL_SVG} Ny bana öppen: ${unlocked.name}!</span>`
    : (stars === 0 ? `<span class="unlock-note" style="background:#FFF3CF;border-color:var(--sun-deep)">Ta minst 4 rätt direkt så öppnas nästa bana.</span>` : "");

  show("result");
  SFX.win();
  if(stars){
    later(() => confetti(innerWidth * 0.3, innerHeight * 0.4, 60), 150);
    later(() => confetti(innerWidth * 0.7, innerHeight * 0.4, 60), 450);
  }
  const namn = p.name;
  let spoken = stars === 3 ? `Helt fantastiskt, ${namn}! Tre stjärnor!`
    : stars ? `Fint jobbat, ${namn}! Du fick ${stars === 1 ? "en stjärna" : stars + " stjärnor"}!`
    : `Bra kämpat, ${namn}! Vi provar igen.`;
  if(unlocked) spoken += " Nu är en ny bana öppen!";
  speak(spoken);

  if(nya.length) later(() => celebrateBadges(nya), 2600);
}


/* Framme vid en hållplats: kort summering och en enda knapp vidare */
function finishTramStop(p, perfect){
  const l = lineByRef(g.tram);
  const at = tramAt(p, g.tram);

  /* Att åka spårvagn ska också föra spelaren framåt: en felfri hållplats på
     den svåraste banan man har öppen (eller på Blandat) öppnar nästa bana.
     Annars vore man tvungen att spela Räknelandet för att få svårare tal. */
  let nyBana = null;
  const påTopp = p.tramLevel <= 0 || p.tramLevel === p.unlocked;
  if(perfect === g.len) p.tramPerfect = (p.tramPerfect || 0) + 1;
  /* Fyra av fem räcker. Ett enda feltryck ska inte stoppa en fyraåring. */
  if(perfect >= g.len - 1 && påTopp && p.unlocked < LEVELS.length){
    p.unlocked += 1;
    nyBana = levelById(p.unlocked);
  }
  const nästa = Math.min(at + 1, l.stops.length - 1);
  p.tram = p.tram || {};
  p.tram[g.tram] = nästa;
  p.stopsRidden = (p.stopsRidden || 0) + 1;
  if(nästa >= l.stops.length - 1){
    p.linesDone = p.linesDone || [];
    if(!p.linesDone.includes(g.tram)) p.linesDone.push(g.tram);
  }
  saveProfiles();
  tripFrom = at;
  const nya = newBadges(p);

  el("resultLand").hidden = true;
  el("resultTram").hidden = false;
  el("resultTram").innerHTML = `
    ${roundel(l, "lg")}
    <h2 style="margin-top:8px">Bra åkt!</h2>
    <p class="sheet-sub" style="margin:4px 0 0">${perfect} av ${g.len} rätt direkt</p>
    <div class="reward-row">
      <span class="reward ny">${COIN_SVG}<span><span class="r-num">+${g.score}</span><span class="r-txt">nya mynt</span></span></span>
      <span class="reward">${KISTA_SVG}<span><span class="r-num">${p.coins}</span><span class="r-txt">i skattkistan</span></span></span>
    </div>
    ${nyBana ? `<span class="unlock-note">${NYCKEL_SVG} Ny bana öppen: ${nyBana.name}!</span>` : ""}
    <button class="btn btn-big" id="rideOnBtn" type="button">Åk vidare!</button>`;
  el("rideOnBtn").addEventListener("click", () => {
    SFX.tap();
    openTrip(g.tram, true);
  }, { once: true });

  show("result");
  SFX.win();
  confetti(innerWidth / 2, innerHeight * 0.42, 34);
  speak(nyBana ? `Bra åkt! Ny bana öppen: ${nyBana.name}!` : `Bra åkt! ${g.score} mynt.`);
  /* Fira märket här, inte när vagnen rullar in – annars skyms hållplatsen */
  if(nya.length) later(() => celebrateBadges(nya), 900);
}

function newBadges(p){
  const nya = [];
  for(const b of BADGES){
    if(!p.badges.includes(b.id) && b.test(p)){ p.badges.push(b.id); nya.push(b); }
  }
  if(nya.length) saveProfiles();
  return nya;
}

function celebrateBadges(list){
  if(!list.length){ closeSheet(); return; }
  const b = list[0];
  SFX.badge();
  confetti(innerWidth / 2, innerHeight * 0.45, 70);
  openSheet(`
    <div class="cheer-card">
      <span class="b-art">${badgeArt(b.art)}</span>
      <p class="sheet-sub" style="margin:0">Nytt märke!</p>
      <h2>${b.name}</h2>
      <p class="sheet-sub">${b.desc}</p>
      <button class="btn btn-big" data-action="close" type="button" style="margin-top:14px">${list.length > 1 ? "Nästa märke" : "Toppen!"}</button>
    </div>`);
  sheet.querySelector('[data-action="close"]').addEventListener("click", () => {
    if(list.length > 1) later(() => celebrateBadges(list.slice(1)), 220);
  }, { once: true });
  speak(`Nytt märke! ${b.name}!`);
}

el("againBtn").addEventListener("click", () => { SFX.tap(); startRound(g.level, g.mode); });
el("backBtn").addEventListener("click", () => { SFX.tap(); enterWorld(false); });
el("homeBtn").addEventListener("click", () => {

   Igång!
   ═══════════════════════════════════════════ */
/* Ligger spelet på en egen adress med manifest sparas det för spel utan nät.
   I artifact-visaren finns inget manifest, och då hoppas registreringen över. */
if("serviceWorker" in navigator && location.protocol.startsWith("http")
   && document.querySelector('link[rel="manifest"]')){
  addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}

(function init(){
  /* Äldre sparfiler kan sakna fält som tillkommit senare */
  profiles.forEach(p => {
    p.stars = p.stars || {}; p.best = p.best || {}; p.badges = p.badges || [];
    p.coins = p.coins || 0; p.unlocked = p.unlocked || 1;
    p.tram = p.tram || {}; p.world = p.world || "land";
    p.tramMode = p.tramMode || "choice"; p.stopsRidden = p.stopsRidden || 0;
    /* Stigande är nytt standardläge. Flytta över den som aldrig valt själv,
       en enda gång, så ett medvetet val av Blandat får stå kvar sedan. */
    if(!p.stigandeFlytt){ if(p.tramLevel == null || p.tramLevel === 0) p.tramLevel = -1; p.stigandeFlytt = true; }
    p.linesDone = p.linesDone || [];
    p.settings = Object.assign({ sound:true, voice:true, dots:true, rate:1 }, p.settings || {});
  });
